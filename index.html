<style>
:root{--bg:#0f1117;--sf:#1c1f2a;--sf2:#232636;--bd:#2a2d3a;--tx:#e8eaed;--td:#8b8fa3;--tx3:#565a6e;--ac:#3ecf8e;--ok:#22c55e;--no:#ef4444;--warn:#f59e0b;--info:#3b82f6;--purple:#a78bfa}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;overflow-x:hidden}
input,select,textarea,button{font-family:inherit;outline:none}
.hide{display:none!important}

/* Layout */
.hdr{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--bg);z-index:10}
.hdr h1{font-size:17px;letter-spacing:-.3px}
.hdr .sub{font-size:11px;color:var(--td)}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:6px}
.cnt{padding:0 16px 100px}
.btn-icon{width:38px;height:38px;border-radius:10px;border:1px solid var(--bd);background:var(--sf);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--td);font-size:16px}

/* Forms */
.inp{width:100%;height:46px;border-radius:10px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);padding:0 14px;font-size:14px}
.inp:focus{border-color:var(--ac)}
.sel{width:100%;height:46px;border-radius:10px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);padding:0 14px;font-size:14px;appearance:none}
.ta{width:100%;border-radius:10px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);padding:10px 14px;font-size:13px;resize:vertical}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:10px}
.stitle{font-size:11px;font-weight:700;color:var(--td);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 6px}

/* Progress */
.prog{width:100%;height:6px;border-radius:3px;background:var(--bd);overflow:hidden}
.prog-f{height:100%;border-radius:3px;transition:width .8s ease}
.done{background:var(--ok)!important}

/* Buttons */
.btn{width:100%;padding:14px;border-radius:12px;font-size:15px;font-weight:700;border:none;cursor:pointer;transition:all .2s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--ac);color:#000}
.btn-danger{background:var(--no);color:#fff}
.btn-info{background:var(--info);color:#fff}
.btn-warn{background:var(--warn);color:#000}
.btn-ghost{background:transparent;border:1px solid var(--bd);color:var(--td)}

/* Mode cards */
.mode-card{width:100%;max-width:340px;padding:28px 20px;border-radius:16px;color:#fff;font-size:18px;font-weight:700;cursor:pointer;text-align:left;border:2px solid;transition:transform .2s}
.mode-card:active{transform:scale(.97)}

/* Tracker list */
.tr-item{display:block;width:100%;text-align:left;padding:12px;border-radius:10px;background:var(--sf);border:1px solid var(--bd);margin-bottom:6px;cursor:pointer;transition:border-color .2s}
.tr-item:active{border-color:var(--ac)}

/* Status badges */
.badge{font-size:10px;padding:3px 8px;border-radius:10px;font-weight:600;display:inline-flex;align-items:center;gap:3px}

/* Punchlist */
.pl-item{padding:12px;border-radius:10px;background:var(--sf);border:1px solid var(--bd);margin-bottom:6px}

/* Online indicator */
.online-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}
.online-dot.on{background:var(--ok);animation:pulse 2s infinite}
.online-dot.off{background:var(--no)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* Login */
.login-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.login-card{width:100%;max-width:360px;padding:32px 24px;border-radius:20px;background:var(--sf);border:1px solid var(--bd)}
.login-logo{font-size:11px;letter-spacing:3px;color:var(--tx3);text-transform:uppercase;text-align:center;margin-bottom:8px}
.login-title{font-size:24px;font-weight:700;text-align:center;margin-bottom:4px}
.login-sub{font-size:12px;color:var(--td);text-align:center;margin-bottom:24px}
.login-err{font-size:12px;color:var(--no);text-align:center;margin-top:8px;min-height:18px}

/* Toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:999;transition:opacity .3s;pointer-events:none}
</style>

var _toastTimer=null;
function toast(msg,color){showToast(msg,color)}
function showToast(msg,color){
  if(_toastTimer)clearTimeout(_toastTimer);
  var t=document.getElementById('toast');

  t.style.opacity=1;_toastTimer=setTimeout(function(){t.style.opacity=0},2500);

function isAdmin(){return U&&(U.role==='admin'||ADMIN_EMAILS.indexOf(U.email)>=0)}
function isCon(){return U&&(U.role==='construccion'||U.role==='supervisor'||isAdmin())}
function isCal(){return U&&(U.role==='calidad'||U.role==='supervisor'||isAdmin())}

// Firebase write helper
function fbSet(path,val){return db.ref(path).set(val)}
function fbPush(path,val){return db.ref(path).push(val)}
function fbGet(path){return db.ref(path).once('value').then(function(s){return s.val()})}
function fbListen(path,cb){db.ref(path).on('value',function(s){cb(s.val())})}

function rRegister(a){
  var h='<div class="login-wrap">';

  h+='<div class="login-title" style="font-size:20px">Crear Cuenta</div>';

  h+='<option value="supervisor">Supervisor</option>';
  h+='</select>';
  h+='<button class="btn btn-primary" onclick="doRegister()">Crear cuenta</button>';

  h+='<div style="text-align:center;margin-top:16px">';
  h+='<button onclick="V.screen=\'login\';R()" style="background:none;border:none;color:var(--td);font-size:12px;cursor:pointer">← Volver al login</button>';

function doLogin(){
  var email=document.getElementById('l-email').value.trim();
  var pass=document.getElementById('l-pass').value;
  document.getElementById('l-err').textContent='Conectando...';
  auth.signInWithEmailAndPassword(email,pass).catch(function(e){
    var msg=e.code==='auth/user-not-found'?'Usuario no encontrado':e.code==='auth/wrong-password'?'Contraseña incorrecta':'Error: '+e.message;
    document.getElementById('l-err').textContent=msg;
  });
}

function doRegister(){
  var name=document.getElementById('r-name').value.trim();
  var email=document.getElementById('r-email').value.trim();
  var pass=document.getElementById('r-pass').value;
  var role=document.getElementById('r-role').value;
  if(!name||!email||!pass){document.getElementById('r-err').textContent='Rellena todos los campos';return}
  document.getElementById('r-err').textContent='Creando cuenta...';
  auth.createUserWithEmailAndPassword(email,pass).then(function(cred){
    return db.ref('users/'+cred.user.uid).set({name:name,email:email,role:role,created:Date.now()});
  }).catch(function(e){
    document.getElementById('r-err').textContent=e.message;
  });
}

    });

// ============================================================
// REALTIME LISTENERS
// ============================================================
function initListeners(){
  // Listen to workflow changes
  db.ref('workflow').on('value',function(s){
    CACHE.workflow=s.val()||{};
    // Re-render if on a workflow-dependent screen
    if(V.screen==='resumen'||V.screen==='condetail'||V.screen==='caldetail')R();
  });
  
  // Listen to punchlist changes
  db.ref('punchlist').on('value',function(s){
    CACHE.punchlist=s.val()||{};
    if(V.screen==='condetail'||V.screen==='caldetail')R();
  });
}

// ============================================================
// WORKFLOW
// ============================================================
var WF_STATES={
  CON:{l:'En construcción',c:'var(--info)',i:'🏗️',bg:'rgba(59,130,246,.15)'},
  REV:{l:'Pdte revisión',c:'var(--warn)',i:'📋',bg:'rgba(245,158,11,.15)'},
  CAL:{l:'En revisión',c:'var(--purple)',i:'🔍',bg:'rgba(167,139,250,.15)'},
  OK:{l:'Completado',c:'var(--ac)',i:'✅',bg:'rgba(34,197,94,.15)'},
  PUN:{l:'Punchlist',c:'var(--no)',i:'📝',bg:'rgba(239,68,68,.15)'},
  REP:{l:'En reparación',c:'var(--warn)',i:'🔧',bg:'rgba(245,158,11,.15)'},
  RREV:{l:'Pdte re-revisión',c:'var(--warn)',i:'📋',bg:'rgba(245,158,11,.15)'}
};
var WF_PHASES=['hincado','montaje','modulos'];
var WF_LABELS={hincado:'Hincado',montaje:'Montaje Estructura',modulos:'Montaje Módulos'};

function getWFState(pv,sub,phase){
  var wf=CACHE.workflow||{};
  var key=pv+'_'+sub+'_'+phase;
  return wf[key]||{state:'CON',since:0,by:'',trigger:'init'};
}

function setWFState(pv,sub,phase,state,trigger){
  var key=pv+'_'+sub+'_'+phase;
  var data={state:state,since:firebase.database.ServerValue.TIMESTAMP,by:U.name,trigger:trigger||'manual',uid:U.uid};
  db.ref('workflow/'+key).set(data);
  // Log
  db.ref('workflow_log').push({key:key,state:state,by:U.name,uid:U.uid,trigger:trigger,ts:firebase.database.ServerValue.TIMESTAMP});
  toast('Estado: '+WF_STATES[state].i+' '+WF_STATES[state].l,'var(--sf)');
}

function wfBadge(pv,sub,phase){
  var wf=getWFState(pv,sub,phase);
  var st=WF_STATES[wf.state]||WF_STATES.CON;
  return '<span class="badge" style="background:'+st.bg+';color:'+st.c+'">'+st.i+' '+st.l+'</span>';
}

// ============================================================
// PUNCHLIST
// ============================================================
function getPLItems(pv,sub,phase){
  var pl=CACHE.punchlist||{};
  var items=[];
  Object.keys(pl).forEach(function(id){
    var p=pl[id];
    if(String(p.pv)===String(pv)&&String(p.sub)===String(sub)&&p.phase===phase){
      items.push({id:id,d:p});
    }
  });
  return items;
}

function addPLItem(pv,sub,phase,tracker,pilar,campo,desc){
  db.ref('punchlist').push({
    pv:pv,sub:sub,phase:phase,tracker:tracker,pilar:pilar,campo:campo,desc:desc,
    estado:'pendiente',
    detectadoPor:U.name,uid:U.uid,fechaDeteccion:firebase.database.ServerValue.TIMESTAMP
  });
  toast('Añadido al punchlist','var(--no)');
}

function setPLEstado(id,estado){
  var updates={estado:estado};
  if(estado==='reparado'){updates.reparadoPor=U.name;updates.reparadoUid=U.uid;updates.fechaReparacion=firebase.database.ServerValue.TIMESTAMP}
  if(estado==='verificado'){updates.verificadoPor=U.name;updates.verificadoUid=U.uid;updates.fechaVerificacion=firebase.database.ServerValue.TIMESTAMP}
  db.ref('punchlist/'+id).update(updates);
  toast(estado==='reparado'?'Marcado como reparado':'Verificado','var(--ac)');
}

// ============================================================
// CONSTRUCTION DATA (Firebase)
// ============================================================
function setConField(code,key,val){
  if(V.viewOnly){showToast('Solo lectura','var(--warn)');return}
  var updates={};
  updates['construction/'+code+'/'+key]=val;
  updates['construction/'+code+'/'+key+'_ts']=firebase.database.ServerValue.TIMESTAMP;
  updates['construction/'+code+'/'+key+'_by']=U.name;
  db.ref().update(updates).then(function(){
    showToast('✅ Guardado','var(--ac)');updLastSave();
  }).catch(function(err){
    showToast('⚠️ Error: '+err.message+' — reintentando...','var(--no)');
    setTimeout(function(){db.ref().update(updates)},3000);
  });
  db.ref('con_log').push({tracker:code,field:key,value:String(val),by:U.name,uid:U.uid,ts:firebase.database.ServerValue.TIMESTAMP});
}

function getConData(code,cb){
  DBG('getConData '+code);
  db.ref('construction/'+code).once('value',function(s){cb(s.val()||{})});
}

// ============================================================
// QUALITY DATA (Firebase)
// ============================================================
function setQualField(code,key,val){
  db.ref('quality/'+code+'/'+key).set(val);
  db.ref('quality_log').push({tracker:code,field:key,value:String(val),by:U.name,uid:U.uid,ts:firebase.database.ServerValue.TIMESTAMP});
}

// setQF — debounced wrapper for quality writes
var _qfTimers={};
function setQF(code,key,val){
  if(V.viewOnly){showToast('Solo lectura','var(--warn)');return}
  var tk=code+'_'+key;
  if(_qfTimers[tk])clearTimeout(_qfTimers[tk]);
  _qfTimers[tk]=setTimeout(function(){
    delete _qfTimers[tk];
    setQualField(code,key,val);
    showToast('✅ Guardado','var(--ac)');
    updLastSave();
  },300);
}

function updLastSave(){
  var el=document.getElementById('lastSave');
  if(el)el.textContent='Guardado: '+new Date().toLocaleTimeString('es-ES');
}

function getQualData(code,cb){
  DBG('getQualData '+code);
  db.ref('quality/'+code).once('value',function(s){cb(s.val()||{})});
}

// ============================================================
// QUALITY FIELD DEFINITIONS (from v1)
// ============================================================
var PCFG={
  monofila_corto:{motor:['2N-MP','1N-MP','MP','1S-MP','2S-MP'],conducida:null},

// CONSTRUCTION SELECT (PV → Sub → Tracker)
function rConSelect(a){
  var pvs=[...new Set(Object.values(MASTER_DATA).map(function(d){return d.pv}))].sort(function(a2,b){return a2-b});
  var h='<div class="hdr"><button class="btn-icon" onclick="V.screen=\'modesel\';R()">←</button><div><h1>🏗️ Construcción</h1><div class="sub">Selecciona zona</div></div></div>';
  h+='<div class="cnt" style="padding-top:14px">';

function renderConSubs(){
  DBG('renderConSubs pv='+V.conPv);
  var pv=V.conPv||0;
  var subsEl=document.getElementById('con-subs');
  var listEl=document.getElementById('con-list');
  if(!pv){subsEl.innerHTML='';listEl.innerHTML='';return}
  
  var subs=[...new Set(Object.values(MASTER_DATA).filter(function(d){return d.pv===pv&&d.sub>0}).map(function(d){return d.sub}))].sort(function(a,b){return a-b});
  
  if(subs.length>0&&!V.conSub){
    // Show subcampo cards
    var h='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px">';
    subs.forEach(function(s){
      h+='<button onclick="V.conSub='+s+';renderConList()" style="padding:12px;border-radius:10px;background:var(--sf);border:2px solid var(--bd);cursor:pointer;text-align:center">';
      h+='<div style="font-weight:700;font-size:14px;color:var(--tx)">Sub '+s+'</div>';
      h+='<div style="margin-top:4px">'+wfBadge(pv,s,'hincado')+'</div>';
      h+='</button>';
    });
    h+='</div>';
    subsEl.innerHTML=h;
    listEl.innerHTML='';
  }else{
    subsEl.innerHTML=subs.length>0?'<select class="sel" onchange="V.conSub=parseInt(this.value);renderConList()"><option value="">Subcampo</option>'+subs.map(function(s){return'<option value="'+s+'"'+(V.conSub===s?' selected':'')+'>Sub '+s+'</option>'}).join('')+'</select>':'';
    renderConList();
  }
}

function renderConList(){
  DBG('renderConList pv='+V.conPv+' sub='+V.conSub);
  var pv=V.conPv,sub=V.conSub||0;
  var listEl=document.getElementById('con-list');
  if(!listEl||!pv)return;
  
  var codes=Object.keys(MASTER_DATA).filter(function(code){
    var d=MASTER_DATA[code];
    return d.pv===pv&&(!sub||d.sub===sub);
  }).sort();
  
  // Workflow button
  var h='';
  if(sub){
    h+='<button onclick="V.screen=\'condetail\';R()" class="btn btn-ghost" style="margin-bottom:10px;font-size:13px">📋 Workflow · '+wfBadge(pv,sub,'hincado')+'</button>';
  }
  
  codes.forEach(function(code){
    var d=MASTER_DATA[code];
    h+='<button class="tr-item" onclick="V.conTr=\''+code+'\';V.screen=\'contractor\';V.conPi=0;V.conFila=\'motor\';R()">';
    h+='<div style="display:flex;justify-content:space-between;align-items:center">';
    h+='<div><span style="font-weight:700;font-size:18px;margin-right:8px">'+d.num+'</span><span style="font-size:11px;color:var(--td)">'+d.type+'</span></div>';
    h+='</div></button>';
  });
  
  listEl.innerHTML=h;
}

// CONSTRUCTION TRACKER (pilar by pilar)
function rConTracker(a){
  var code=V.conTr;
  if(!code){V.screen='conselect';R();return}
  var m=MASTER_DATA[code];
  if(!m){V.screen='conselect';R();return}
  var cfg=PCFG[m.type];
  var fila=V.conFila||'motor';
  var pils=cfg[fila];
  var px=fila==='motor'?'fm':'fc';
  var pi=V.conPi||0;
  if(pi>=pils.length)pi=0;
  var pilarName=pils[pi];
  
  // Load construction data from Firebase
  a.innerHTML='<div class="hdr"><button class="btn-icon" onclick="V.screen=\'conselect\';R()">←</button><div><h1>🏗️ '+code+'</h1><div class="sub">Cargando...</div></div></div>';
  
  getConData(code,function(con){
    var filas=cfg.conducida?['motor','conducida']:['motor'];
    
    var h='<div class="hdr"><button class="btn-icon" onclick="V.screen=\'conselect\';R()">←</button><div><h1>🏗️ '+code+'</h1><div class="sub">'+m.type+(V.viewOnly?' · Solo lectura':'')+'</div></div></div>';
    h+='<div class="cnt" style="padding-top:6px">';
    if(V.viewOnly)h+='<div style="padding:8px 12px;border-radius:10px;background:rgba(245,158,11,.1);border:1px solid var(--warn);color:var(--warn);font-size:12px;text-align:center;margin-bottom:8px">👁️ Modo solo lectura</div>';
    
    // Fila tabs
    if(filas.length>1){
      h+='<div style="display:flex;gap:6px;margin-bottom:10px">';
      filas.forEach(function(f){
        var sel=f===fila;
        h+='<button onclick="V.conFila=\''+f+'\';V.conPi=0;R()" class="btn" style="flex:1;padding:10px;border:2px solid '+(sel?'var(--ac)':'var(--bd)')+';background:'+(sel?'rgba(62,207,142,.1)':'var(--sf)')+';color:'+(sel?'var(--ac)':'var(--td)')+';font-size:13px">Fila '+(f==='motor'?'Motor':'Conducida')+'</button>';
      });
      h+='</div>';
    }
    
    // Pillar buttons
    h+='<div style="display:flex;gap:4px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch">';
    pils.forEach(function(p,i){
      var est=con[px+'_'+i+'_estado']||'no_intentada';
      var icon=est==='hincada'?'🟢':est==='rechazo'?'🔴':'⬜';
      var bdColor=est==='hincada'?'var(--ok)':est==='rechazo'?'var(--no)':'var(--bd)';
      var cls2=i===pi?'outline:2px solid var(--ac);outline-offset:2px;':'';
      h+='<button onclick="V.conPi='+i+';R()" style="flex-shrink:0;min-width:52px;padding:6px 8px;border-radius:8px;font-size:11px;font-weight:700;text-align:center;border:2px solid '+bdColor+';background:transparent;color:var(--tx);cursor:pointer;'+cls2+'">'+p+'<div style="font-size:14px;margin-top:2px">'+icon+'</div></button>';
    });
    h+='</div>';
    
    // Design data
    var posMap={'4N-MP':'4NW','3N-MP':'3NW','2N-MP':'2NW','1N-MP':'1NW','MP':'MOTORA-W','1S-MP':'1SW','2S-MP':'2SW','3S-MP':'3SW','4S-MP':'4SW','4N':'4NE','3N':'3NE','2N':'2NE','1N':'1NE','MP-FC':'CARDAN-E','1S':'1SE','2S':'2SE','3S':'3SE','4S':'4SE'};
    var conPos=posMap[pilarName]||pilarName;
    var supData=null;
    if(typeof MASTER_CON!=='undefined'&&MASTER_CON[code]){
      supData=MASTER_CON[code].find(function(s){return s.p===conPos});
    }
    
    h+='<div class="card" style="margin-top:10px">';
    h+='<div style="font-weight:700;font-size:16px;margin-bottom:10px">'+pilarName+(supData?' <span style="font-size:11px;color:var(--td)">'+conPos+'</span>':'')+'</div>';
    
    if(supData){
      // GPS proximity check
      if(navigator.geolocation){
        navigator.geolocation.getCurrentPosition(function(pos){
          var ll=utmToLL(supData.x,supData.y);
          var R2=6371000;
          var dLat=(ll.lat-pos.coords.latitude)*Math.PI/180;
          var dLon=(ll.lng-pos.coords.longitude)*Math.PI/180;
          var a2=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(pos.coords.latitude*Math.PI/180)*Math.cos(ll.lat*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
          var dist=R2*2*Math.atan2(Math.sqrt(a2),Math.sqrt(1-a2));
          var gpsEl=document.getElementById('gps-check');
          if(gpsEl){
            if(dist>10)gpsEl.innerHTML='<div style="padding:8px 12px;border-radius:10px;background:rgba(239,68,68,.15);border:1px solid var(--no);color:var(--no);font-size:12px;font-weight:600">⚠️ Estás a '+Math.round(dist)+'m — ¿soporte correcto?</div>';
            else if(dist>5)gpsEl.innerHTML='<div style="padding:8px 12px;border-radius:10px;background:rgba(245,158,11,.15);border:1px solid var(--warn);color:var(--warn);font-size:12px">📍 '+Math.round(dist)+'m</div>';
            else gpsEl.innerHTML='<div style="padding:8px 12px;border-radius:10px;background:rgba(34,197,94,.1);border:1px solid var(--ac);color:var(--ac);font-size:12px">✅ GPS OK — '+dist.toFixed(1)+'m</div>';
          }
        },{},{enableHighAccuracy:true});
      }
      h+='<div id="gps-check" style="margin-bottom:8px"></div>';
      h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px">';
      h+='<div style="padding:8px;border-radius:8px;background:var(--bg)"><div style="font-size:9px;color:var(--tx3)">PERFIL</div><div style="font-size:14px;font-weight:700;margin-top:2px">'+supData.pf+'</div></div>';
      h+='<div style="padding:8px;border-radius:8px;background:var(--bg)"><div style="font-size:9px;color:var(--tx3)">CIMENTACIÓN</div><div style="font-size:14px;font-weight:700;margin-top:2px">'+supData.ci+'</div></div>';

function renderCalSubs(){
  DBG('renderCalSubs pv='+V.calPv+' sub='+V.calSub);

  var subsEl=document.getElementById('cal-subs');
  var listEl=document.getElementById('cal-list');

  var subs=[...new Set(Object.values(MASTER_DATA).filter(function(d){return d.pv===pv&&d.sub>0}).map(function(d){return d.sub}))].sort(function(a,b){return a-b});

// QUALITY TRACKER (placeholder - will use existing cim/mont/mod logic)
function rQualTracker(a){
  var code=V.calTr;
  if(!code){V.screen='calselect';R();return}
  var m=MASTER_DATA[code];if(!m){V.screen='calselect';R();return}
  var cfg=PCFG[m.type];
  if(!V.qTab)V.qTab='cim';
  if(!V.qFila)V.qFila='motor';
  if(V.qPi==null)V.qPi=0;
  var viewOnly=V.viewOnly;
  
  a.innerHTML='<div class="hdr"><button class="btn-icon" onclick="V.screen=\'calselect\';R()">←</button><div><h1>✅ '+code+'</h1><div class="sub">Cargando...</div></div></div>';
  
  getQualData(code,function(qd){
    var filas=cfg.conducida?['motor','conducida']:['motor'];
    var fila=V.qFila;if(!cfg[fila])fila='motor';
    var pils=cfg[fila];
    var px=fila==='motor'?'fm':'fc';
    var pi=V.qPi||0;if(pi>=pils.length)pi=0;
    var mpI=getMPi(m.type);
    
    // Count progress
    var cimF=0,cimT=0;
    filas.forEach(function(fl){var ppx=fl==='motor'?'fm':'fc';cfg[fl].forEach(function(p,i){
      MED.forEach(function(f){if(f.isTramo&&i===mpI)return;cimT++;if(qd[ppx+'_'+i+'_'+f.id]!=null)cimF++});
      COMP.forEach(function(f){cimT++;if(qd[ppx+'_'+i+'_'+f.id]!=null)cimF++});
    })});
    var montF=0,montT=MONT_ITEMS.length;MONT_ITEMS.forEach(function(f){if(qd['mont_'+f.id]!=null)montF++});
    var modF=0,modT=MOD_ITEMS.length;MOD_ITEMS.forEach(function(f){if(qd['mod_'+f.id]!=null)modF++});
    var totalT=cimT+montT+modT,totalF=cimF+montF+modF;
    var pct=totalT>0?Math.round(totalF/totalT*100):0;
    var cimPct=cimT>0?Math.round(cimF/cimT*100):0;
    var montPct=montT>0?Math.round(montF/montT*100):0;
    var modPct=modT>0?Math.round(modF/modT*100):0;
    
    var h='<div class="hdr"><button class="btn-icon" onclick="V.screen=\'calselect\';R()">←</button><div><h1>✅ '+code+'</h1><div class="sub">PV'+String(m.pv).padStart(2,'0')+(m.sub?' / Sub '+m.sub:'')+' · '+m.type+'</div></div><div class="hdr-r"><div style="min-width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;background:'+(pct>=100?'var(--ac)':'var(--sf2)')+';color:'+(pct>=100?'#000':'var(--ac)')+'">'+pct+'%</div></div></div>';
    h+='<div class="cnt" style="padding-top:6px">';
    if(viewOnly)h+='<div style="padding:8px 12px;border-radius:10px;background:rgba(245,158,11,.1);border:1px solid var(--warn);color:var(--warn);font-size:12px;text-align:center;margin-bottom:8px">👁️ Solo lectura</div>';
    
    // Tab buttons
    h+='<div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap">';

function renderResumen(){
  var pv=V.resPv;
  var el=document.getElementById('res-content');
  if(!pv){el.innerHTML='';return}
  
  el.innerHTML='<div style="text-align:center;padding:20px;color:var(--td)">Cargando datos...</div>';
  
  var subs=[...new Set(Object.values(MASTER_DATA).filter(function(d){return d.pv===pv&&d.sub>0}).map(function(d){return d.sub}))].sort(function(a,b){return a-b});
  if(subs.length===0)subs=[0];
  
  // Fetch construction + quality data
  Promise.all([
    db.ref('construction').once('value'),
    db.ref('quality').once('value')
  ]).then(function(results){
    var conAll=results[0].val()||{};
    var qualAll=results[1].val()||{};
    
    var h='';
    subs.forEach(function(sub){
      var codes=Object.keys(MASTER_DATA).filter(function(code){
        var d=MASTER_DATA[code];
        return d.pv===pv&&(sub===0||d.sub===sub);
      });
      
      // Construction stats
      var conTotal=0,conHinc=0,conRech=0;
      codes.forEach(function(code){
        var con=conAll[code]||{};
        var cfg2=PCFG[MASTER_DATA[code].type];
        for(var f=0;f<(cfg2.conducida?2:1);f++){
          var px2=f===0?'fm':'fc';var pils2=f===0?cfg2.motor:cfg2.conducida;
          for(var i=0;i<pils2.length;i++){
            conTotal++;
            var est=con[px2+'_'+i+'_estado']||'';
            if(est==='hincada')conHinc++;
            else if(est==='rechazo')conRech++;
          }
        }
      });
      var conPct=conTotal>0?Math.round(conHinc/conTotal*100):0;
      
      // Quality stats
      var qualStarted=0,qualTotal=codes.length;
      codes.forEach(function(code){
        var qd=qualAll[code];
        if(qd&&Object.keys(qd).length>0)qualStarted++;
      });
      var qualPct=qualTotal>0?Math.round(qualStarted/qualTotal*100):0;
      
      h+='<div class="card">';
      h+='<div style="font-weight:700;font-size:16px;margin-bottom:10px">'+(sub?'Subcampo '+sub:'PV'+String(pv).padStart(2,'0'))+' <span style="font-size:12px;color:var(--td)">('+codes.length+' trackers)</span></div>';
      
      // Two-column stats
      h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">';
      
      var conColor=conPct>=100?'var(--ac)':conRech>0?'var(--no)':conHinc>0?'var(--info)':'var(--bd)';
      h+='<div style="padding:12px;border-radius:10px;background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.2)">';
      h+='<div style="font-size:11px;color:var(--info);font-weight:600">🏗️ CONSTRUCCIÓN</div>';
      h+='<div style="font-size:24px;font-weight:700;color:'+conColor+';margin:4px 0">'+conPct+'%</div>';
      h+='<div class="prog" style="height:5px"><div class="prog-f" style="width:'+conPct+'%;background:'+conColor+'"></div></div>';
      h+='<div style="font-size:10px;color:var(--td);margin-top:4px">'+conHinc+' hincados'+(conRech>0?' · '+conRech+' rechazos':'')+' / '+conTotal+'</div>';
      h+='</div>';
      
      var qualColor=qualPct>=100?'var(--ac)':qualStarted>0?'var(--info)':'var(--bd)';
      h+='<div style="padding:12px;border-radius:10px;background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.2)">';
      h+='<div style="font-size:11px;color:var(--ac);font-weight:600">✅ CALIDAD</div>';
      h+='<div style="font-size:24px;font-weight:700;color:'+qualColor+';margin:4px 0">'+qualPct+'%</div>';
      h+='<div class="prog" style="height:5px"><div class="prog-f" style="width:'+qualPct+'%;background:'+qualColor+'"></div></div>';
      h+='<div style="font-size:10px;color:var(--td);margin-top:4px">'+qualStarted+' inspeccionados / '+qualTotal+' trackers</div>';
      h+='</div>';
      
      h+='</div>';
      
      // Workflow badges
      h+='<div style="display:flex;flex-wrap:wrap;gap:4px">';
      WF_PHASES.forEach(function(phase){
        h+='<span style="font-size:10px;color:var(--td)">'+WF_LABELS[phase]+': </span>'+wfBadge(pv,sub,phase)+' ';
      });
      h+='</div>';
      
      h+='</div>';
    });
    el.innerHTML=h;
  }).catch(function(err){
    el.innerHTML='<div style="padding:20px;text-align:center;color:var(--no)">Error: '+err.message+'</div>';
  });
}

// MAP - LEAFLET
// ============================================================
// UTM Zone 30N to WGS84
function utmToLL(x,y){
  var k0=0.9996,a=6378137,e=0.00669438,e1sq=e/(1-e);
  var M0=y/k0;
  var mu=M0/(a*(1-e/4-3*e*e/64-5*e*e*e/256));
  var e1=(1-Math.sqrt(1-e))/(1+Math.sqrt(1-e));
  var J1=3*e1/2-27*Math.pow(e1,3)/32;
  var J2=21*e1*e1/16-55*Math.pow(e1,4)/32;
  var J3=151*Math.pow(e1,3)/96;
  var fp=mu+J1*Math.sin(2*mu)+J2*Math.sin(4*mu)+J3*Math.sin(6*mu);
  var C1=e1sq*Math.pow(Math.cos(fp),2);
  var T1=Math.pow(Math.tan(fp),2);
  var R1=a*(1-e)/Math.pow(1-e*Math.pow(Math.sin(fp),2),1.5);
  var N1=a/Math.sqrt(1-e*Math.pow(Math.sin(fp),2));
  var D=(x-500000)/(N1*k0);
  var lat=fp-N1*Math.tan(fp)/R1*(D*D/2-(5+3*T1+10*C1-4*C1*C1-9*e1sq)*Math.pow(D,4)/24);
  var lon=D*(1-(1+2*T1+C1)*D*D/6+(5-2*C1+28*T1-3*C1*C1+8*e1sq+24*T1*T1)*Math.pow(D,4)/120)/Math.cos(fp);
  return {lat:lat*180/Math.PI, lng:lon*180/Math.PI+(-3)}; // Zone 30 central meridian = -3
}

    h+='<button onclick="V.mapPv='+p+';V.mapSub=0;loadMap()" style="padding:4px 10px;border-radius:6px;font-size:11px;border:1px solid '+(sel?'var(--ac)':'var(--bd)')+';background:'+(sel?'rgba(62,207,142,.15)':'transparent')+';color:'+(sel?'var(--ac)':'var(--td)')+';cursor:pointer">PV'+String(p).padStart(2,'0')+'</button>';
  });
  h+='</div>';
  h+='<div id="mapWrap"><div id="mapEl"></div>';
  // Map nav breadcrumb
  if(pv){
    h+='<div style="padding:4px 16px;font-size:12px;color:var(--td)">';
    h+='<button onclick="V.mapPv=0;V.mapSub=0;loadMap()" style="background:none;border:none;color:var(--ac);cursor:pointer;font-size:12px">Todo</button>';
    h+=' → <span style="color:var(--tx)">PV'+String(pv).padStart(2,'0')+'</span>';
    if(sub)h+=' → <button onclick="V.mapSub=0;loadMap()" style="background:none;border:none;color:var(--ac);cursor:pointer;font-size:12px">Subcampos</button> → <span style="color:var(--tx)">Sub '+sub+'</span>';
    h+='</div>';
  }
  h+='<div class="map-legend"><span><div class="dot" style="background:var(--ac)"></div>Hincado OK</span><span><div class="dot" style="background:var(--err)"></div>Rechazo</span><span><div class="dot" style="background:var(--info)"></div>Parcial</span><span><div class="dot" style="background:#555"></div>Sin datos</span></div>';
  h+='</div>';
  
  a.innerHTML=h;
  
  setTimeout(function(){initMap()},100);
}

function initMap(){
  if(MAP){MAP.remove();MAP=null}
  
  var mapEl=document.getElementById('mapEl');
  if(!mapEl)return;
  
  MAP=L.map('mapEl',{zoomControl:true,attributionControl:false});
  
  // Satellite tiles
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{
    maxZoom:20,attribution:'Esri'
  }).addTo(MAP);
  
  // Labels overlay
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{
    maxZoom:20
  }).addTo(MAP);
  
  loadMap();
}

function loadMap(){
  if(!MAP)return;
  
  // Clear old markers
  MAP_MARKERS.forEach(function(m){MAP.removeLayer(m)});
  MAP_MARKERS=[];
  
  var pv=V.mapPv||0;
  var sub=V.mapSub||0;
  var bounds=[];
  
  // Load construction data from Firebase
  db.ref('construction').once('value',function(snap){
    var conData=snap.val()||{};
    
    Object.keys(MASTER_DATA).forEach(function(code){
      var d=MASTER_DATA[code];
      if(pv&&d.pv!==pv)return;
      if(sub&&d.sub!==sub)return;
      if(!d.mx||!d.my)return;
      
      var ll=utmToLL(d.mx,d.my);
      bounds.push([ll.lat,ll.lng]);
      
      // Determine color from construction data
      var con=conData[code]||{};
      var cfg=PCFG[d.type];
      var totalP=cfg.motor.length+(cfg.conducida?cfg.conducida.length:0);
      var hincP=0,rechP=0;
      for(var f=0;f<(cfg.conducida?2:1);f++){
        var px2=f===0?'fm':'fc';
        var pils2=f===0?cfg.motor:cfg.conducida;
        for(var i=0;i<pils2.length;i++){
          var est=con[px2+'_'+i+'_estado']||'';
          if(est==='hincada')hincP++;
          else if(est==='rechazo')rechP++;
        }
      }
      
      var color=hincP===0&&rechP===0?'#555':rechP>0?'#ef4444':hincP>=totalP?'#22c55e':'#3b82f6';
      var pct=totalP>0?Math.round(hincP/totalP*100):0;
      
      var marker=L.circleMarker([ll.lat,ll.lng],{
        radius:6,
        fillColor:color,
        color:color,
        weight:1,
        opacity:0.8,
        fillOpacity:0.7
      }).addTo(MAP);
      
      marker.bindPopup('<div class="map-popup"><b>'+code+'</b><br>'+d.type+'<br>'
        +(hincP>0||rechP>0?'Hincado: '+hincP+'/'+totalP+' ('+pct+'%)'+(rechP>0?' · '+rechP+' rechazos':''):'Sin datos de hincado')
        +'<br><button onclick="V.screen=\'contractor\';V.conTr=\''+code+'\';V.conPi=0;V.conFila=\'motor\';R()" style="margin-top:6px;padding:6px 12px;border-radius:6px;background:#3ecf8e;color:#000;font-weight:700;font-size:11px;border:none;cursor:pointer;width:100%">Abrir tracker</button></div>');
      
      MAP_MARKERS.push(marker);
    });
    
    if(bounds.length>0){
      MAP.fitBounds(bounds,{padding:[20,20],maxZoom:17});
    }
  });
}

function createNewRevision(code,phase,result){
  db.ref('quality/'+code).once('value',function(s){
    var qualData=s.val()||{};
    db.ref('revisions/'+code+'/current').once('value',function(s2){
      var rev=s2.val()||1;
      db.ref('revisions/'+code+'/history/'+rev).set({
        data:qualData,phase:phase,result:result,
        by:U.name,uid:U.uid,ts:firebase.database.ServerValue.TIMESTAMP
      });
      db.ref('revisions/'+code+'/current').set(rev+1);
      showToast('Rev '+rev+' archivada, nueva rev '+(rev+1),'var(--info)');
    });
  });
}

function quickSearch(q){
  var el=document.getElementById('qresults');
  if(!el)return;
  q=q.trim();
  if(q.length<2){el.style.display='none';return}
  
  var results=Object.keys(MASTER_DATA).filter(function(code){
    return code.toLowerCase().indexOf(q.toLowerCase())>=0||
           String(MASTER_DATA[code].num).indexOf(q)>=0;
  }).slice(0,10);
  
  if(results.length===0){el.style.display='none';return}
  
  var h='';
  results.forEach(function(code){
    var d=MASTER_DATA[code];
    h+='<button onclick="V.calTr=\''+code+'\';V.conTr=\''+code+'\';V.screen=\'qualtracker\';V.viewOnly=false;R()" style="display:flex;justify-content:space-between;align-items:center;width:100%;padding:10px 14px;border:none;border-bottom:1px solid var(--bd);background:transparent;color:var(--tx);cursor:pointer;text-align:left">';
    h+='<div><span style="font-weight:700">'+code+'</span> <span style="font-size:11px;color:var(--td)">'+d.type+'</span></div>';
    h+='<span style="font-size:10px;color:var(--td)">PV'+String(d.pv).padStart(2,'0')+(d.sub?'/S'+d.sub:'')+'</span>';
    h+='</button>';
  });
  el.innerHTML=h;
  el.style.display='block';
}


// ============================================================
// TIMER DE PRODUCTIVIDAD
// ============================================================
function startTimer(code,pilarKey){
  var timerRef='timers/'+code+'/'+pilarKey;
  db.ref(timerRef).set({
    start:firebase.database.ServerValue.TIMESTAMP,
    end:null,
    by:U.name,uid:U.uid,
    equipo:''
  });
  showToast('⏱️ Timer iniciado','var(--info)');
}

function stopTimer(code,pilarKey){
  var timerRef='timers/'+code+'/'+pilarKey;
  db.ref(timerRef+'/end').set(firebase.database.ServerValue.TIMESTAMP);
  showToast('⏱️ Timer parado','var(--ac)');
}

function getTimerHTML(code,pilarKey,timerData){
  if(!timerData||!timerData.start)return '<button onclick="startTimer(\''+code+'\',\''+pilarKey+'\')" style="padding:6px 12px;border-radius:8px;background:var(--sf);border:1px solid var(--bd);color:var(--info);font-size:11px;font-weight:600;cursor:pointer">⏱️ Iniciar timer</button>';
  
  if(timerData.end){
    var dur=Math.round((timerData.end-timerData.start)/1000);
    var min=Math.floor(dur/60);
    var sec=dur%60;
    return '<span style="font-size:11px;padding:4px 10px;border-radius:8px;background:rgba(62,207,142,.1);border:1px solid var(--ac);color:var(--ac);font-weight:600">⏱️ '+min+'m '+sec+'s</span>';
  }
  
  return '<button onclick="stopTimer(\''+code+'\',\''+pilarKey+'\')" style="padding:6px 12px;border-radius:8px;background:rgba(239,68,68,.15);border:1px solid var(--no);color:var(--no);font-size:11px;font-weight:600;cursor:pointer;animation:pulse 1s infinite">⏱️ En curso... Parar</button>';
}


// ============================================================
// COMPARATIVA TEÓRICO VS REAL
// ============================================================
function getCompHTML(supData,conData,pilarKey){
  if(!supData)return '';
  var realProf=conData[pilarKey+'_prof_real'];
  if(realProf==null)return '';
  
  var teo=supData.ph;
  var diff=realProf-teo;
  var pct=teo>0?Math.round(Math.abs(diff)/teo*100):0;
  var color=pct<=5?'var(--ac)':pct<=15?'var(--warn)':'var(--no)';
  var label=diff>0?'+'+diff.toFixed(3)+'m más profundo':diff<0?diff.toFixed(3)+'m menos profundo':'Exacto';
  
  return '<div style="padding:8px;border-radius:8px;background:var(--bg);margin-top:6px"><div style="display:flex;justify-content:space-between;font-size:11px;color:var(--td)"><span>Teórico: '+teo.toFixed(3)+'m</span><span>Real: '+realProf.toFixed(3)+'m</span></div><div style="font-size:12px;font-weight:600;color:'+color+';margin-top:4px">'+label+' ('+pct+'%)</div></div>';
}


// ============================================================
// INFORME SEMANAL
// ============================================================
function generateWeeklyReport(){
  showToast('Generando informe...','var(--info)');
  
  var now=new Date();
  var weekAgo=new Date(now.getTime()-7*24*60*60*1000);
  
  // Fetch all data
  Promise.all([
    db.ref('construction').once('value'),
    db.ref('con_log').orderByChild('ts').startAt(weekAgo.getTime()).once('value'),
    db.ref('punchlist').once('value'),
    db.ref('workflow').once('value'),
    db.ref('timers').once('value')
  ]).then(function(results){
    var conData=results[0].val()||{};
    var logData=results[1].val()||{};
    var plData=results[2].val()||{};
    var wfData=results[3].val()||{};
    var timerData=results[4].val()||{};
    
    var logs=Object.values(logData);
    var jsPDF=window.jspdf.jsPDF;
    var doc=new jsPDF();
    
    // Header
    doc.setFontSize(20);doc.setFont(undefined,'bold');
    doc.text('INFORME SEMANAL',14,20);
    doc.setFontSize(12);doc.setFont(undefined,'normal');
    doc.text('ISFV ATALAYA — XAMAI / X-ELIO',14,28);
    doc.text('Periodo: '+weekAgo.toLocaleDateString('es-ES')+' — '+now.toLocaleDateString('es-ES'),14,35);
    doc.text('Generado: '+now.toLocaleString('es-ES')+' por '+(U?U.name:''),14,42);
    doc.setLineWidth(0.5);doc.line(14,46,196,46);
    
    // KPIs
    var totalPilars=0,hincados=0,rechazos=0;
    Object.keys(conData).forEach(function(code){
      var tr=conData[code];
      Object.keys(tr).forEach(function(k){
        if(!k.match(/_estado$/))return;
        totalPilars++;
        if(tr[k]==='hincada')hincados++;
        else if(tr[k]==='rechazo')rechazos++;
      });
    });
    
    var weekHincados=logs.filter(function(l){return l.field&&l.field.indexOf('_estado')>=0&&l.value==='hincada'}).length;
    var weekRechazos=logs.filter(function(l){return l.field&&l.field.indexOf('_estado')>=0&&l.value==='rechazo'}).length;
    
    doc.setFontSize(14);doc.setFont(undefined,'bold');
    doc.text('1. RESUMEN GENERAL',14,56);
    doc.setFontSize(11);doc.setFont(undefined,'normal');
    var y=64;
    doc.text('Pilares registrados total: '+totalPilars,20,y);y+=7;
    doc.text('Pilares hincados total: '+hincados+' ('+Math.round(hincados/Math.max(totalPilars,1)*100)+'%)',20,y);y+=7;
    doc.text('Rechazos total: '+rechazos,20,y);y+=7;
    doc.text('Hincados esta semana: '+weekHincados,20,y);y+=7;
    doc.text('Rechazos esta semana: '+weekRechazos,20,y);y+=12;
    
    // By day this week
    doc.setFontSize(14);doc.setFont(undefined,'bold');
    doc.text('2. ACTIVIDAD POR DIA',14,y);y+=8;
    doc.setFontSize(10);doc.setFont(undefined,'normal');
    
    var byDay={};
    logs.forEach(function(l){
      if(!l.ts)return;
      var d=new Date(l.ts);
      var key=d.toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'});
      if(!byDay[key])byDay[key]={total:0,hincados:0,rechazos:0};
      byDay[key].total++;
      if(l.value==='hincada')byDay[key].hincados++;
      if(l.value==='rechazo')byDay[key].rechazos++;
    });
    
    Object.keys(byDay).forEach(function(day){
      var d=byDay[day];
      doc.text(day+': '+d.total+' registros, '+d.hincados+' hincados, '+d.rechazos+' rechazos',20,y);y+=6;
    });
    y+=6;
    
    // By operator
    doc.setFontSize(14);doc.setFont(undefined,'bold');
    doc.text('3. POR OPERADOR',14,y);y+=8;
    doc.setFontSize(10);doc.setFont(undefined,'normal');
    
    var byOp={};
    logs.forEach(function(l){
      if(!l.by)return;
      if(!byOp[l.by])byOp[l.by]={total:0,h:0,r:0};
      byOp[l.by].total++;
      if(l.value==='hincada')byOp[l.by].h++;
      if(l.value==='rechazo')byOp[l.by].r++;
    });
    
    Object.keys(byOp).sort(function(a,b){return byOp[b].h-byOp[a].h}).forEach(function(op){
      var o=byOp[op];
      doc.text(op+': '+o.h+' hincados, '+o.r+' rechazos ('+o.total+' registros)',20,y);y+=6;
      if(y>270){doc.addPage();y=20}
    });
    y+=6;
    
    // Timer stats
    var timerCount=0,totalDur=0;
    Object.keys(timerData).forEach(function(code){
      var t=timerData[code];
      Object.keys(t).forEach(function(k){
        if(t[k].start&&t[k].end){
          timerCount++;
          totalDur+=(t[k].end-t[k].start)/1000;
        }
      });
    });
    
    if(timerCount>0){
      if(y>250){doc.addPage();y=20}
      doc.setFontSize(14);doc.setFont(undefined,'bold');
      doc.text('4. PRODUCTIVIDAD',14,y);y+=8;
      doc.setFontSize(10);doc.setFont(undefined,'normal');
      var avgMin=Math.round(totalDur/timerCount/60);
      doc.text('Pilares con timer: '+timerCount,20,y);y+=6;
      doc.text('Tiempo medio por pilar: '+avgMin+' minutos',20,y);y+=6;
      doc.text('Tiempo total registrado: '+Math.round(totalDur/3600)+' horas',20,y);y+=12;
    }
    
    // Punchlist
    var plItems=Object.values(plData);
    var plPend=plItems.filter(function(p){return p.estado==='pendiente'}).length;
    var plRep=plItems.filter(function(p){return p.estado==='reparado'}).length;
    var plVer=plItems.filter(function(p){return p.estado==='verificado'}).length;
    
    if(plItems.length>0){
      if(y>250){doc.addPage();y=20}
      doc.setFontSize(14);doc.setFont(undefined,'bold');
      doc.text('5. PUNCHLIST',14,y);y+=8;
      doc.setFontSize(10);doc.setFont(undefined,'normal');
      doc.text('Pendientes: '+plPend+' | Reparados: '+plRep+' | Verificados: '+plVer,20,y);y+=12;
    }
    
    // Workflow states
    var wfKeys=Object.keys(wfData);
    if(wfKeys.length>0){
      if(y>240){doc.addPage();y=20}
      doc.setFontSize(14);doc.setFont(undefined,'bold');
      doc.text('6. WORKFLOW',14,y);y+=8;
      doc.setFontSize(9);doc.setFont(undefined,'normal');
      wfKeys.sort().forEach(function(k){
        var w=wfData[k];
        var st=w.state||'CON';
        doc.text(k+': '+st+(w.by?' ('+w.by+')':''),20,y);y+=5;
        if(y>275){doc.addPage();y=20}
      });
    }
    
    doc.save('Informe_Semanal_'+now.toISOString().substring(0,10)+'.pdf');
    showToast('PDF generado','var(--ac)');
  });
}
