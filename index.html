function quickSearch(q){
  var el=document.getElementById('qresults');
  if(!el)return;
  q=q.trim();
  if(q.length<2){el.style.display='none';return}
  
  var results=Object.keys(MASTER_DATA).filter(function(code){
    return code.toLowerCase().indexOf(q.toLowerCase())>=0||
           String(MASTER_DATA[code].num).indexOf(q)>=0;
  }).slice(0,10);
  
  if(results.length===0){el.style.display='none';return}
  
  var h='';
  results.forEach(function(code){
    var d=MASTER_DATA[code];
    h+='<button onclick="V.calTr=\''+code+'\';V.conTr=\''+code+'\';V.screen=\'qualtracker\';V.viewOnly=false;R()" style="display:flex;justify-content:space-between;align-items:center;width:100%;padding:10px 14px;border:none;border-bottom:1px solid var(--bd);background:transparent;color:var(--tx);cursor:pointer;text-align:left">';
    h+='<div><span style="font-weight:700">'+code+'</span> <span style="font-size:11px;color:var(--td)">'+d.type+'</span></div>';
    h+='<span style="font-size:10px;color:var(--td)">PV'+String(d.pv).padStart(2,'0')+(d.sub?'/S'+d.sub:'')+'</span>';
    h+='</button>';
  });
  el.innerHTML=h;
  el.style.display='block';
}


// ============================================================
// TIMER DE PRODUCTIVIDAD
// ============================================================
function startTimer(code,pilarKey){
  var timerRef='timers/'+code+'/'+pilarKey;
  db.ref(timerRef).set({
    start:firebase.database.ServerValue.TIMESTAMP,
    end:null,
    by:U.name,uid:U.uid,
    equipo:''
  });
  showToast('⏱️ Timer iniciado','var(--info)');
}

function stopTimer(code,pilarKey){
  var timerRef='timers/'+code+'/'+pilarKey;
  db.ref(timerRef+'/end').set(firebase.database.ServerValue.TIMESTAMP);
  showToast('⏱️ Timer parado','var(--ac)');
}

function getTimerHTML(code,pilarKey,timerData){
  if(!timerData||!timerData.start)return '<button onclick="startTimer(\''+code+'\',\''+pilarKey+'\')" style="padding:6px 12px;border-radius:8px;background:var(--sf);border:1px solid var(--bd);color:var(--info);font-size:11px;font-weight:600;cursor:pointer">⏱️ Iniciar timer</button>';
  
  if(timerData.end){
    var dur=Math.round((timerData.end-timerData.start)/1000);
    var min=Math.floor(dur/60);
    var sec=dur%60;
    return '<span style="font-size:11px;padding:4px 10px;border-radius:8px;background:rgba(62,207,142,.1);border:1px solid var(--ac);color:var(--ac);font-weight:600">⏱️ '+min+'m '+sec+'s</span>';
  }
  
  return '<button onclick="stopTimer(\''+code+'\',\''+pilarKey+'\')" style="padding:6px 12px;border-radius:8px;background:rgba(239,68,68,.15);border:1px solid var(--no);color:var(--no);font-size:11px;font-weight:600;cursor:pointer;animation:pulse 1s infinite">⏱️ En curso... Parar</button>';
}


// ============================================================
// COMPARATIVA TEÓRICO VS REAL
// ============================================================
function getCompHTML(supData,conData,pilarKey){
  if(!supData)return '';
  var realProf=conData[pilarKey+'_prof_real'];
  if(realProf==null)return '';
  
  var teo=supData.ph;
  var diff=realProf-teo;
  var pct=teo>0?Math.round(Math.abs(diff)/teo*100):0;
  var color=pct<=5?'var(--ac)':pct<=15?'var(--warn)':'var(--no)';
  var label=diff>0?'+'+diff.toFixed(3)+'m más profundo':diff<0?diff.toFixed(3)+'m menos profundo':'Exacto';
  
  return '<div style="padding:8px;border-radius:8px;background:var(--bg);margin-top:6px"><div style="display:flex;justify-content:space-between;font-size:11px;color:var(--td)"><span>Teórico: '+teo.toFixed(3)+'m</span><span>Real: '+realProf.toFixed(3)+'m</span></div><div style="font-size:12px;font-weight:600;color:'+color+';margin-top:4px">'+label+' ('+pct+'%)</div></div>';
}


// ============================================================
// INFORME SEMANAL
// ============================================================
function generateWeeklyReport(){
  showToast('Generando informe...','var(--info)');
  
  var now=new Date();
  var weekAgo=new Date(now.getTime()-7*24*60*60*1000);
  
  Promise.all([
    db.ref('construction').once('value'),
    db.ref('con_log').orderByChild('ts').startAt(weekAgo.getTime()).once('value'),
    db.ref('punchlist').once('value'),
    db.ref('workflow').once('value'),
    db.ref('timers').once('value')
  ]).then(function(results){
    var conData=results[0].val()||{};
    var logData=results[1].val()||{};
    var plData=results[2].val()||{};
    var wfData=results[3].val()||{};
    var timerData=results[4].val()||{};
    
    var logs=Object.values(logData);
    var jsPDF=window.jspdf.jsPDF;
    var doc=new jsPDF();
    var W=210;var M=14;var CW=W-2*M;
    
    // Colors
    var cGreen=[5,150,105];var cGreenL=[220,252,231];
    var cBlue=[59,130,246];var cBlueL=[219,234,254];
    var cRed=[239,68,68];var cRedL=[254,226,226];
    var cAmber=[245,158,11];var cAmberL=[254,243,199];
    var cDark=[30,41,59];var cGray=[100,116,139];var cLightGray=[241,245,249];
    var cBrand=[6,95,70];
    
    function setC(c){doc.setTextColor(c[0],c[1],c[2])}
    function fillR(x,y,w,h2,c){doc.setFillColor(c[0],c[1],c[2]);doc.roundedRect(x,y,w,h2,2,2,'F')}
    function drawBar(x,y,w,h2,pct,cBg,cFg){
      doc.setFillColor(cBg[0],cBg[1],cBg[2]);doc.roundedRect(x,y,w,h2,1.5,1.5,'F');
      if(pct>0){doc.setFillColor(cFg[0],cFg[1],cFg[2]);doc.roundedRect(x,y,Math.max(w*pct/100,3),h2,1.5,1.5,'F')}
    }
    
    // ── PAGE 1: HEADER ──
    doc.setFillColor(cBrand[0],cBrand[1],cBrand[2]);
    doc.rect(0,0,W,42,'F');
    doc.setFillColor(4,120,87);doc.rect(0,36,W,6,'F'); // gradient band
    
    doc.setTextColor(255,255,255);doc.setFontSize(22);doc.setFont(undefined,'bold');
    doc.text('INFORME SEMANAL',M,18);
    doc.setFontSize(11);doc.setFont(undefined,'normal');
    doc.text('ISFV ATALAYA — XAMAI / X-ELIO',M,26);
    doc.setFontSize(9);
    doc.text(weekAgo.toLocaleDateString('es-ES',{day:'2-digit',month:'long',year:'numeric'})+' — '+now.toLocaleDateString('es-ES',{day:'2-digit',month:'long',year:'numeric'}),M,33);
    
    // Right side: date
    doc.setFontSize(8);
    doc.text('Generado: '+now.toLocaleString('es-ES'),W-M,33,{align:'right'});
    doc.text('Por: '+(U?U.name:''),W-M,26,{align:'right'});
    
    // ── KPIs ──
    var totalPilars=0,hincados=0,rechazos=0;
    Object.keys(conData).forEach(function(code){
      var tr=conData[code];
      Object.keys(tr).forEach(function(k){
        if(!k.match(/_estado$/))return;
        totalPilars++;
        if(tr[k]==='hincada')hincados++;
        else if(tr[k]==='rechazo')rechazos++;
      });
    });
    var pendientes=totalPilars-hincados-rechazos;
    var pctDone=totalPilars>0?Math.round(hincados/totalPilars*100):0;
    
    var weekHincados=logs.filter(function(l){return l.field&&l.field.indexOf('_estado')>=0&&l.value==='hincada'}).length;
    var weekRechazos=logs.filter(function(l){return l.field&&l.field.indexOf('_estado')>=0&&l.value==='rechazo'}).length;
    
    var y=50;
    setC(cDark);doc.setFontSize(13);doc.setFont(undefined,'bold');
    doc.text('RESUMEN GENERAL',M,y);y+=4;
    
    // Progress bar full width
    drawBar(M,y,CW,6,pctDone,cLightGray,cGreen);
    setC(cDark);doc.setFontSize(8);doc.setFont(undefined,'bold');
    doc.text(pctDone+'%',M+CW/2,y+4.5,{align:'center'});
    y+=12;
    
    // KPI boxes — 4 across
    var bw=(CW-9)/4;
    var kpis=[
      {label:'HINCADOS',val:hincados.toLocaleString('es-ES'),bg:cGreenL,fg:cGreen,sub:pctDone+'% del total'},
      {label:'RECHAZOS',val:rechazos.toLocaleString('es-ES'),bg:cRedL,fg:cRed,sub:totalPilars>0?Math.round(rechazos/totalPilars*100)+'%':''},
      {label:'PENDIENTES',val:pendientes.toLocaleString('es-ES'),bg:cBlueL,fg:cBlue,sub:totalPilars>0?Math.round(pendientes/totalPilars*100)+'%':''},
      {label:'TOTAL HINCAS',val:totalPilars.toLocaleString('es-ES'),bg:cLightGray,fg:cDark,sub:'1.756 trackers'}
    ];
    kpis.forEach(function(k,i){
      var bx=M+i*(bw+3);
      fillR(bx,y,bw,24,k.bg);
      setC(k.fg);doc.setFontSize(7);doc.setFont(undefined,'bold');
      doc.text(k.label,bx+bw/2,y+5,{align:'center'});
      doc.setFontSize(16);
      doc.text(k.val,bx+bw/2,y+15,{align:'center'});
      setC(cGray);doc.setFontSize(6);doc.setFont(undefined,'normal');
      doc.text(k.sub,bx+bw/2,y+21,{align:'center'});
    });
    y+=30;
    
    // Week KPIs
    var bw2=(CW-3)/2;
    fillR(M,y,bw2,16,cGreenL);
    setC(cGreen);doc.setFontSize(7);doc.setFont(undefined,'bold');
    doc.text('HINCADOS ESTA SEMANA',M+bw2/2,y+5,{align:'center'});
    doc.setFontSize(14);
    doc.text(String(weekHincados),M+bw2/2,y+13,{align:'center'});
    
    fillR(M+bw2+3,y,bw2,16,cRedL);
    setC(cRed);doc.setFontSize(7);doc.setFont(undefined,'bold');
    doc.text('RECHAZOS ESTA SEMANA',M+bw2+3+bw2/2,y+5,{align:'center'});
    doc.setFontSize(14);
    doc.text(String(weekRechazos),M+bw2+3+bw2/2,y+13,{align:'center'});
    y+=24;
    
    // ── ACTIVIDAD POR DÍA — table ──
    setC(cDark);doc.setFontSize(13);doc.setFont(undefined,'bold');
    doc.text('ACTIVIDAD POR DÍA',M,y);y+=6;
    
    var byDay={};var dayOrder=[];
    for(var dd=0;dd<7;dd++){
      var dt=new Date(weekAgo.getTime()+dd*24*60*60*1000);
      var key=dt.toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'});
      dayOrder.push(key);byDay[key]={total:0,hincados:0,rechazos:0};
    }
    logs.forEach(function(l){
      if(!l.ts)return;
      var d=new Date(l.ts);
      var key=d.toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'});
      if(!byDay[key])byDay[key]={total:0,hincados:0,rechazos:0};
      byDay[key].total++;
      if(l.value==='hincada')byDay[key].hincados++;
      if(l.value==='rechazo')byDay[key].rechazos++;
    });
    
    // Table header
    fillR(M,y,CW,7,[4,120,87]);
    doc.setTextColor(255,255,255);doc.setFontSize(7);doc.setFont(undefined,'bold');
    doc.text('DÍA',M+3,y+5);doc.text('REGISTROS',M+65,y+5);doc.text('HINCADOS',M+100,y+5);doc.text('RECHAZOS',M+135,y+5);
    y+=7;
    
    dayOrder.forEach(function(day,i){
      var d=byDay[day];
      if(i%2===0)fillR(M,y,CW,6,cLightGray);
      setC(cDark);doc.setFontSize(7);doc.setFont(undefined,'normal');
      doc.text(day,M+3,y+4.5);
      doc.text(String(d.total),M+73,y+4.5);
      setC(cGreen);doc.text(String(d.hincados),M+108,y+4.5);
      setC(cRed);doc.text(String(d.rechazos),M+143,y+4.5);
      y+=6;
    });
    y+=8;
    
    // ── POR OPERADOR — table ──
    setC(cDark);doc.setFontSize(13);doc.setFont(undefined,'bold');
    doc.text('POR OPERADOR',M,y);y+=6;
    
    var byOp={};
    logs.forEach(function(l){
      if(!l.by)return;
      if(!byOp[l.by])byOp[l.by]={total:0,h:0,r:0};
      byOp[l.by].total++;
      if(l.value==='hincada')byOp[l.by].h++;
      if(l.value==='rechazo')byOp[l.by].r++;
    });
    var opKeys=Object.keys(byOp).sort(function(a,b){return byOp[b].h-byOp[a].h});
    
    fillR(M,y,CW,7,[4,120,87]);
    doc.setTextColor(255,255,255);doc.setFontSize(7);doc.setFont(undefined,'bold');
    doc.text('OPERADOR',M+3,y+5);doc.text('HINCADOS',M+80,y+5);doc.text('RECHAZOS',M+115,y+5);doc.text('TOTAL',M+150,y+5);
    y+=7;
    
    opKeys.forEach(function(op,i){
      if(y>270){doc.addPage();y=20}
      var o=byOp[op];
      if(i%2===0)fillR(M,y,CW,6,cLightGray);
      setC(cDark);doc.setFontSize(7);doc.setFont(undefined,'normal');
      doc.text(op,M+3,y+4.5);
      setC(cGreen);doc.text(String(o.h),M+88,y+4.5);
      setC(cRed);doc.text(String(o.r),M+123,y+4.5);
      setC(cDark);doc.text(String(o.total),M+155,y+4.5);
      y+=6;
    });
    y+=10;
    
    // ── PRODUCTIVIDAD ──
    var timerCount=0,totalDur=0;
    Object.keys(timerData).forEach(function(code){
      var t=timerData[code];
      Object.keys(t).forEach(function(k){
        if(t[k].start&&t[k].end){timerCount++;totalDur+=(t[k].end-t[k].start)/1000}
      });
    });
    
    if(timerCount>0){
      if(y>250){doc.addPage();y=20}
      setC(cDark);doc.setFontSize(13);doc.setFont(undefined,'bold');
      doc.text('PRODUCTIVIDAD',M,y);y+=6;
      
      var avgMin=Math.round(totalDur/timerCount/60);
      var bw3=(CW-6)/3;
      
      fillR(M,y,bw3,18,cBlueL);
      setC(cBlue);doc.setFontSize(7);doc.setFont(undefined,'bold');
      doc.text('HINCAS CON TIMER',M+bw3/2,y+5,{align:'center'});
      doc.setFontSize(14);doc.text(String(timerCount),M+bw3/2,y+14,{align:'center'});
      
      fillR(M+bw3+3,y,bw3,18,cAmberL);
      setC(cAmber);doc.setFontSize(7);doc.setFont(undefined,'bold');
      doc.text('MEDIA POR HINCA',M+bw3+3+bw3/2,y+5,{align:'center'});
      doc.setFontSize(14);doc.text(avgMin+' min',M+bw3+3+bw3/2,y+14,{align:'center'});
      
      fillR(M+2*(bw3+3),y,bw3,18,cGreenL);
      setC(cGreen);doc.setFontSize(7);doc.setFont(undefined,'bold');
      doc.text('TIEMPO TOTAL',M+2*(bw3+3)+bw3/2,y+5,{align:'center'});
      doc.setFontSize(14);doc.text(Math.round(totalDur/3600)+'h',M+2*(bw3+3)+bw3/2,y+14,{align:'center'});
      y+=26;
    }
    
    // ── PUNCHLIST ──
    var plItems=Object.values(plData);
    var plPend=plItems.filter(function(p){return p.estado==='pendiente'}).length;
    var plRep=plItems.filter(function(p){return p.estado==='reparado'}).length;
    var plVer=plItems.filter(function(p){return p.estado==='verificado'}).length;
    
    if(plItems.length>0){
      if(y>250){doc.addPage();y=20}
      setC(cDark);doc.setFontSize(13);doc.setFont(undefined,'bold');
      doc.text('PUNCHLIST',M,y);y+=6;
      
      var bw4=(CW-6)/3;
      fillR(M,y,bw4,18,cRedL);
      setC(cRed);doc.setFontSize(7);doc.setFont(undefined,'bold');
      doc.text('PENDIENTES',M+bw4/2,y+5,{align:'center'});
      doc.setFontSize(14);doc.text(String(plPend),M+bw4/2,y+14,{align:'center'});
      
      fillR(M+bw4+3,y,bw4,18,cAmberL);
      setC(cAmber);doc.setFontSize(7);doc.setFont(undefined,'bold');
      doc.text('REPARADOS',M+bw4+3+bw4/2,y+5,{align:'center'});
      doc.setFontSize(14);doc.text(String(plRep),M+bw4+3+bw4/2,y+14,{align:'center'});
      
      fillR(M+2*(bw4+3),y,bw4,18,cGreenL);
      setC(cGreen);doc.setFontSize(7);doc.setFont(undefined,'bold');
      doc.text('VERIFICADOS',M+2*(bw4+3)+bw4/2,y+5,{align:'center'});
      doc.setFontSize(14);doc.text(String(plVer),M+2*(bw4+3)+bw4/2,y+14,{align:'center'});
      y+=26;
    }
    
    // ── AVANCE POR PV ──
    if(y>220){doc.addPage();y=20}
    setC(cDark);doc.setFontSize(13);doc.setFont(undefined,'bold');
    doc.text('AVANCE POR PV',M,y);y+=6;
    
    var pvMap={};
    Object.keys(MASTER_DATA).forEach(function(code){
      var d=MASTER_DATA[code];
      if(!pvMap[d.pv])pvMap[d.pv]={total:0,hinc:0,rech:0};
    });
    Object.keys(conData).forEach(function(fc){
      var code=fc.replace(/_/g,'.');
      var d=MASTER_DATA[code];if(!d)return;
      var con=conData[fc];
      var cfg=PCFG[d.type];if(!cfg)return;
      var faces=[{px:'fm',pils:cfg.motor}];
      if(cfg.conducida)faces.push({px:'fc',pils:cfg.conducida});
      faces.forEach(function(f){
        f.pils.forEach(function(p,i){
          if(!pvMap[d.pv])pvMap[d.pv]={total:0,hinc:0,rech:0};
          pvMap[d.pv].total++;
          var est=con[f.px+'_'+i+'_estado']||'';
          if(est==='hincada')pvMap[d.pv].hinc++;
          else if(est==='rechazo')pvMap[d.pv].rech++;
        });
      });
    });
    
    // Table header
    fillR(M,y,CW,7,[4,120,87]);
    doc.setTextColor(255,255,255);doc.setFontSize(7);doc.setFont(undefined,'bold');
    doc.text('PV',M+3,y+5);doc.text('HINCADOS',M+35,y+5);doc.text('RECHAZOS',M+65,y+5);doc.text('TOTAL',M+95,y+5);doc.text('% AVANCE',M+120,y+5);doc.text('PROGRESO',M+148,y+5);
    y+=7;
    
    Object.keys(pvMap).sort(function(a,b){return parseInt(a)-parseInt(b)}).forEach(function(pv,i){
      if(y>275){doc.addPage();y=20}
      var p=pvMap[pv];if(p.total===0)return;
      var pct=Math.round(p.hinc/p.total*100);
      if(i%2===0)fillR(M,y,CW,6,cLightGray);
      setC(cDark);doc.setFontSize(7);doc.setFont(undefined,'normal');
      doc.text('PV'+String(pv).padStart(2,'0'),M+3,y+4.5);
      setC(cGreen);doc.text(String(p.hinc),M+42,y+4.5);
      setC(cRed);doc.text(String(p.rech),M+72,y+4.5);
      setC(cDark);doc.text(String(p.total),M+100,y+4.5);
      doc.setFont(undefined,'bold');doc.text(pct+'%',M+125,y+4.5);doc.setFont(undefined,'normal');
      drawBar(M+145,y+1,37,4,pct,cLightGray,pct>=80?cGreen:pct>=50?cAmber:cRed);
      y+=6;
    });
    
    // Footer on each page
    var pages=doc.getNumberOfPages();
    for(var pg=1;pg<=pages;pg++){
      doc.setPage(pg);
      doc.setFillColor(cBrand[0],cBrand[1],cBrand[2]);doc.rect(0,290,W,7,'F');
      doc.setTextColor(255,255,255);doc.setFontSize(6);
      doc.text('ISFV ATALAYA — Checklist Solar v2.8 — XAMAI / X-ELIO',M,294);
      doc.text('Pág. '+pg+'/'+pages,W-M,294,{align:'right'});
    }
    
    doc.save('Informe_Semanal_'+now.toISOString().substring(0,10)+'.pdf');
    showToast('✅ PDF generado','var(--ac)');
  });
}

var _dpData=null;

function dpLoadData(){
  // --- DEMO DATA GENERATOR ---
  if(!window._dpDemoData){
    window._dpDemoData=function(){
      var techs=['Ante Budimir','Aimar Oroz','Kike Barja','Boyomo','Aitor Fern\u00e1ndez'];
      var pvCounts=[122,130,128,126,134,120,132,118,124,130,126,128,120,118];
      var byPv=[];var demoCon={};
      var totalDone=0,totalCurso=0,totalInc=0,totalPend=0,totalPilT=0,totalPilD=0;

      pvCounts.forEach(function(cnt,pi){
        var pvNum=pi+1;var pvName='PV'+String(pvNum).padStart(2,'0');
        var done=0,issues=0,curso=0,pilT=0,pilD=0;
        var progress=Math.max(0.05,1-(pi/14));// PV01 almost done, PV14 just started

        // Use real MASTER_DATA codes if available
        var realCodes=Object.keys(MASTER_DATA).filter(function(c){return MASTER_DATA[c].pv===pvNum}).sort();
        var useCount=realCodes.length>0?realCodes.length:cnt;

        for(var t=0;t<useCount;t++){
          var code=realCodes[t]||String(pvNum).padStart(2,'0')+'.'+(200+t);
          var fc=code.replace(/\./g,'_');
          var cfg=MASTER_DATA[code]?PCFG[MASTER_DATA[code].type]:null;
          var rand=Math.random();
          var nPilars=cfg?(cfg.conducida?cfg.motor.length+cfg.conducida.length:cfg.motor.length):(rand<0.4?5:9);
          pilT+=nPilars;var pDone=0,pRech=0;

          var trkDone=rand<progress*0.85;
          var trkCurso=!trkDone&&rand<progress;
          var trkIssue=Math.random()<0.06;

          demoCon[fc]={};
          for(var p=0;p<nPilars;p++){
            if(trkDone||(trkCurso&&Math.random()<0.7)){
              if(trkIssue&&p===Math.floor(nPilars/2)){
                demoCon[fc]['fm_'+p+'_estado']='rechazo';pRech++;
              }else{
                demoCon[fc]['fm_'+p+'_estado']='hincada';pDone++;
              }
            }
          }
          pilD+=pDone;
          if(pDone===nPilars)done++;
          else if(pDone>0)curso++;
          if(pRech>0)issues++;
        }

        totalDone+=done;totalCurso+=curso;totalInc+=issues;
        totalPend+=cnt-done-curso;totalPilT+=pilT;totalPilD+=pilD;
        byPv.push({pv:pvName,total:cnt,done:done,issues:issues,pilTotal:pilT,pilDone:pilD});
      });

      var total=pvCounts.reduce(function(s,v){return s+v},0);
      var pct=Math.round(totalDone/total*1000)/10;

      // By tech
      var byTech=techs.map(function(name,i){
        var share=[0.28,0.24,0.20,0.16,0.12][i];
        var pil=Math.round(totalPilD*share);
        var d2=Math.round(totalDone*share);
        var s2=Math.round((totalDone+totalCurso)*share);
        return{name:name,done:d2,started:s2,issues:Math.round(totalInc*share*(1+i*0.1)),pilars:pil};
      });

      // Daily (last 30 days, realistic pattern)
      var daily=[];var calMap2={};
      var now2=new Date();
      for(var dd=29;dd>=0;dd--){
        var dt=new Date(now2);dt.setDate(dt.getDate()-dd);
        var isWknd=dt.getDay()===0||dt.getDay()===6;
        var cnt2=isWknd?0:Math.floor(Math.random()*30+15);
        var dk2=dt.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit'});
        daily.push({date:dk2,count:cnt2});
        var iso2=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
        calMap2[iso2]=cnt2;
      }
      // Fill heatmap from project start (June 2025) with realistic ramp-up
      var projStart=new Date('2025-06-02');
      var daysSinceStart=Math.round((now2-projStart)/(1000*60*60*24));
      for(var dd2=daysSinceStart;dd2>30;dd2--){
        var dt2=new Date(now2);dt2.setDate(dt2.getDate()-dd2);
        if(dt2<projStart)continue;
        var isWknd2=dt2.getDay()===0||dt2.getDay()===6;
        var iso3=dt2.getFullYear()+'-'+String(dt2.getMonth()+1).padStart(2,'0')+'-'+String(dt2.getDate()).padStart(2,'0');
        // Ramp up: fewer at start, more later
        var dayProgress=(daysSinceStart-dd2)/daysSinceStart; // 0→1
        var baseRate=Math.floor(10+dayProgress*30);
        calMap2[iso3]=isWknd2?0:Math.floor(Math.random()*baseRate+5);
      }

      var wkDays=daily.filter(function(x){return x.count>0}).length;
      var dAvg=wkDays>0?Math.round(totalPilD/wkDays):0;

      // Incidents
      var incidentList=[
        {tracker:'TR07.234',pv:'PV07',field:'Verticalidad pilar 3 fuera de tolerancia',tech:'Aitor Fern\u00e1ndez',date:'28/03'},
        {tracker:'TR10.312',pv:'PV10',field:'Altura hinca pilar 1 insuficiente (-0.15m)',tech:'Aimar Oroz',date:'28/03'},
        {tracker:'TR09.288',pv:'PV09',field:'Rechazo pilar 5 — roca a 1.2m',tech:'Kike Barja',date:'27/03'},
        {tracker:'TR10.305',pv:'PV10',field:'Nivelaci\u00f3n N-S pilar 4 > 2\u00b0',tech:'Aitor Fern\u00e1ndez',date:'27/03'},
        {tracker:'TR06.248',pv:'PV06',field:'Predrill necesario — terreno compacto',tech:'Boyomo',date:'26/03'},
        {tracker:'TR12.345',pv:'PV12',field:'Rechazo pilar 7 — desviaci\u00f3n XY > 5cm',tech:'Ante Budimir',date:'26/03'},
        {tracker:'TR13.318',pv:'PV13',field:'Cota hinca pilar 2 fuera de rango',tech:'Aimar Oroz',date:'25/03'},
        {tracker:'TR11.290',pv:'PV11',field:'Pilar 3 rotaci\u00f3n > 3\u00b0',tech:'Kike Barja',date:'25/03'},
        {tracker:'TR14.335',pv:'PV14',field:'Altura pilar 6 rechazo — rehincado requerido',tech:'Aitor Fern\u00e1ndez',date:'24/03'},
        {tracker:'TR05.240',pv:'PV05',field:'Pilar motor inclinaci\u00f3n E/O > 1.5\u00b0',tech:'Boyomo',date:'24/03'}
      ];

      var demoQualInc=[
        {tracker:'TR03.012',pv:'PV03',field:'3 campos fuera de tolerancia',tech:'',date:'',tipo:'calidad',count:3,details:['2N-MP — Verticalidad N-S: 86.5° (tol. 88-102)','1S-MP — Distancia N-S tramo: 7660 mm (nom. 7610±30)','MP — Torsión cabeza: SI (esperado: NO)']},
        {tracker:'TR05.041',pv:'PV05',field:'2 campos fuera de tolerancia',tech:'',date:'',tipo:'calidad',count:2,details:['3N-MP — Verticalidad E-O: 87.1° (tol. 88-92)','2S-MP — Deformación golpes: SI (esperado: NO)']},
        {tracker:'TR08.078',pv:'PV08',field:'1 campo fuera de tolerancia',tech:'',date:'',tipo:'calidad',count:1,details:['1N-MP — Verticalidad N-S: 103.2° (tol. 88-102)']},
        {tracker:'TR11.102',pv:'PV11',field:'2 campos fuera de tolerancia',tech:'',date:'',tipo:'calidad',count:2,details:['4S-MP — Distancia N-S tramo: 6670 mm (nom. 6710±30)','MP — Desviación E-O: SI (esperado: NO)']},
        {tracker:'TR02.009',pv:'PV02',field:'1 campo fuera de tolerancia',tech:'',date:'',tipo:'calidad',count:1,details:['2N — Oxidación: SI (esperado: NO)']},
      ];
      incidentList.forEach(function(inc){inc.tipo='hincado';inc.details=inc.details||[inc.field]});

      // Generate demo logs per technician
      var demoLogs=[];
      var now3=new Date();
      byTech.forEach(function(t,ti){
        t.rechazos=Math.round(t.issues*1.5);
        t.trackers=[];t.logs=[];
        // Base GPS zone per tech (Atalaya plant ~41.58N, -0.72W, each tech in different PV area)
        var baseLat=41.577+ti*0.0012;var baseLng=-0.725+ti*0.002;
        // Generate realistic log entries for last 14 days
        for(var dd3=13;dd3>=0;dd3--){
          var dt3=new Date(now3);dt3.setDate(dt3.getDate()-dd3);
          if(dt3.getDay()===0||dt3.getDay()===6)continue;
          var nActions=Math.floor(Math.random()*12+4);
          // Simulate walking path: start at one end, move progressively
          var pathLat=baseLat+(Math.random()-0.5)*0.001;
          var pathLng=baseLng+(Math.random()-0.5)*0.001;
          var dLat=(Math.random()-0.5)*0.0003;var dLng=Math.random()*0.0004+0.0001;
          for(var aa=0;aa<nActions;aa++){
            var hr=8+Math.floor(aa/nActions*9);var mn=Math.floor(Math.random()*60);
            var lts=new Date(dt3);lts.setHours(hr,mn,0);
            var pvR=Math.floor(Math.random()*14)+1;var trR=Math.floor(Math.random()*60)+200;
            var trCode=String(pvR).padStart(2,'0')+'.'+trR;
            var isEstado=Math.random()<0.6;
            // Move along path with some jitter
            pathLat+=dLat+(Math.random()-0.5)*0.0001;
            pathLng+=dLng+(Math.random()-0.5)*0.0001;
            var entry={tracker:trCode,field:isEstado?'fm_'+Math.floor(Math.random()*5)+'_estado':'fm_'+Math.floor(Math.random()*5)+'_tipo',
              value:isEstado?(Math.random()<0.92?'hincada':'rechazo'):'directa',by:t.name,ts:lts.getTime(),
              lat:Math.round(pathLat*1e6)/1e6,lng:Math.round(pathLng*1e6)/1e6};
            t.logs.push(entry);demoLogs.push(entry);
          }
        }
        // Add some tracker summaries
        for(var tt=0;tt<Math.min(t.started,20);tt++){
          var pvT=Math.floor(Math.random()*14)+1;
          t.trackers.push({code:String(pvT).padStart(2,'0')+'.'+(200+tt),pv:'PV'+String(pvT).padStart(2,'0'),hincP:Math.floor(Math.random()*5+3),rechP:Math.random()<0.1?1:0,totalP:9,done:Math.random()<0.7});
        }
      });

      return{
        kpis:{total:total,completed:totalDone,inProgress:totalCurso,incidents:totalInc,pending:total-totalDone-totalCurso,pct:pct},
        byPv:byPv,byTech:byTech,daily:daily,incidents:incidentList,qualIncidents:demoQualInc,
        calMap:calMap2,workDays:wkDays,dailyAvg:dAvg,totalLogs:daily.reduce(function(s,x){return s+x.count},0),
        recentLogs:demoLogs.slice(-10),_demoCon:demoCon
      };
    };
  }
  // --- END DEMO DATA ---

  var el=document.getElementById('dp-content');
  el.innerHTML='<div style="text-align:center;padding:40px;color:#94A3B8"><div style="width:36px;height:36px;border:3px solid #E2E8F0;border-top-color:#059669;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px"></div>Cargando datos de Firebase...</div>';

  Promise.all([
    db.ref('construction').once('value'),
    db.ref('quality').once('value'),
    db.ref('workflow').once('value'),
    db.ref('punchlist').once('value'),
    db.ref('con_log').orderByChild('ts').limitToLast(500).once('value')
  ]).then(function(results){
    var conAll=results[0].val()||{};
    var qualAll=results[1].val()||{};
    var wfAll=results[2].val()||{};
    var plAll=results[3].val()||{};
    var logAll=results[4].val()||{};
    CACHE._dpCon=conAll;
    DBG('DashPro data: con='+Object.keys(conAll).length+' qual='+Object.keys(qualAll).length+' log='+Object.keys(logAll).length);
    var kpis={total:0,completed:0,inProgress:0,incidents:0,pending:0,pct:0};
    var pvMap={};
    var techMap={};
    var dayMap={};
    var incidents=[];
    var qualIncidents=[];

    // Process by tracker
    Object.keys(MASTER_DATA).forEach(function(code){
      var md=MASTER_DATA[code];
      var pv='PV'+String(md.pv).padStart(2,'0');
      var fc=fbCode(code);
      var con=conAll[fc]||{};
      var qual=qualAll[fc]||{};
      var cfg=PCFG[md.type];
      if(!cfg)return;

      kpis.total++;

      // Count pilars
      var totalP=0,hincP=0,rechP=0;
      for(var f=0;f<(cfg.conducida?2:1);f++){
        var px=f===0?'fm':'fc';
        var pils=f===0?cfg.motor:cfg.conducida;
        for(var i=0;i<pils.length;i++){
          totalP++;
          var est=con[px+'_'+i+'_estado']||'';
          if(est==='hincada')hincP++;
          else if(est==='rechazo')rechP++;
        }
      }

      var allDone=totalP>0&&hincP===totalP;
      var hasIssue=rechP>0;
      var started=hincP>0||rechP>0;

      if(allDone)kpis.completed++;
      else if(started)kpis.inProgress++;
      else kpis.pending++;
      if(hasIssue)kpis.incidents++;

      // By PV
      if(!pvMap[pv])pvMap[pv]={pv:pv,total:0,done:0,issues:0,pilTotal:0,pilDone:0};
      pvMap[pv].total++;
      if(allDone)pvMap[pv].done++;
      if(hasIssue)pvMap[pv].issues++;
      pvMap[pv].pilTotal+=totalP;
      pvMap[pv].pilDone+=hincP;

      // Last modifier as tech
      var lastBy=con._lastBy||'';
      if(lastBy){
        if(!techMap[lastBy])techMap[lastBy]={name:lastBy,done:0,started:0,issues:0,pilars:0,rechazos:0,trackers:[]};
        techMap[lastBy].pilars+=hincP;
        techMap[lastBy].rechazos+=rechP;
        if(allDone)techMap[lastBy].done++;
        if(started){techMap[lastBy].started++;techMap[lastBy].trackers.push({code:code,pv:pv,hincP:hincP,rechP:rechP,totalP:totalP,done:allDone})}
        if(hasIssue)techMap[lastBy].issues++;
      }

      // Construction incidents (rechazos)
      if(hasIssue){
        var fields=[];
        for(var f2=0;f2<(cfg.conducida?2:1);f2++){
          var px2=f2===0?'fm':'fc';
          var pils2=f2===0?cfg.motor:cfg.conducida;
          for(var i2=0;i2<pils2.length;i2++){
            if(con[px2+'_'+i2+'_estado']==='rechazo')fields.push((f2===0?'Motor':'Cond.')+' pilar '+(i2+1)+' — '+(con[px2+'_'+i2+'_motivo']||'rechazo'));
          }
        }
        incidents.push({tracker:code,pv:pv,field:fields.join('; ')||'Rechazo',tech:lastBy,date:con._lastTS?new Date(con._lastTS).toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit'}):'',tipo:'hincado',details:fields});
      }

      // Quality incidents (out of tolerance / bad values)
      if(Object.keys(qual).length>0){
        var qFields=[];
        var filas2=cfg.conducida?['motor','conducida']:['motor'];
        var mpI2=getMPi(md.type);
        filas2.forEach(function(fila2){
          var pils3=cfg[fila2];var px3=fila2==='motor'?'fm':'fc';
          for(var i3=0;i3<pils3.length;i3++){
            MED.forEach(function(mf){
              if(mf.isTramo&&i3===mpI2)return;
              var qv=qual[px3+'_'+i3+'_'+mf.id];
              if(qv==null)return;
              if(mf.tol&&typeof qv==='number'&&(qv<mf.tol[0]||qv>mf.tol[1])){
                qFields.push(pils3[i3]+' — '+mf.label+': '+qv+' '+mf.unit+' (tol. '+mf.tol[0]+'-'+mf.tol[1]+')');
              }
              if(mf.isTramo){
                var tt4=getTramoTol(md.type,i3);
                if(tt4&&typeof qv==='number'&&(qv<tt4.min||qv>tt4.max)){
                  qFields.push(pils3[i3]+' — '+mf.label+': '+qv+' mm (nom. '+tt4.nom+'±'+TRAMO_TOL+')');
                }
              }
              if(mf.type==='okno'&&mf.def!=null&&qv!==mf.def){
                qFields.push(pils3[i3]+' — '+mf.label+': '+qv+' (esperado: '+mf.def+')');
              }
            });
            COMP.forEach(function(cf2){
              var qv2=qual[px3+'_'+i3+'_'+cf2.id];
              if(qv2!=null&&cf2.def!=null&&qv2!==cf2.def){
                qFields.push(pils3[i3]+' — '+cf2.label+': '+qv2+' (esperado: '+cf2.def+')');
              }
            });
          }
        });
        if(qFields.length>0){
          qualIncidents.push({tracker:code,pv:pv,field:qFields.length+' campo'+(qFields.length>1?'s':'')+' fuera de tolerancia',tech:'',date:'',tipo:'calidad',details:qFields,count:qFields.length});
        }
      }
    });

    kpis.pct=kpis.total>0?Math.round(kpis.completed/kpis.total*1000)/10:0;

    // Process logs for daily chart
    var logArr=[];
    Object.keys(logAll).forEach(function(k){var l=logAll[k];if(l&&l.ts)logArr.push(l)});
    logArr.sort(function(a2,b2){return (a2.ts||0)-(b2.ts||0)});

    // If log is empty, build activity data from construction timestamps
    if(logArr.length===0){
      DBG('con_log empty — building activity from construction _lastTS');
      Object.keys(conAll).forEach(function(fc){
        var con=conAll[fc];if(!con||!con._lastTS)return;
        logArr.push({tracker:fc.replace(/_/g,'.'),field:'_estado',value:'hincada',by:con._lastBy||'',ts:con._lastTS});
        // Also scan individual field timestamps
        Object.keys(con).forEach(function(k){
          if(k.endsWith('_ts')&&typeof con[k]==='number'){
            var fieldName=k.replace(/_ts$/,'');
            logArr.push({tracker:fc.replace(/_/g,'.'),field:fieldName,value:con[fieldName]||'',by:con[fieldName+'_by']||con._lastBy||'',ts:con[k]});
          }
        });
      });
      logArr.sort(function(a2,b2){return (a2.ts||0)-(b2.ts||0)});
      DBG('Built '+logArr.length+' synthetic log entries from timestamps');
    }

    var techLogs={};
    logArr.forEach(function(l){
      if(!l.ts)return;
      var dk=new Date(l.ts).toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit'});
      dayMap[dk]=(dayMap[dk]||0)+1;
      // Also capture tech from logs
      if(l.by&&!techMap[l.by]){techMap[l.by]={name:l.by,done:0,started:0,issues:0,pilars:0,rechazos:0,trackers:[]}}
      if(l.by){
        if(!techLogs[l.by])techLogs[l.by]=[];
        techLogs[l.by].push(l);
      }
      if(l.by&&l.field&&l.field.indexOf('_estado')>=0&&l.value==='hincada'){
        if(techMap[l.by])techMap[l.by].pilars++;
      }
    });
    // Attach logs to tech objects
    Object.keys(techMap).forEach(function(k){techMap[k].logs=techLogs[k]||[]});

    var daily=Object.keys(dayMap).slice(-30).map(function(d){return{date:d,count:dayMap[d]}});
    var byPv=Object.values(pvMap).sort(function(a2,b2){return a2.pv.localeCompare(b2.pv,undefined,{numeric:true})});
    var byTech=Object.values(techMap).sort(function(a2,b2){return (b2.pilars||b2.done)-(a2.pilars||a2.done)});

    // Calendar heatmap data (last 6 months by ISO date)
    var calMap={};
    logArr.forEach(function(l){
      if(!l.ts)return;
      var d=new Date(l.ts);
      var iso=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      calMap[iso]=(calMap[iso]||0)+1;
    });
    DBG('DashPro: logArr='+logArr.length+' calMap days='+Object.keys(calMap).length+' daily='+Object.keys(dayMap).length);

    // Work stats
    var workDays=Object.keys(dayMap).length;
    var totalLogs=logArr.length;
    var dailyAvg=workDays>0?Math.round(totalLogs/workDays):0;

    // Recent logs (last 10)
    var recentLogs=logArr.slice(-10).reverse().map(function(l){
      return{tracker:l.tracker||'',field:l.field||'',value:l.value||'',by:l.by||'',ts:l.ts};
    });

    _dpData={kpis:kpis,byPv:byPv,byTech:byTech,daily:daily,incidents:incidents,qualIncidents:qualIncidents,calMap:calMap,workDays:workDays,dailyAvg:dailyAvg,totalLogs:totalLogs,recentLogs:recentLogs};

    // Only load synthetic demo if Firebase has NO data
    if(kpis.total===0){
      DBG('Firebase empty — loading synthetic DEMO');
      _dpData=_dpDemoData();
      CACHE._dpCon=_dpData._demoCon||{};
      if(!CACHE._dpPlanData||Object.keys(CACHE._dpPlanData).length===0){
        var synPlan={};
        var hP=[75,125,175,225,275,300,300,300,275,250,225,200,150,100,50,25];
        var mP=[0,0,0,5,10,16,20,26,31,31,31,31,26,26,20,20,16,16,10,8,5,3];
        var dP=[0,0,0,0,0,0,0,10,15,20,26,31,36,36,36,36,31,31,26,26,20,16,10,8,5,3];
        var synStart2=new Date(PLAN.startDate);var synD2=new Date(synStart2);var synWk2=0;var synDow2=0;
        while(synD2<=new Date(PLAN.endDate)){
          var dow2=synD2.getDay();
          if(dow2>=1&&dow2<=5){
            var iso2=synD2.getFullYear()+'-'+String(synD2.getMonth()+1).padStart(2,'0')+'-'+String(synD2.getDate()).padStart(2,'0');
            synPlan[iso2]={h:hP[synWk2]||0,m:mP[synWk2]||0,d:dP[synWk2]||0};
            synDow2++;if(synDow2%5===0)synWk2++;

        CACHE._dpPlanData=synPlan;

      document.getElementById('dp-meta').innerHTML='Actualizado '+new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
    }
    document.getElementById('dp-footer').textContent='Checklist Solar v2.8 · ISFV ATALAYA · '+_dpData.kpis.total+' trackers · Xamai Global · '+new Date().toLocaleDateString('es-ES',{year:'numeric',month:'long',day:'numeric'});

    dpRenderKPIs();
    dpRender();
  }).catch(function(err){

    document.getElementById('dp-footer').textContent='Checklist Solar v2.8 · ISFV ATALAYA · DEMO · Xamai Global';

}

function dpRenderKPIs(){
  if(!_dpData)return;
  var k=_dpData.kpis;
  var CC={green:'#16A34A',greenS:'#DCFCE7',blue:'#3B82F6',blueS:'#DBEAFE',amber:'#F59E0B',amberS:'#FEF3C7',ts:'#64748B'};

  function kpiCard(icon,label,val,sub,color,bg,filter){
    return '<div onclick="window._dpFilter=\''+filter+'\';dpRender()" style="background:#fff;border-radius:14px;padding:18px 16px;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid '+(window._dpFilter===filter?color:'#E2E8F0')+';display:flex;align-items:center;gap:14px;cursor:pointer;transition:border-color .2s">'
      +'<div style="width:44px;height:44px;border-radius:11px;background:'+bg+';display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">'+icon+'</div>'
      +'<div><div style="font-size:26px;font-weight:700;color:'+color+';line-height:1.1">'+val.toLocaleString('es-ES')+'</div>'
      +'<div style="font-size:11px;color:'+CC.ts+';font-weight:500;margin-top:2px">'+label+'</div>'
      +(sub?'<div style="font-size:10px;color:#94A3B8;margin-top:1px">'+sub+'</div>':'')
      +'</div></div>';
  }

  document.getElementById('dp-kpis').innerHTML=
    kpiCard('\u2705','Validados',k.completed,k.pct+'% del total',CC.green,CC.greenS,'completed')
    +kpiCard('\ud83d\udd04','En curso',k.inProgress,'de '+k.total+' trackers',CC.blue,CC.blueS,'inprogress')
    +kpiCard('\u26a0\ufe0f','Incidencias',k.incidents,'',CC.amber,CC.amberS,'incidents')
    +kpiCard('\u23f3','Pendientes',k.pending,'',CC.ts,'#F1F5F9','pending');
}

function dpRender(){
  _dpDestroy();
  if(!_dpData)return;
  var el=document.getElementById('dp-content');
  var d=_dpData;

  // If a filter is active, show filtered tracker list
  if(window._dpFilter){
    dpFilteredList(el,d,window._dpFilter);
    return;
  }

  if(_dpTab==='overview')dpOverview(el,d);
  else if(_dpTab==='pvs')dpPvs(el,d);
  else if(_dpTab==='team')dpTeam(el,d);
  else if(_dpTab==='incidents')dpIncidents(el,d);
  else if(_dpTab==='plan')dpPlan(el,d);
}

function dpFilteredList(el,d,filter){
  var labels={completed:'\u2705 Trackers validados',inprogress:'\ud83d\udd04 Trackers en curso',incidents:'\u26a0\ufe0f Trackers con incidencias',pending:'\u23f3 Trackers pendientes'};
  var colors={completed:'#16A34A',inprogress:'#3B82F6',incidents:'#F59E0B',pending:'#64748B'};

  // Build tracker list from _dpData.byPv
  var allTrackers=[];
  var conAll=CACHE._dpCon||{};
  Object.keys(MASTER_DATA).forEach(function(code){
    var md=MASTER_DATA[code];var cfg=PCFG[md.type];if(!cfg)return;
    var fc=fbCode(code);var con=conAll[fc]||{};
    var pv='PV'+String(md.pv).padStart(2,'0');
    var totalP=0,hincP=0,rechP=0;
    for(var f=0;f<(cfg.conducida?2:1);f++){
      var px=f===0?'fm':'fc';var pils=f===0?cfg.motor:cfg.conducida;
      for(var i=0;i<pils.length;i++){totalP++;var est=con[px+'_'+i+'_estado']||'';if(est==='hincada')hincP++;else if(est==='rechazo')rechP++}
    }
    var allDone=totalP>0&&hincP===totalP;
    var hasIssue=rechP>0;
    var started=hincP>0||rechP>0;
    var status=allDone?'completed':hasIssue?'incidents':started?'inprogress':'pending';
    allTrackers.push({code:code,pv:pv,sub:md.sub||0,type:md.type,totalP:totalP,hincP:hincP,rechP:rechP,status:status,tech:con._lastBy||''});
  });

  var filtered=allTrackers.filter(function(t){
    if(filter==='incidents')return t.rechP>0;
    return t.status===filter;
  });

  var h='<div style="margin-bottom:12px;display:flex;align-items:center;justify-content:space-between">';
  h+='<div style="display:flex;align-items:center;gap:8px"><span style="font-size:18px;font-weight:700;color:'+colors[filter]+'">'+labels[filter]+'</span>';
  h+='<span style="background:'+colors[filter]+'18;color:'+colors[filter]+';font-size:12px;font-weight:700;padding:2px 10px;border-radius:12px">'+filtered.length+'</span></div>';
  h+='<button onclick="window._dpFilter=null;dpRenderKPIs();dpRender()" style="padding:6px 14px;border-radius:8px;background:#fff;border:1px solid #E2E8F0;font-size:12px;color:#64748B;cursor:pointer;font-family:inherit">\u2715 Cerrar</button>';
  h+='</div>';

  // Group by PV
  var byPv={};
  filtered.forEach(function(t){if(!byPv[t.pv])byPv[t.pv]=[];byPv[t.pv].push(t)});

  if(filtered.length===0){
    h+='<div style="text-align:center;padding:40px;color:#94A3B8">Sin trackers en esta categor\u00eda</div>';
  }else{
    Object.keys(byPv).sort().forEach(function(pvName){
      var items=byPv[pvName];
      h+='<div style="margin-bottom:12px">';
      h+='<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px"><span style="background:#DBEAFE;color:#3B82F6;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700">'+pvName+'</span><span style="font-size:10px;color:#94A3B8">'+items.length+' trackers</span></div>';
      items.forEach(function(t){
        var pct=t.totalP>0?Math.round(t.hincP/t.totalP*100):0;
        var barC=t.status==='completed'?'#16A34A':t.rechP>0?'#EF4444':t.hincP>0?'#3B82F6':'#CBD5E1';
        h+='<div style="display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;background:#fff;border:1px solid #E2E8F0;margin-bottom:4px">';
        h+='<span style="font-weight:700;font-size:12px;color:#1E293B;width:64px">'+t.code+'</span>';
        h+='<div style="flex:1;height:6px;border-radius:3px;background:#F1F5F9;overflow:hidden"><div style="height:100%;border-radius:3px;background:'+barC+';width:'+pct+'%"></div></div>';
        h+='<span style="font-size:10px;font-weight:600;color:'+barC+';width:40px;text-align:right">'+t.hincP+'/'+t.totalP+'</span>';
        if(t.rechP>0)h+='<span style="font-size:10px;color:#EF4444;font-weight:700">'+t.rechP+'\u26a0</span>';
        if(t.tech)h+='<span style="font-size:9px;color:#94A3B8;width:60px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+t.tech+'</span>';
        h+='</div>';
      });
      h+='</div>';
    });
  }

  el.innerHTML=h;
}

    +'<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid rgba(5,150,105,.13)">'

function _dpLegendItem(color,label,val){
  return '<div style="display:flex;align-items:center;gap:8px">'
    +'<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:'+color+'"></span>'
    +'<span style="font-size:11px;color:#64748B;width:72px">'+label+'</span>'

function dpPvs(el,d){
  var h='';
  d.byPv.forEach(function(pv){
    var pct=pv.total>0?Math.round(pv.done/pv.total*100):0;
    var pilPct=pv.pilTotal>0?Math.round(pv.pilDone/pv.pilTotal*100):0;
    var barColor=pct>=80?'#16A34A':pct>=40?'#059669':'#94A3B8';
    var barBg=pct>=80?'#DCFCE7':pct>=40?'#D1FAE5':'#F1F5F9';

    h+='<div style="margin-bottom:16px">';
    h+='<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px">';
    h+='<div style="display:flex;align-items:center;gap:10px">';
    h+='<span style="font-size:14px;font-weight:700;color:'+barColor+';width:48px">'+pv.pv+'</span>';
    h+='<span style="font-size:11px;color:#94A3B8">'+pv.done+'/'+pv.total+' trackers · '+pv.pilDone+'/'+pv.pilTotal+' hincas</span></div>';
    h+='<div style="display:flex;align-items:center;gap:10px">';
    if(pv.issues>0)h+='<span style="font-size:10px;color:#EF4444;font-weight:600">'+pv.issues+' incid.</span>';
    h+='<span style="font-size:15px;font-weight:700;color:'+barColor+'">'+pilPct+'%</span></div></div>';
    // Bar
    h+='<div style="position:relative">';
    h+='<div style="width:100%;height:10px;border-radius:5px;background:'+barBg+';overflow:hidden">';
    h+='<div style="height:100%;border-radius:5px;background:linear-gradient(90deg,'+barColor+','+barColor+'dd);width:'+pilPct+'%;transition:width .8s"></div></div>';
    h+='</div></div>';
  });

  el.innerHTML=_dpCard('Avance por subcampo fotovoltaico','⚡',h);
}

function dpTeam(el,d){

        rh+='<td style="padding:8px;background:'+bg+';font-weight:600">'+t.name+'</td>';
        rh+='<td style="padding:8px;background:'+bg+';font-weight:700;color:#3B82F6">'+t.pilars+'</td>';
        rh+='<td style="padding:8px;background:'+bg+';font-weight:700;color:#EF4444">'+(t.rechazos||0)+'</td>';
        rh+='<td style="padding:8px;background:'+bg+';font-weight:700;color:'+ratioColor+'">'+ratio+'%</td>';
        rh+='<td style="padding:8px;background:'+bg+'">'+t.started+'</td>';
        rh+='<td style="padding:8px;background:'+bg+';border-radius:0 8px 8px 0"><div style="display:flex;align-items:center;gap:6px"><div style="width:40px;height:5px;border-radius:3px;background:#E2E8F0;overflow:hidden"><div style="height:100%;border-radius:3px;background:'+(effPct>=80?'#16A34A':'#F59E0B')+';width:'+effPct+'%"></div></div><span style="font-size:10px;font-weight:600">'+effPct+'%</span></div></td>';
        rh+='</tr>';
      });
      rh+='</tbody></table></div>';
      return rh;
    }())+'</div>';

    // TECH CARDS
    h+='<div class="dp-grid2">';
    d.byTech.forEach(function(t,i){
      var ci=colors[i%5];
      var ratio=t.pilars>0?Math.round(t.rechazos/t.pilars*1000)/10:0;
      h+='<div onclick="window._dpSelTech=\''+t.name.replace(/'/g,"\\'")+'\';dpRender()" style="background:#fff;border-radius:14px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid #E2E8F0;cursor:pointer;transition:border-color .2s" onmouseover="this.style.borderColor=\''+ci.c+'\'" onmouseout="this.style.borderColor=\'#E2E8F0\'">';
      h+='<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">';

      h+='<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px">';
      [{v:t.pilars,l:'Hincas',c:'#3B82F6',bg:'#DBEAFE'},{v:t.done,l:'Completados',c:'#16A34A',bg:'#DCFCE7'},{v:t.rechazos||0,l:'Rechazos',c:'#EF4444',bg:'#FEE2E2'},{v:t.started,l:'Trackers',c:'#8B5CF6',bg:'#EDE9FE'}].forEach(function(s){
        h+='<div style="background:'+s.bg+';border-radius:6px;padding:6px 4px;text-align:center"><div style="font-size:16px;font-weight:700;color:'+s.c+'">'+s.v+'</div><div style="font-size:8px;color:#94A3B8">'+s.l+'</div></div>';
      });
      h+='</div></div>';
    });
    if(d.byTech.length===0)h+='<div style="grid-column:1/-1;color:#94A3B8;text-align:center;padding:30px">Sin datos de técnicos</div>';
    h+='</div>';
    el.innerHTML=h;
    return;
  }

  // ─── TECH DETAIL VIEW ───
  var t=selTech;
  var ci=colors[d.byTech.indexOf(t)%5]||colors[0];
  var ratio=t.pilars>0?Math.round(t.rechazos/t.pilars*1000)/10:0;
  var effPct=t.started>0?Math.round(t.done/t.started*100):0;
  var tv=window._dpTeamView;

  var h='';
  // Back button + header
  h+='<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">';
  h+='<button onclick="window._dpSelTech=null;dpRender()" style="width:36px;height:36px;border-radius:10px;background:#fff;border:1px solid #E2E8F0;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#64748B;box-shadow:0 1px 3px rgba(0,0,0,.06)">←</button>';
  h+='<div style="width:48px;height:48px;border-radius:13px;background:linear-gradient(135deg,'+ci.c+','+ci.g+');display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:#fff">'+t.name.charAt(0)+'</div>';
  h+='<div><div style="font-size:18px;font-weight:700">'+t.name+'</div>';
  h+='<div style="font-size:11px;color:#94A3B8">Ratio rechazos: <span style="color:'+(ratio<2?'#16A34A':ratio<5?'#F59E0B':'#EF4444')+'">'+ratio+'%</span></div></div></div>';

  // KPI row
  h+='<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:14px">';
  [{v:t.pilars,l:'Hincas',c:'#3B82F6'},{v:t.done,l:'Completados',c:'#16A34A'},{v:t.rechazos||0,l:'Rechazos',c:'#EF4444'},{v:t.started,l:'Trackers',c:'#8B5CF6'},{v:effPct+'%',l:'Eficacia',c:effPct>=80?'#16A34A':'#F59E0B'}].forEach(function(s){
    h+='<div style="background:#fff;border-radius:10px;padding:10px 6px;text-align:center;border:1px solid #E2E8F0"><div style="font-size:20px;font-weight:700;color:'+s.c+'">'+s.v+'</div><div style="font-size:9px;color:#94A3B8">'+s.l+'</div></div>';
  });
  h+='</div>';

  // Sub-tabs
  h+='<div style="display:flex;gap:4px;margin-bottom:14px">';
  [{id:'trackers',l:'📋 Trackers'},{id:'timeline',l:'📅 Timeline'},{id:'ranking',l:'🏆 Ranking'},{id:'ruta',l:'🗺️ Ruta'}].forEach(function(tab){
    var active=tv===tab.id;
    h+='<button onclick="window._dpTeamView=\''+tab.id+'\';dpRender()" style="flex:1;padding:8px;border-radius:8px;font-size:11px;font-weight:'+(active?'700':'500')+';border:2px solid '+(active?ci.c:'#E2E8F0')+';background:'+(active?ci.c+'15':'#fff')+';color:'+(active?ci.c:'#64748B')+';cursor:pointer;font-family:inherit">'+tab.l+'</button>';
  });
  h+='</div>';

  // --- TRACKERS TAB ---
  if(tv==='trackers'){
    var trs=t.trackers||[];

      h+='<div style="font-size:11px;color:#94A3B8;margin-bottom:10px">'+trs.length+' trackers trabajados</div>';

        var trPct=tr.totalP>0?Math.round(tr.hincP/tr.totalP*100):0;

        if(tr.rechP>0)h+='<span style="font-size:9px;color:#EF4444;font-weight:700">'+tr.rechP+'⚠</span>';

        h+='</div>';
      });
    }
    h+='</div>';
  }

  // --- TIMELINE TAB ---
  else if(tv==='timeline'){
    var logs=t.logs||[];
    // Group by day
    var byDay={};
    logs.forEach(function(l){
      if(!l.ts)return;
      var d2=new Date(l.ts);
      var dk=d2.toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'});
      if(!byDay[dk])byDay[dk]={date:dk,ts:l.ts,items:[]};
      byDay[dk].items.push(l);
    });
    var days=Object.values(byDay).sort(function(a,b){return b.ts-a.ts});

    h+='<div style="background:#fff;border-radius:14px;padding:16px;border:1px solid #E2E8F0">';

    else{
      h+='<div style="font-size:11px;color:#94A3B8;margin-bottom:10px">'+logs.length+' acciones en '+days.length+' días</div>';

        var hincados=day.items.filter(function(l){return l.value==='hincada'}).length;

    var ratioPos=ratioRank.findIndex(function(x){return x.name===t.name})+1;
    rankings.push({metric:'Ratio rechazos (menor=mejor)',val:ratio+'%',pos:ratioPos,total:allT.length,best:(ratioRank[0].pilars>0?Math.round(ratioRank[0].rechazos/ratioRank[0].pilars*1000)/10:0)+'%',c:'#F59E0B'});
    // Eficacia
    var effRank=allT.slice().sort(function(a,b){var ea=a.started>0?a.done/a.started:0;var eb=b.started>0?b.done/b.started:0;return eb-ea});
    var effPos=effRank.findIndex(function(x){return x.name===t.name})+1;
    rankings.push({metric:'Eficacia (completados/iniciados)',val:effPct+'%',pos:effPos,total:allT.length,best:(effRank[0].started>0?Math.round(effRank[0].done/effRank[0].started*100):0)+'%',c:'#8B5CF6'});

    h+='<div style="background:#fff;border-radius:14px;padding:16px;border:1px solid #E2E8F0">';
    h+='<div style="font-size:11px;color:#94A3B8;margin-bottom:12px">Posición de '+t.name+' respecto al equipo</div>';

      h+='<div style="font-size:18px;font-weight:700;color:'+r.c+'">'+r.val+'</div>';
      h+='</div>';
    });

    // Comparison bars
    h+='<div style="margin-top:14px;padding-top:14px;border-top:2px solid #E2E8F0">';
    h+='<div style="font-size:11px;font-weight:600;color:#64748B;margin-bottom:10px">Comparativa con equipo</div>';

      var otci=colors[oi%5];
      var isSel=ot.name===t.name;
      h+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">';
      h+='<span style="font-size:10px;font-weight:'+(isSel?'700':'500')+';color:'+(isSel?'#1E293B':'#94A3B8')+';width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+ot.name+'</span>';
      var maxPil=Math.max.apply(null,allT.map(function(x){return x.pilars}))||1;
      var barW=Math.round(ot.pilars/maxPil*100);
      h+='<div style="flex:1;height:8px;border-radius:4px;background:#F1F5F9;overflow:hidden"><div style="height:100%;border-radius:4px;background:'+(isSel?otci.c:'#CBD5E1')+';width:'+barW+'%"></div></div>';
      h+='<span style="font-size:10px;font-weight:600;color:'+(isSel?otci.c:'#94A3B8')+';width:36px;text-align:right">'+ot.pilars+'</span>';
      h+='</div>';
    });
    h+='</div>';

    h+='</div>';
  }

  // --- RUTA TAB (GPS route map) ---
  else if(tv==='ruta'){
    var logs=t.logs||[];
    var gpsLogs=logs.filter(function(l){return l.lat&&l.lng&&l.ts});
    // Group by day
    var routeDays={};
    gpsLogs.forEach(function(l){
      var d2=new Date(l.ts);
      var dk=d2.getFullYear()+'-'+String(d2.getMonth()+1).padStart(2,'0')+'-'+String(d2.getDate()).padStart(2,'0');
      if(!routeDays[dk])routeDays[dk]={key:dk,label:d2.toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'}),pts:[]};
      routeDays[dk].pts.push(l);
    });
    var rdKeys=Object.keys(routeDays).sort().reverse();
    if(!window._dpRouteDay&&rdKeys.length>0)window._dpRouteDay=rdKeys[0];
    var selDay=window._dpRouteDay;

    h+='<div style="background:#fff;border-radius:14px;padding:16px;border:1px solid #E2E8F0">';
    if(gpsLogs.length===0){
      h+='<div style="color:#94A3B8;text-align:center;padding:30px">Sin datos GPS registrados</div>';
    }else{
      // Day selector
      h+='<div style="margin-bottom:10px"><select id="dp-route-day" onchange="window._dpRouteDay=this.value;dpRender()" style="width:100%;height:40px;border-radius:8px;border:1px solid #E2E8F0;padding:0 12px;font-size:13px;font-family:inherit;background:#F8FAFC;color:#1E293B">';
      rdKeys.forEach(function(dk){
        var rd=routeDays[dk];
        h+='<option value="'+dk+'"'+(dk===selDay?' selected':'')+'>'+rd.label+' — '+rd.pts.length+' puntos</option>';
      });
      h+='</select></div>';
      // Stats for selected day
      var dayData=routeDays[selDay];
      if(dayData){
        var pts=dayData.pts.sort(function(a,b){return a.ts-b.ts});
        var hincas=pts.filter(function(p){return p.value==='hincada'}).length;
        var rechs=pts.filter(function(p){return p.value==='rechazo'}).length;
        var t0=new Date(pts[0].ts);var t1=new Date(pts[pts.length-1].ts);
        h+='<div style="display:flex;gap:8px;margin-bottom:10px;font-size:11px;color:#64748B;flex-wrap:wrap">';
        h+='<span>'+String(t0.getHours()).padStart(2,'0')+':'+String(t0.getMinutes()).padStart(2,'0')+' → '+String(t1.getHours()).padStart(2,'0')+':'+String(t1.getMinutes()).padStart(2,'0')+'</span>';
        h+='<span>· '+pts.length+' registros</span>';
        h+='<span>· <span style="color:#16A34A;font-weight:600">'+hincas+' hincas</span></span>';
        if(rechs)h+='<span>· <span style="color:#EF4444;font-weight:600">'+rechs+' rechazos</span></span>';
        h+='</div>';
      }
      // Map container
      h+='<div id="dp-route-map" style="width:100%;height:350px;border-radius:10px;overflow:hidden;border:1px solid #E2E8F0"></div>';
      // Legend
      h+='<div style="display:flex;gap:12px;margin-top:8px;font-size:10px;color:#64748B">';
      h+='<span><span style="display:inline-block;width:10px;height:3px;background:#3B82F6;border-radius:2px;vertical-align:middle;margin-right:3px"></span>Recorrido</span>';
      h+='<span><span style="display:inline-block;width:8px;height:8px;background:#16A34A;border-radius:50%;vertical-align:middle;margin-right:3px"></span>Hincada</span>';
      h+='<span><span style="display:inline-block;width:8px;height:8px;background:#EF4444;border-radius:50%;vertical-align:middle;margin-right:3px"></span>Rechazo</span>';
      h+='<span><span style="display:inline-block;width:8px;height:8px;background:#94A3B8;border-radius:50%;vertical-align:middle;margin-right:3px"></span>Otro</span>';
      h+='</div>';
    }
    h+='</div>';
  }

  el.innerHTML=h;

  // Initialize Leaflet map after DOM render
  if(tv==='ruta'){
    setTimeout(function(){
      var mapEl=document.getElementById('dp-route-map');
      if(!mapEl)return;
      try{
        var selDay2=window._dpRouteDay;
        var logs2=t.logs||[];
        var gpsLogs2=logs2.filter(function(l){return l.lat&&l.lng&&l.ts});
        var routeDays2={};
        gpsLogs2.forEach(function(l){
          var d2=new Date(l.ts);
          var dk2=d2.getFullYear()+'-'+String(d2.getMonth()+1).padStart(2,'0')+'-'+String(d2.getDate()).padStart(2,'0');
          if(!routeDays2[dk2])routeDays2[dk2]=[];
          routeDays2[dk2].push(l);
        });
        var pts2=(routeDays2[selDay2]||[]).sort(function(a,b){return a.ts-b.ts});
        if(pts2.length===0)return;

        var map=L.map(mapEl,{zoomControl:true,attributionControl:false});
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19}).addTo(map);

        // Draw polyline
        var latlngs=pts2.map(function(p){return[p.lat,p.lng]});
        L.polyline(latlngs,{color:'#3B82F6',weight:3,opacity:0.8,dashArray:'8,6'}).addTo(map);

        // Add markers
        pts2.forEach(function(p,pi){
          var isFirst=pi===0;var isLast=pi===pts2.length-1;
          var pTime=new Date(p.ts);
          var timeStr=String(pTime.getHours()).padStart(2,'0')+':'+String(pTime.getMinutes()).padStart(2,'0');
          var color=p.value==='hincada'?'#16A34A':p.value==='rechazo'?'#EF4444':'#94A3B8';
          var radius=isFirst||isLast?8:p.value==='rechazo'?6:4;
          var fillOpacity=isFirst||isLast?1:0.8;

          var circle=L.circleMarker([p.lat,p.lng],{radius:radius,fillColor:isFirst?'#3B82F6':isLast?'#F59E0B':color,color:'#fff',weight:isFirst||isLast?3:1,fillOpacity:fillOpacity}).addTo(map);
          circle.bindPopup('<div style="font-family:IBM Plex Sans,sans-serif;font-size:12px"><b>'+timeStr+'</b>'+(isFirst?' 🏁 INICIO':'')+(isLast?' 🏆 FIN':'')+'<br>'+p.tracker+'<br>'+p.field+' → <b style="color:'+color+'">'+p.value+'</b></div>');

          // Number labels for first and last
          if(isFirst||isLast){
            L.marker([p.lat,p.lng],{icon:L.divIcon({className:'',html:'<div style="font-size:9px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.8);text-align:center;margin-top:-18px">'+(isFirst?'INICIO':'FIN')+'</div>',iconSize:[40,20],iconAnchor:[20,10]})}).addTo(map);
          }
        });

        // Fit bounds
        var bounds=L.latLngBounds(latlngs);
        map.fitBounds(bounds.pad(0.15));
      }catch(mapErr){DBG('Route map error: '+mapErr.message)}
    },100);
    return;
  }
}

function dpIncidents(el,d){
  if(!window._dpIncSub)window._dpIncSub='hincado';
  if(!window._dpIncExp)window._dpIncExp={};
  var sub=window._dpIncSub;

  var conInc=d.incidents||[];
  var qualInc=d.qualIncidents||[];
  var allInc=conInc.map(function(x){return x}).concat(qualInc.map(function(x){return x}));
  allInc.sort(function(a,b){return(a.pv+a.tracker).localeCompare(b.pv+b.tracker)});

  var lists={hincado:conInc,calidad:qualInc,todas:allInc};
  var labels={hincado:'🏗️ Hincado ('+conInc.length+')',calidad:'✅ Calidad ('+qualInc.length+')',todas:'📋 Todas ('+allInc.length+')'};
  var colors={hincado:'#EF4444',calidad:'#F59E0B',todas:'#3B82F6'};

  var h='';

  ['hincado','calidad','todas'].forEach(function(t){

    h+='<div style="flex:1;padding:10px;border-radius:10px;background:#DBEAFE;text-align:center"><div style="font-size:22px;font-weight:700;color:#3B82F6">'+(nH+nQ)+'</div><div style="font-size:10px;color:#64748B">Total</div></div>';

  });

  if(items.length===0){
    h+='<div style="text-align:center;padding:30px;color:#94A3B8">Sin incidencias de '+(sub==='todas'?'ningún tipo':sub)+' registradas</div>';
  }else{
    var pvKeys=Object.keys(byPv).sort();
    pvKeys.forEach(function(pvName){
      var pvItems=byPv[pvName];
      h+='<div style="margin-bottom:12px">';
      h+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">';
      h+='<span style="background:#DBEAFE;color:#3B82F6;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700">'+pvName+'</span>';
      h+='<span style="font-size:11px;color:#94A3B8">'+pvItems.length+' incidencia'+(pvItems.length>1?'s':'')+'</span>';
      h+='</div>';

      pvItems.forEach(function(inc){
        var expKey=inc.tracker+'_'+inc.tipo;
        var isExp=!!window._dpIncExp[expKey];
        var borderColor=inc.tipo==='hincado'?'#EF4444':'#F59E0B';
        var iconTipo=inc.tipo==='hincado'?'🏗️':'✅';

        h+='<div style="background:#fff;border:1px solid #E2E8F0;border-left:4px solid '+borderColor+';border-radius:10px;margin-bottom:6px;overflow:hidden">';
        // Header row — clickable
        h+='<button onclick="window._dpIncExp[\''+expKey+'\']=!window._dpIncExp[\''+expKey+'\'];dpRender()" style="width:100%;display:flex;align-items:center;gap:10px;padding:10px 14px;background:none;border:none;cursor:pointer;text-align:left;font-family:inherit">';
        h+='<span style="font-size:14px">'+iconTipo+'</span>';

        h+='<div style="font-size:13px;font-weight:700;color:#1E293B">'+inc.tracker+'</div>';
        h+='<div style="font-size:11px;color:#64748B;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+inc.field+'</div>';

        if(inc.date)h+='<span style="font-size:10px;color:#94A3B8;flex-shrink:0">'+inc.date+'</span>';
        h+='<span style="font-size:12px;color:#94A3B8;flex-shrink:0;transition:transform .2s;transform:rotate('+(isExp?'180':'0')+'deg)">▼</span>';
        h+='</button>';

        // Expandable details
        if(isExp&&inc.details&&inc.details.length>0){
          h+='<div style="padding:0 14px 12px;border-top:1px solid #F1F5F9">';
          inc.details.forEach(function(det,di){
            h+='<div style="display:flex;align-items:flex-start;gap:8px;padding:6px 0;'+(di<inc.details.length-1?'border-bottom:1px solid #F8FAFC;':'')+'">';
            h+='<span style="color:'+borderColor+';font-size:10px;margin-top:2px;flex-shrink:0">●</span>';
            h+='<span style="font-size:11px;color:#475569">'+det+'</span>';
            h+='</div>';
          });
          h+='</div>';
        }
        h+='</div>';
      });
      h+='</div>';
    });
  }

  el.innerHTML=_dpCard('Incidencias','⚠️',h);
}

function dpPlan(el,d){
  _dpDestroy();
  if(!window._dpPlanView)window._dpPlanView='chart';
  var pv=window._dpPlanView;
  var PLAN={startDate:'2025-06-02',endDate:'2026-09-15',totalPilars:0,totalTrackers:d.kpis.total};
  Object.keys(MASTER_DATA).forEach(function(code){var cfg=PCFG[MASTER_DATA[code].type];if(!cfg)return;PLAN.totalPilars+=(cfg.conducida?cfg.motor.length+cfg.conducida.length:cfg.motor.length)});
  if(PLAN.totalPilars===0)PLAN.totalPilars=15000;
  var startD=new Date(PLAN.startDate);var endD=new Date(PLAN.endDate);var today=new Date();today.setHours(0,0,0,0);
  // Generate day list (L-V only)
  function _isoD(dt){return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0')}
  var days=[];var wd=new Date(startD);
  while(wd<=endD){
    var dow=wd.getDay();
    if(dow>=1&&dow<=5){
      var wkNum=Math.ceil(((wd-startD)/(1000*60*60*24)+1)/7);
      days.push({date:new Date(wd),iso:_isoD(wd),wk:wkNum,
        label:wd.toLocaleDateString('es-ES',{weekday:'short'})+' '+wd.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit'}),
        isPast:wd<today,isToday:_isoD(wd)===_isoD(today)});
    }
    wd.setDate(wd.getDate()+1);
  }
  // Load planning from Firebase (daily)
  if(!CACHE._dpPlanData&&!CACHE._dpPlanLoading){CACHE._dpPlanLoading=true;db.ref('planning/days').once('value',function(s){CACHE._dpPlanData=s.val()||{};CACHE._dpPlanLoading=false;dpRender()})}
  var planData=CACHE._dpPlanData||{};
  // Sub-tabs
  var h='<div style="display:flex;gap:4px;margin-bottom:14px">';
  [{id:'chart',l:'\ud83d\udcc8 Curva S'},{id:'edit',l:'\ud83d\udccb Planificar'}].forEach(function(tab){var active=pv===tab.id;h+='<button onclick="window._dpPlanView=\''+tab.id+'\';dpRender()" style="flex:1;padding:10px;border-radius:8px;font-size:12px;font-weight:'+(active?'700':'500')+';border:2px solid '+(active?'#059669':'#E2E8F0')+';background:'+(active?'#05966915':'#fff')+';color:'+(active?'#059669':'#64748B')+';cursor:pointer;font-family:inherit">'+tab.l+'</button>'});
  h+='</div>';
  // ─── EDIT VIEW ───
  if(pv==='edit'){
    h+='<div style="background:#fff;border-radius:14px;padding:16px;border:1px solid #E2E8F0;margin-bottom:12px">';
    h+='<div style="font-size:13px;font-weight:700;color:#1E293B;margin-bottom:10px">Rellenar objetivo diario base</div>';
    h+='<div style="display:flex;gap:8px;align-items:end;flex-wrap:wrap">';
    h+='<div><div style="font-size:9px;color:#94A3B8;margin-bottom:2px">Hincas</div><input id="pf-h" class="inp" type="number" value="80" style="width:72px;height:36px;font-size:14px;background:#F8FAFC"></div>';
    h+='<div><div style="font-size:9px;color:#94A3B8;margin-bottom:2px">Montaje</div><input id="pf-m" class="inp" type="number" value="6" style="width:72px;height:36px;font-size:14px;background:#F8FAFC"></div>';
    h+='<div><div style="font-size:9px;color:#94A3B8;margin-bottom:2px">M\u00f3dulos</div><input id="pf-d" class="inp" type="number" value="8" style="width:72px;height:36px;font-size:14px;background:#F8FAFC"></div>';
    h+='<button onclick="dpPlanFillAll()" style="padding:8px 14px;border-radius:8px;background:#059669;color:#fff;border:none;font-weight:700;font-size:12px;cursor:pointer;height:36px;font-family:inherit">Rellenar todo</button>';
    h+='</div></div>';
    // Day table grouped by week
    h+='<div style="background:#fff;border-radius:14px;padding:12px;border:1px solid #E2E8F0;overflow-x:auto;-webkit-overflow-scrolling:touch;max-height:60vh;overflow-y:auto">';
    h+='<table style="width:100%;border-collapse:collapse;font-size:11px;min-width:400px"><thead><tr>';
    ['D\u00eda','Hincas','Montaje','M\u00f3dulos'].forEach(function(hd){h+='<th style="text-align:left;padding:6px 4px;font-size:9px;font-weight:600;color:#94A3B8;text-transform:uppercase;border-bottom:2px solid #E2E8F0;position:sticky;top:0;background:#fff;z-index:1">'+hd+'</th>'});
    h+='</tr></thead><tbody>';
    var lastWk=0;
    days.forEach(function(day){
      // Week separator
      if(day.wk!==lastWk){
        lastWk=day.wk;
        h+='<tr><td colspan="4" style="padding:8px 4px 4px;font-size:10px;font-weight:700;color:#059669;border-top:2px solid #E2E8F0;background:#F0FDF4">Semana '+day.wk+'</td></tr>';
      }
      var pd=planData[day.iso]||{};
      var bg=day.isToday?'#F0FDF4':day.isPast?'#FAFBFC':'#fff';
      h+='<tr style="background:'+bg+'" data-day="'+day.iso+'">';
      h+='<td style="padding:4px;font-weight:'+(day.isToday?'700':'500')+';font-size:10px;white-space:nowrap;'+(day.isToday?'border-left:3px solid #16A34A;':'')+'">'+day.label+(day.isToday?' \u2190':'')+'</td>';
      ['h','m','d'].forEach(function(act){
        var val=pd[act]!=null?pd[act]:'';
        h+='<td style="padding:2px"><input type="number" min="0" value="'+val+'" onchange="dpPlanSetDay(\''+day.iso+'\',\''+act+'\',this.value)" style="width:60px;height:28px;border-radius:6px;border:1px solid #E2E8F0;text-align:center;font-size:12px;font-weight:600;font-family:inherit;background:'+(val?'#fff':'#FEF3C7')+'" placeholder="\u2014"></td>';

      h+='</tr>';
    });
    h+='</tbody></table></div>';
    // Totals
    var totH=0,totM=0,totD=0,totDays=0;
    days.forEach(function(day){var pd=planData[day.iso]||{};totH+=(pd.h||0);totM+=(pd.m||0);totD+=(pd.d||0);if(pd.h||pd.m||pd.d)totDays++});
    h+='<div style="background:#fff;border-radius:14px;padding:14px;border:1px solid #E2E8F0;margin-top:12px"><div style="font-size:12px;font-weight:700;margin-bottom:8px">Totales planificados</div>';
    h+='<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px">';

      h+='<div style="text-align:center;padding:8px;background:#F8FAFC;border-radius:6px"><div style="font-size:20px;font-weight:700;color:'+s.c+'">'+s.v.toLocaleString('es-ES')+'</div><div style="font-size:8px;color:#94A3B8">'+s.l+'</div><div style="font-size:8px;color:#CBD5E1">'+s.t+'</div></div>'});

    if(todayRow)setTimeout(function(){todayRow.scrollIntoView({block:'center',behavior:'smooth'})},100);

  }
  // ─── CHART VIEW ───
  var cumH=0,cumM=0,cumD=0;var plannedH={},plannedM={},plannedD={};
  days.forEach(function(day){
    var pd=planData[day.iso]||{};
    cumH+=(pd.h||0);cumM+=(pd.m||0);cumD+=(pd.d||0);
    plannedH[day.iso]=Math.round(cumH);plannedM[day.iso]=Math.round(cumM);plannedD[day.iso]=Math.round(cumD);
