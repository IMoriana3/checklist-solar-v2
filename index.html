<style>
:root{
  /* Tokens de la casa Factiun */
  --void:#0B0F14;--panel:#121922;--panel-2:#0F151D;--line:#23303D;--text:#E7EEF4;--muted:#8093A4;--accent:#36D399;--radius:14px;
  --sans:'IBM Plex Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;--display:'Space Grotesk',var(--sans);
  /* Alias del esquema previo → tokens (la app ya era oscura) */
  --bg:var(--void);--sf:var(--panel);--sf2:var(--panel-2);--bd:var(--line);--tx:var(--text);--td:var(--muted);--tx3:#565a6e;--ac:var(--accent);
  /* Semánticos (se conservan) */
  --ok:#22c55e;--no:#ef4444;--warn:#f59e0b;--info:#3b82f6;--purple:#a78bfa;
  /* Faltaban (estaban usadas sin definir → bug de variables) */
  --card:var(--panel);--err:#ef4444;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;overflow-x:hidden}
input,select,textarea,button{font-family:inherit;outline:none}
.hide{display:none!important}

/* Layout */
.hdr{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--bg);z-index:10}
.hdr h1{font-size:17px;letter-spacing:-.3px}
.hdr .sub{font-size:11px;color:var(--td)}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:6px}
.cnt{padding:0 16px 100px}
.btn-icon{width:38px;height:38px;border-radius:10px;border:1px solid var(--bd);background:var(--sf);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--td);font-size:16px}

/* Forms */
.inp{width:100%;height:46px;border-radius:10px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);padding:0 14px;font-size:14px}
.inp:focus{border-color:var(--ac)}
.sel{width:100%;height:46px;border-radius:10px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);padding:0 14px;font-size:14px;appearance:none}
.ta{width:100%;border-radius:10px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);padding:10px 14px;font-size:13px;resize:vertical}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:10px}
.stitle{font-size:11px;font-weight:700;color:var(--td);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 6px}

/* Progress */
.prog{width:100%;height:6px;border-radius:3px;background:var(--bd);overflow:hidden}
.prog-f{height:100%;border-radius:3px;transition:width .8s ease}
.done{background:var(--ok)!important}

/* Buttons */
.btn{width:100%;padding:14px;border-radius:12px;font-size:15px;font-weight:700;border:none;cursor:pointer;transition:all .2s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--ac);color:#000}
.btn-danger{background:var(--no);color:#fff}
.btn-info{background:var(--info);color:#fff}
.btn-warn{background:var(--warn);color:#000}
.btn-ghost{background:transparent;border:1px solid var(--bd);color:var(--td)}

/* Mode cards */
.mode-card{width:100%;max-width:340px;padding:28px 20px;border-radius:16px;color:#fff;font-size:18px;font-weight:700;cursor:pointer;text-align:left;border:2px solid;transition:transform .2s}
.mode-card:active{transform:scale(.97)}

/* Tracker list */
.tr-item{display:block;width:100%;text-align:left;padding:12px;border-radius:10px;background:var(--sf);border:1px solid var(--bd);margin-bottom:6px;cursor:pointer;transition:border-color .2s}
.tr-item:active{border-color:var(--ac)}

/* Status badges */
.badge{font-size:10px;padding:3px 8px;border-radius:10px;font-weight:600;display:inline-flex;align-items:center;gap:3px}

/* Punchlist */
.pl-item{padding:12px;border-radius:10px;background:var(--sf);border:1px solid var(--bd);margin-bottom:6px}

/* Online indicator */
.online-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}
.online-dot.on{background:var(--ok);animation:pulse 2s infinite}
.online-dot.off{background:var(--no)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* Login */
.login-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.login-card{width:100%;max-width:360px;padding:32px 24px;border-radius:20px;background:var(--sf);border:1px solid var(--bd)}
.login-logo{font-size:11px;letter-spacing:3px;color:var(--tx3);text-transform:uppercase;text-align:center;margin-bottom:8px}
.login-title{font-size:24px;font-weight:700;text-align:center;margin-bottom:4px}
.login-sub{font-size:12px;color:var(--td);text-align:center;margin-bottom:24px}
.login-err{font-size:12px;color:var(--no);text-align:center;margin-top:8px;min-height:18px}

/* Toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:999;transition:opacity .3s;pointer-events:none}
</style>

var U=null; // Current user {uid, email, name, role, pin}
var V={screen:'loading'}; // View state

// ============================================================
// HELPERS
// ============================================================
var _toastTimer=null;
function toast(msg,color){showToast(msg,color)}
function showToast(msg,color){
  if(_toastTimer)clearTimeout(_toastTimer);
  var t=document.getElementById('toast');
  t.textContent=msg;t.style.background=color||'var(--sf)';t.style.color=color?'#fff':'var(--tx)';
  t.style.border='1px solid '+(color||'var(--bd)');
  t.style.opacity=1;_toastTimer=setTimeout(function(){t.style.opacity=0},2500);
}

function isAdmin(){return U&&(U.role==='admin'||ADMIN_EMAILS.indexOf(U.email)>=0)}
function isCon(){return U&&(U.role==='construccion'||U.role==='supervisor'||isAdmin())}
function isCal(){return U&&(U.role==='calidad'||U.role==='supervisor'||isAdmin())}

// Firebase write helper
// Firebase path sanitizer - dots not allowed in paths
function fbCode(code){return code.replace(/\./g,'_')}

function fbSet(path,val){return db.ref(path).set(val)}
function fbPush(path,val){return db.ref(path).push(val)}
function fbGet(path){return db.ref(path).once('value').then(function(s){return s.val()})}
function fbListen(path,cb){db.ref(path).on('value',function(s){cb(s.val())})}

// AUTH

function rLogin(a){

  h+='<div class="login-card">';

}

function rRegister(a){
  var h='<div class="login-wrap">';
  h+='<div class="login-card">';
  h+='<div class="login-title" style="font-size:20px">Crear Cuenta</div>';
  h+='<div class="login-sub">Pide las credenciales a tu supervisor</div>';
  h+='<input class="inp" id="r-name" type="text" placeholder="Nombre completo" style="margin-bottom:8px">';

function doLogin(){
  var email=document.getElementById('l-email').value.trim();
  var pass=document.getElementById('l-pass').value;
  document.getElementById('l-err').textContent='Conectando...';
  auth.signInWithEmailAndPassword(email,pass).catch(function(e){
    var msg=e.code==='auth/user-not-found'?'Usuario no encontrado':e.code==='auth/wrong-password'?'Contraseña incorrecta':'Error: '+e.message;
    document.getElementById('l-err').textContent=msg;
  });
}

function doRegister(){
  var name=document.getElementById('r-name').value.trim();
  var email=document.getElementById('r-email').value.trim();
  var pass=document.getElementById('r-pass').value;
  var role=document.getElementById('r-role').value;
  if(!name||!email||!pass){document.getElementById('r-err').textContent='Rellena todos los campos';return}
  document.getElementById('r-err').textContent='Creando cuenta...';
  auth.createUserWithEmailAndPassword(email,pass).then(function(cred){
    return db.ref('users/'+cred.user.uid).set({name:name,email:email,role:role,created:Date.now()});
  }).catch(function(e){
    document.getElementById('r-err').textContent=e.message;
  });
}

      document.getElementById('app').innerHTML='<div style="padding:40px;color:#ef4444"><h2>Error de perfil</h2><p>'+authErr.message+'</p><p style="margin-top:8px;font-size:12px;color:#8b8fa3">Email: '+user.email+'<br>UID: '+user.uid+'</p><button onclick="auth.signOut().then(function(){location.reload()})" style="margin-top:12px;padding:10px 20px;background:#ef4444;color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer">Cerrar sesión y reintentar</button></div>';
    });

});

// ============================================================
// REALTIME LISTENERS
// ============================================================
function initListeners(){
  // Listen to workflow changes
  db.ref('workflow').on('value',function(s){
    CACHE.workflow=s.val()||{};
    // Re-render if on a workflow-dependent screen
    if(V.screen==='resumen'||V.screen==='condetail'||V.screen==='caldetail')R();
  });
  
  // Listen to punchlist changes
  db.ref('punchlist').on('value',function(s){
    CACHE.punchlist=s.val()||{};
    if(V.screen==='condetail'||V.screen==='caldetail')R();
  });
}

// ============================================================
// WORKFLOW
// ============================================================
var WF_STATES={
  CON:{l:'En construcción',c:'var(--info)',i:'🏗️',bg:'rgba(59,130,246,.15)'},
  REV:{l:'Pdte revisión',c:'var(--warn)',i:'📋',bg:'rgba(245,158,11,.15)'},
  CAL:{l:'En revisión',c:'var(--purple)',i:'🔍',bg:'rgba(167,139,250,.15)'},
  OK:{l:'Completado',c:'var(--ac)',i:'✅',bg:'rgba(34,197,94,.15)'},
  PUN:{l:'Punchlist',c:'var(--no)',i:'📝',bg:'rgba(239,68,68,.15)'},
  REP:{l:'En reparación',c:'var(--warn)',i:'🔧',bg:'rgba(245,158,11,.15)'},
  RREV:{l:'Pdte re-revisión',c:'var(--warn)',i:'📋',bg:'rgba(245,158,11,.15)'}
};
var WF_PHASES=['hincado','montaje','modulos'];
var WF_LABELS={hincado:'Hincado',montaje:'Montaje Estructura',modulos:'Montaje Módulos'};

function getWFState(pv,sub,phase){
  var wf=CACHE.workflow||{};
  var key=pv+'_'+sub+'_'+phase;
  return wf[key]||{state:'CON',since:0,by:'',trigger:'init'};
}

function setWFState(pv,sub,phase,state,trigger){
  var key=pv+'_'+sub+'_'+phase;
  var data={state:state,since:firebase.database.ServerValue.TIMESTAMP,by:U.name,trigger:trigger||'manual',uid:U.uid};
  db.ref('workflow/'+key).set(data);
  // Log
  db.ref('workflow_log').push({key:key,state:state,by:U.name,uid:U.uid,trigger:trigger,ts:firebase.database.ServerValue.TIMESTAMP});
  toast('Estado: '+WF_STATES[state].i+' '+WF_STATES[state].l,'var(--sf)');
}

function wfBadge(pv,sub,phase){
  var wf=getWFState(pv,sub,phase);
  var st=WF_STATES[wf.state]||WF_STATES.CON;
  return '<span class="badge" style="background:'+st.bg+';color:'+st.c+'">'+st.i+' '+st.l+'</span>';
}

// ============================================================
// PUNCHLIST
// ============================================================
function getPLItems(pv,sub,phase){
  var pl=CACHE.punchlist||{};
  var items=[];
  Object.keys(pl).forEach(function(id){
    var p=pl[id];
    if(String(p.pv)===String(pv)&&String(p.sub)===String(sub)&&p.phase===phase){
      items.push({id:id,d:p});
    }
  });
  return items;
}

function addPLItem(pv,sub,phase,tracker,pilar,campo,desc){
  db.ref('punchlist').push({
    pv:pv,sub:sub,phase:phase,tracker:tracker,pilar:pilar,campo:campo,desc:desc,
    estado:'pendiente',
    detectadoPor:U.name,uid:U.uid,fechaDeteccion:firebase.database.ServerValue.TIMESTAMP
  });
  toast('Añadido al punchlist','var(--no)');
}

function setPLEstado(id,estado){
  var updates={estado:estado};
  if(estado==='reparado'){updates.reparadoPor=U.name;updates.reparadoUid=U.uid;updates.fechaReparacion=firebase.database.ServerValue.TIMESTAMP}
  if(estado==='verificado'){updates.verificadoPor=U.name;updates.verificadoUid=U.uid;updates.fechaVerificacion=firebase.database.ServerValue.TIMESTAMP}
  db.ref('punchlist/'+id).update(updates);
  toast(estado==='reparado'?'Marcado como reparado':'Verificado','var(--ac)');
}

// ============================================================
// CONSTRUCTION DATA (Firebase)
// ============================================================
function setConField(code,key,val){
  if(V.viewOnly){showToast('Solo lectura','var(--warn)');return}
  var fc=code.replace(/\./g,'_');
  var updates={};
  updates['construction/'+fc+'/'+key]=val;
  updates['construction/'+fc+'/'+key+'_ts']=firebase.database.ServerValue.TIMESTAMP;
  updates['construction/'+fc+'/'+key+'_by']=U.name;
  // Update tracker-level metadata
  updates['construction/'+fc+'/_lastBy']=U.name;
  updates['construction/'+fc+'/_lastTS']=firebase.database.ServerValue.TIMESTAMP;

  var logEntry={tracker:code,field:key,value:String(val),by:U.name,uid:U.uid,ts:firebase.database.ServerValue.TIMESTAMP};

  // Capture GPS coordinates if available
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(function(pos){
      var lat=pos.coords.latitude;
      var lng=pos.coords.longitude;
      var acc=Math.round(pos.coords.accuracy);
      updates['construction/'+fc+'/'+key+'_lat']=lat;
      updates['construction/'+fc+'/'+key+'_lng']=lng;
      updates['construction/'+fc+'/'+key+'_gpsAcc']=acc;
      updates['construction/'+fc+'/_lastLat']=lat;
      updates['construction/'+fc+'/_lastLng']=lng;
      logEntry.lat=lat;logEntry.lng=lng;logEntry.gpsAcc=acc;
      db.ref().update(updates).then(function(){
        showToast('✅ Guardado + GPS','var(--ac)');updLastSave();
      }).catch(function(err){
        showToast('⚠️ Error: '+err.message,'var(--no)');
        setTimeout(function(){db.ref().update(updates)},3000);
      });
      db.ref('con_log').push(logEntry);
    },function(){
      // GPS failed — use cached if available
      if(_cachedGPS){
        updates['construction/'+fc+'/'+key+'_lat']=_cachedGPS.lat;
        updates['construction/'+fc+'/'+key+'_lng']=_cachedGPS.lng;
        updates['construction/'+fc+'/'+key+'_gpsAcc']=_cachedGPS.acc;
        logEntry.lat=_cachedGPS.lat;logEntry.lng=_cachedGPS.lng;logEntry.gpsAcc=_cachedGPS.acc;
      }
      db.ref().update(updates).then(function(){
        showToast('✅ Guardado'+(_cachedGPS?' + GPS':''),'var(--ac)');updLastSave();
      }).catch(function(err){
        showToast('⚠️ Error: '+err.message,'var(--no)');
        setTimeout(function(){db.ref().update(updates)},3000);
      });
      db.ref('con_log').push(logEntry);
    },{enableHighAccuracy:true,timeout:5000,maximumAge:30000});
  }else{
    // No geolocation API — use cached if available
    if(_cachedGPS){
      updates['construction/'+fc+'/'+key+'_lat']=_cachedGPS.lat;
      updates['construction/'+fc+'/'+key+'_lng']=_cachedGPS.lng;
      logEntry.lat=_cachedGPS.lat;logEntry.lng=_cachedGPS.lng;
    }
    db.ref().update(updates).then(function(){
      showToast('✅ Guardado','var(--ac)');updLastSave();
    }).catch(function(err){
      showToast('⚠️ Error: '+err.message,'var(--no)');
      setTimeout(function(){db.ref().update(updates)},3000);
    });
    db.ref('con_log').push(logEntry);
  }
}

// Distancia N-S acumulada nominal desde MP (±30mm tolerancia)
// Key = pilar index offset from MP (1=1N/1S, 2=2N/2S, etc.)
var DIST_NS_TOL=30;
var DIST_NS_NOM={
  largo:{1:7600,2:14800,3:21800,4:28500},
  corto:{1:6700,2:13400}
};

// Nominal inter-pilar distances (tramo) per position and type (from v1 checklist)
// Tolerance: ±30mm on each tramo
var TRAMO_NOM={
  largo:[6710,7010,7210,7610,0,7610,7200,7000,6710],
  corto:[6715,6710,0,6695,6705]
};
var TRAMO_TOL=30;

function getTramoTol(type,piIdx){
  var isLargo=(type==='monofila_largo'||type==='bifila_largo');
  var noms=isLargo?TRAMO_NOM.largo:TRAMO_NOM.corto;
  if(piIdx<0||piIdx>=noms.length||noms[piIdx]===0)return null;
  var nom=noms[piIdx];
  return{nom:nom,min:nom-TRAMO_TOL,max:nom+TRAMO_TOL};
}

// Calculate accumulated distance from MP to pilar pi, using recorded tramo measurements
function calcAccumDist(qd,px,pi,mpI,type){
  var isLargo=(type==='monofila_largo'||type==='bifila_largo');
  var noms=isLargo?DIST_NS_NOM.largo:DIST_NS_NOM.corto;
  if(pi===mpI)return null;
  var accum=0;var complete=true;var filledCount=0;var totalCount=0;
  if(pi<mpI){
    // North side: sum from pi toward MP (pi, pi+1, ..., mpI-1)
    for(var j=mpI-1;j>=pi;j--){
      totalCount++;
      var tv=qd[px+'_'+j+'_dist_ns_tramo'];
      if(tv!=null){accum+=parseFloat(tv);filledCount++}else complete=false;
    }
  }else{
    // South side: sum from mpI+1 to pi
    for(var j=mpI+1;j<=pi;j++){
      totalCount++;
      var tv=qd[px+'_'+j+'_dist_ns_tramo'];
      if(tv!=null){accum+=parseFloat(tv);filledCount++}else complete=false;
    }
  }
  var offset=Math.abs(pi-mpI);
  var nom=noms[offset]||null;
  if(!nom)return null;
  // Check tolerance: if complete, exact check. If partial but sum already exceeds max, flag early.
  var outTol=false;
  if(complete&&accum>0){
    outTol=(accum<nom-DIST_NS_TOL||accum>nom+DIST_NS_TOL);
  }else if(filledCount>0&&accum>0){
    // Partial: if accumulated already exceeds nominal+tol, it's definitely out
    outTol=(accum>nom+DIST_NS_TOL);
  }
  return{accum:accum,nom:nom,offset:offset,complete:complete,outTol:outTol,filledCount:filledCount,totalCount:totalCount};
}

// CONSTRUCTION SELECT (PV → Sub → Tracker)
function rConSelect(a){
  var pvs=[...new Set(Object.values(MASTER_DATA).map(function(d){return d.pv}))].sort(function(a2,b){return a2-b});
  var h='<div class="hdr"><button class="btn-icon" onclick="V.screen=\'modesel\';R()">←</button><div><h1>🏗️ Construcción</h1><div class="sub">Selecciona zona</div></div></div>';
  h+='<div class="cnt" style="padding-top:14px">';
  h+='<div class="stitle">PV</div><select class="sel" id="csp" onchange="V.conPv=parseInt(this.value);V.conSub=0;renderConSubs()"><option value="">Selecciona PV</option>';
  pvs.forEach(function(p){h+='<option value="'+p+'"'+(V.conPv===p?' selected':'')+'>PV'+String(p).padStart(2,'0')+'</option>'});
  h+='</select>';
  h+='<div id="con-subs" style="margin-top:12px"></div>';
  h+='<div id="con-pv-sum"></div>';
  h+='<div id="con-list" style="margin-top:6px"></div>';
  h+='</div>';
  a.innerHTML=h;
  if(V.conPv)renderConSubs();
  // Show PV progress overview
  else{db.ref('construction').once('value',function(snap){
    var conAll=snap.val()||{};var listEl=document.getElementById('con-list');if(!listEl)return;
    var pvs2=[...new Set(Object.values(MASTER_DATA).map(function(d){return d.pv}))].sort(function(a2,b2){return a2-b2});
    var oh='<div class="stitle">Avance por PV</div>';
    pvs2.forEach(function(pv){
      var codes=Object.keys(MASTER_DATA).filter(function(c){return MASTER_DATA[c].pv===pv});
      var tP=0,hP=0,rP=0;
      codes.forEach(function(code){
        var fc=code.replace(/\./g,'_');var con=conAll[fc]||{};
        var cfg=PCFG[MASTER_DATA[code].type];if(!cfg)return;
        for(var f=0;f<(cfg.conducida?2:1);f++){var px=f===0?'fm':'fc';var pils=f===0?cfg.motor:cfg.conducida;
          for(var i=0;i<pils.length;i++){tP++;var est=con[px+'_'+i+'_estado']||'';if(est==='hincada')hP++;else if(est==='rechazo')rP++}}
      });
      var pct=tP>0?Math.round(hP/tP*100):0;
      var color=pct===100?'var(--ok)':rP>0?'var(--no)':hP>0?'var(--info)':'var(--bd)';
      oh+='<button onclick="document.getElementById(\'csp\').value='+pv+';V.conPv='+pv+';V.conSub=0;renderConSubs()" style="display:flex;align-items:center;gap:10px;width:100%;padding:8px 12px;border-radius:8px;background:var(--sf);border:1px solid var(--bd);margin-bottom:4px;cursor:pointer;text-align:left">';
      oh+='<span style="font-weight:700;font-size:13px;color:var(--tx);width:42px">PV'+String(pv).padStart(2,'0')+'</span>';
      oh+='<div style="flex:1;height:6px;border-radius:3px;background:var(--bd);overflow:hidden"><div style="height:100%;border-radius:3px;background:'+color+';width:'+pct+'%"></div></div>';
      oh+='<span style="font-size:11px;font-weight:600;color:'+color+';min-width:32px;text-align:right">'+pct+'%</span>';
      oh+='</button>';
    });
    listEl.innerHTML=oh;
  })}
}

function renderConSubs(){
  DBG('renderConSubs pv='+V.conPv);
  var pv=V.conPv||0;
  var subsEl=document.getElementById('con-subs');
  var listEl=document.getElementById('con-list');
  if(!pv){subsEl.innerHTML='';listEl.innerHTML='';return}
  
  var subs=[...new Set(Object.values(MASTER_DATA).filter(function(d){return d.pv===pv&&d.sub>0}).map(function(d){return d.sub}))].sort(function(a,b){return a-b});
  
  if(subs.length>0&&!V.conSub){
    // Show subcampo cards with progress
    var h='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px">';
    subs.forEach(function(s){
      h+='<button onclick="V.conSub='+s+';renderConList()" style="padding:12px;border-radius:10px;background:var(--sf);border:2px solid var(--bd);cursor:pointer;text-align:center">';
      h+='<div style="font-weight:700;font-size:14px;color:var(--tx)">Sub '+s+'</div>';
      h+='<div id="csub-'+pv+'-'+s+'" style="margin-top:4px;font-size:10px;color:var(--td)">...</div>';
      h+='<div style="margin-top:4px">'+wfBadge(pv,s,'hincado')+'</div>';
      h+='</button>';
    });
    h+='</div>';
    subsEl.innerHTML=h;
    listEl.innerHTML='';
    // Fetch construction data for subcampo progress
    db.ref('construction').once('value',function(snap){
      var conAll=snap.val()||{};
      subs.forEach(function(s){
        var codes=Object.keys(MASTER_DATA).filter(function(c){return MASTER_DATA[c].pv===pv&&MASTER_DATA[c].sub===s});
        var tP=0,hP=0,rP=0;
        codes.forEach(function(code){
          var fc=code.replace(/\./g,'_');var con=conAll[fc]||{};
          var cfg=PCFG[MASTER_DATA[code].type];if(!cfg)return;
          for(var f=0;f<(cfg.conducida?2:1);f++){
            var px=f===0?'fm':'fc';var pils=f===0?cfg.motor:cfg.conducida;
            for(var i=0;i<pils.length;i++){tP++;var est=con[px+'_'+i+'_estado']||'';if(est==='hincada')hP++;else if(est==='rechazo')rP++}
          }
        });
        var pct=tP>0?Math.round(hP/tP*100):0;
        var el=document.getElementById('csub-'+pv+'-'+s);
        if(el){
          var color=pct===100?'var(--ok)':rP>0?'var(--no)':hP>0?'var(--info)':'var(--td)';
          el.innerHTML='<span style="font-weight:600;color:'+color+'">'+hP+'/'+tP+'</span> <span style="color:var(--td)">'+pct+'%</span>'
            +(rP?' <span style="color:var(--no)">'+rP+'⚠</span>':'')
            +'<div style="width:80%;height:4px;border-radius:2px;background:var(--bd);margin:4px auto 0;overflow:hidden"><div style="height:100%;border-radius:2px;background:'+color+';width:'+pct+'%"></div></div>';
        }
      });
    });
  }else{
    subsEl.innerHTML=subs.length>0?'<select class="sel" onchange="V.conSub=parseInt(this.value);renderConList()"><option value="">Subcampo</option>'+subs.map(function(s){return'<option value="'+s+'"'+(V.conSub===s?' selected':'')+'>Sub '+s+'</option>'}).join('')+'</select>':'';
    renderConList();
  }
}

function renderConList(){

  var pv=V.conPv,sub=V.conSub||0;
  var listEl=document.getElementById('con-list');
  if(!listEl||!pv)return;
  
  var codes=Object.keys(MASTER_DATA).filter(function(code){
    var d=MASTER_DATA[code];
    return d.pv===pv&&(!sub||d.sub===sub);
  }).sort();
  
  // Workflow button
  var h='';
  if(sub){
    h+='<button onclick="V.screen=\'condetail\';R()" class="btn btn-ghost" style="margin-bottom:10px;font-size:13px">📋 Workflow · '+wfBadge(pv,sub,'hincado')+'</button>';
  }

    h+='<button class="tr-item" id="ci-'+code.replace(/\./g,'_')+'" onclick="V.conTr=\''+code+'\';V.screen=\'contractor\';V.conPi=0;V.conFila=\'motor\';R()">';
    h+='<div style="display:flex;justify-content:space-between;align-items:center">';

    h+='<span id="cp-'+code.replace(/\./g,'_')+'" style="font-size:10px;color:var(--td)">...</span>';
    h+='</div></button>';

  // Batch fetch construction data for progress
  db.ref('construction').once('value',function(snap){
    var conAll=snap.val()||{};
    var pvTotal=0,pvDone=0,pvRech=0;
    codes.forEach(function(code){
      var fc=code.replace(/\./g,'_');
      var con=conAll[fc]||{};
      var cfg=PCFG[MASTER_DATA[code].type];if(!cfg)return;
      var tP=0,hP=0,rP=0;
      for(var f=0;f<(cfg.conducida?2:1);f++){
        var px=f===0?'fm':'fc';var pils=f===0?cfg.motor:cfg.conducida;
        for(var i=0;i<pils.length;i++){tP++;var est=con[px+'_'+i+'_estado']||'';if(est==='hincada')hP++;else if(est==='rechazo')rP++}
      }
      pvTotal+=tP;pvDone+=hP;pvRech+=rP;
      var pct=tP>0?Math.round(hP/tP*100):0;
      var el=document.getElementById('cp-'+fc);
      if(el){
        var color=pct===100?'var(--ok)':rP>0?'var(--no)':hP>0?'var(--info)':'var(--td)';
        el.innerHTML='<span style="color:'+color+';font-weight:600">'+hP+'/'+tP+'</span>'+(rP?' <span style="color:var(--no)">'+rP+'⚠</span>':'');

        el.innerHTML+='<div style="width:50px;height:4px;border-radius:2px;background:var(--bd);margin-top:3px;display:inline-block;vertical-align:middle;margin-left:6px"><div style="height:100%;border-radius:2px;background:'+color+';width:'+pct+'%"></div></div>';
      }
    });
    // Update PV summary header
    var sumEl=document.getElementById('con-pv-sum');
    if(sumEl&&pvTotal>0){
      var pvPct=Math.round(pvDone/pvTotal*100);
      sumEl.innerHTML='<div style="display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;background:var(--sf);border:1px solid var(--bd);margin-bottom:8px">'
        +'<div style="flex:1"><div style="font-size:12px;font-weight:600">Avance PV'+String(pv).padStart(2,'0')+(sub?' / Sub'+sub:'')+'</div>'
        +'<div style="font-size:10px;color:var(--td)">'+pvDone+' hincados / '+pvTotal+' hincas'+(pvRech?' · '+pvRech+' rechazos':'')+'</div></div>'

    }
  });
}

function renderCalSubs(){
  DBG('renderCalSubs pv='+V.calPv+' sub='+V.calSub);
  var pv=V.calPv||0;
  var subsEl=document.getElementById('cal-subs');
  var listEl=document.getElementById('cal-list');
  if(!pv){subsEl.innerHTML='';listEl.innerHTML='';return}
  
  var subs=[...new Set(Object.values(MASTER_DATA).filter(function(d){return d.pv===pv&&d.sub>0}).map(function(d){return d.sub}))].sort(function(a,b){return a-b});
  
  if(subs.length>0&&!V.calSub){
    var h='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px">';
    subs.forEach(function(s){
      h+='<button onclick="V.calSub='+s+';renderCalList()" style="padding:12px;border-radius:10px;background:var(--sf);border:2px solid var(--bd);cursor:pointer;text-align:center">';
      h+='<div style="font-weight:700;font-size:14px;color:var(--tx)">Sub '+s+'</div>';
      h+='<div id="qsub-'+pv+'-'+s+'" style="margin-top:4px;font-size:10px;color:var(--td)">...</div>';
      h+='<div style="margin-top:4px">'+wfBadge(pv,s,'hincado')+'</div>';
      h+='</button>';
    });
    h+='</div>';
    subsEl.innerHTML=h;
    listEl.innerHTML='';
    // Fetch quality data for subcampo progress
    db.ref('quality').once('value',function(snap){
      var qualAll=snap.val()||{};
      subs.forEach(function(s){
        var codes=Object.keys(MASTER_DATA).filter(function(c){return MASTER_DATA[c].pv===pv&&MASTER_DATA[c].sub===s});
        var started=0;
        codes.forEach(function(code){
          var fc=code.replace(/\./g,'_');var qd=qualAll[fc];
          if(qd&&Object.keys(qd).length>0)started++;
        });
        var pct=codes.length>0?Math.round(started/codes.length*100):0;
        var el=document.getElementById('qsub-'+pv+'-'+s);
        if(el){
          var color=pct===100?'var(--ok)':started>0?'var(--info)':'var(--td)';
          el.innerHTML='<span style="font-weight:600;color:'+color+'">'+started+'/'+codes.length+'</span> <span style="color:var(--td)">'+pct+'%</span>'
            +'<div style="width:80%;height:4px;border-radius:2px;background:var(--bd);margin:4px auto 0;overflow:hidden"><div style="height:100%;border-radius:2px;background:'+color+';width:'+pct+'%"></div></div>';
        }
      });
    });
  }else{
    subsEl.innerHTML=subs.length>0?'<select class="sel" onchange="V.calSub=parseInt(this.value);renderCalList()"><option value="">Subcampo</option>'+subs.map(function(s){return'<option value="'+s+'"'+(V.calSub===s?' selected':'')+'>Sub '+s+'</option>'}).join('')+'</select>':'';
    renderCalList();
  }
}

function renderCalList(){
  DBG('renderCalList pv='+V.calPv+' sub='+V.calSub);
  var pv=V.calPv,sub=V.calSub||0;
  var listEl=document.getElementById('cal-list');
  if(!listEl||!pv)return;
  
  var codes=Object.keys(MASTER_DATA).filter(function(code){
    var d=MASTER_DATA[code];
    return d.pv===pv&&(!sub||d.sub===sub);
  }).sort();
  
  var h='';
  if(sub){
    h+='<button onclick="V.screen=\'caldetail\';V.calPv='+pv+';V.calSub='+sub+';R()" class="btn btn-ghost" style="margin-bottom:10px;font-size:13px">📋 Workflow · '+wfBadge(pv,sub,'hincado')+'</button>';
  }
  
  codes.forEach(function(code){
    var d=MASTER_DATA[code];
    h+='<button class="tr-item" onclick="V.calTr=\''+code+'\';V.screen=\'qualtracker\';R()">';
    h+='<div style="display:flex;justify-content:space-between;align-items:center">';
    h+='<div><span style="font-weight:700;font-size:18px;margin-right:8px">'+d.num+'</span><span style="font-size:11px;color:var(--td)">'+d.type+'</span></div>';
    h+='<span id="qp-'+code.replace(/\./g,'_')+'" style="font-size:10px;color:var(--td)">...</span>';
    h+='</div></button>';
  });
  
  listEl.innerHTML=h;
  
  // Batch fetch quality data for progress
  db.ref('quality').once('value',function(snap){
    var qualAll=snap.val()||{};
    var pvStarted=0,pvTotal=codes.length;
    codes.forEach(function(code){
      var fc=code.replace(/\./g,'_');
      var qd=qualAll[fc]||{};
      var cfg=PCFG[MASTER_DATA[code].type];if(!cfg)return;
      var mpI=getMPi(MASTER_DATA[code].type);
      var filas=cfg.conducida?['motor','conducida']:['motor'];
      var tFields=0,fFields=0,badFields=0;
      filas.forEach(function(fila){
        var pils=cfg[fila];var px=fila==='motor'?'fm':'fc';
        pils.forEach(function(p,i){
          MED.concat(COMP).forEach(function(f){
            if(f.isTramo&&i===mpI)return;
            tFields++;
            var v=qd[px+'_'+i+'_'+f.id];
            if(v!=null){fFields++;
              var ft=f.tol;if(f.isTramo){var tt3=getTramoTol(MASTER_DATA[code].type,i);if(tt3)ft=[tt3.min,tt3.max]}
              if(ft&&typeof v==='number'&&(v<ft[0]||v>ft[1]))badFields++;
              if(f.def!=null&&v!==f.def)badFields++;
            }
          });
        });
      });
      if(fFields>0)pvStarted++;
      var pct=tFields>0?Math.round(fFields/tFields*100):0;
      var el=document.getElementById('qp-'+fc);
      if(el){
        var color=badFields>0?'var(--no)':pct===100?'var(--ok)':fFields>0?'var(--ac)':'var(--td)';
        el.innerHTML='<span style="color:'+color+';font-weight:600">'+fFields+'/'+tFields+'</span>'+(badFields?' <span style="color:var(--no)">'+badFields+'⚠</span>':'');
        el.innerHTML+='<div style="width:50px;height:4px;border-radius:2px;background:var(--bd);margin-top:3px;display:inline-block;vertical-align:middle;margin-left:6px"><div style="height:100%;border-radius:2px;background:'+color+';width:'+pct+'%"></div></div>';
      }
    });
    var sumEl=document.getElementById('cal-pv-sum');
    if(sumEl){
      var qPct=pvTotal>0?Math.round(pvStarted/pvTotal*100):0;
      sumEl.innerHTML='<div style="display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;background:var(--sf);border:1px solid var(--bd);margin-bottom:8px">'
        +'<div style="flex:1"><div style="font-size:12px;font-weight:600">Calidad PV'+String(pv).padStart(2,'0')+(sub?' / Sub'+sub:'')+'</div>'
        +'<div style="font-size:10px;color:var(--td)">'+pvStarted+' inspeccionados / '+pvTotal+' trackers</div></div>'
        +'<span style="font-size:18px;font-weight:700;color:var(--ac)">'+qPct+'%</span></div>';
    }
  });
}

// QUALITY TRACKER (placeholder - will use existing cim/mont/mod logic)
function rQualTracker(a){
  var code=V.calTr;
  if(!code){V.screen='calselect';R();return}
  var m=MASTER_DATA[code];if(!m){V.screen='calselect';R();return}
  var cfg=PCFG[m.type];
  if(!V.qTab)V.qTab='cim';
  if(!V.qFila)V.qFila='motor';
  if(V.qPi==null)V.qPi=0;
  var viewOnly=V.viewOnly;
  
  a.innerHTML='<div class="hdr"><button class="btn-icon" onclick="V.screen=\'calselect\';R()">←</button><div><h1>✅ '+code+'</h1><div class="sub">Cargando...</div></div></div>';
  
  getQualData(code,function(qd){
    var filas=cfg.conducida?['motor','conducida']:['motor'];
    var fila=V.qFila;if(!cfg[fila])fila='motor';
    var pils=cfg[fila];
    var px=fila==='motor'?'fm':'fc';
    var pi=V.qPi||0;if(pi>=pils.length)pi=0;
    var mpI=getMPi(m.type);
    
    // Count progress
    var cimF=0,cimT=0;
    filas.forEach(function(fl){var ppx=fl==='motor'?'fm':'fc';cfg[fl].forEach(function(p,i){
      MED.forEach(function(f){if(f.isTramo&&i===mpI)return;cimT++;if(qd[ppx+'_'+i+'_'+f.id]!=null)cimF++});
      COMP.forEach(function(f){cimT++;if(qd[ppx+'_'+i+'_'+f.id]!=null)cimF++});
    })});
    var montF=0,montT=MONT_ITEMS.length;MONT_ITEMS.forEach(function(f){if(qd['mont_'+f.id]!=null)montF++});
    var modF=0,modT=MOD_ITEMS.length;MOD_ITEMS.forEach(function(f){if(qd['mod_'+f.id]!=null)modF++});
    var totalT=cimT+montT+modT,totalF=cimF+montF+modF;
    var pct=totalT>0?Math.round(totalF/totalT*100):0;
    var cimPct=cimT>0?Math.round(cimF/cimT*100):0;
    var montPct=montT>0?Math.round(montF/montT*100):0;
    var modPct=modT>0?Math.round(modF/modT*100):0;
    
    var h='<div class="hdr"><button class="btn-icon" onclick="V.screen=\'calselect\';R()">←</button><div><h1>✅ '+code+'</h1><div class="sub">PV'+String(m.pv).padStart(2,'0')+(m.sub?' / Sub '+m.sub:'')+' · '+m.type+'</div></div><div class="hdr-r"><div style="min-width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;background:'+(pct>=100?'var(--ac)':'var(--sf2)')+';color:'+(pct>=100?'#000':'var(--ac)')+'">'+pct+'%</div></div></div>';
    h+='<div class="cnt" style="padding-top:6px">';
    if(viewOnly)h+='<div style="padding:8px 12px;border-radius:10px;background:rgba(245,158,11,.1);border:1px solid var(--warn);color:var(--warn);font-size:12px;text-align:center;margin-bottom:8px">👁️ Solo lectura</div>';
    
    // Tab buttons
    h+='<div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap">';
    [{id:'cim',l:'Cimentaciones',p:cimPct},{id:'mont',l:'Montaje',p:montPct},{id:'mod',l:'Módulos',p:modPct}].forEach(function(t){
      var sel=V.qTab===t.id;
      h+='<button onclick="V.qTab=\''+t.id+'\';V.qPi=0;R()" style="flex:1;min-width:90px;padding:10px;border-radius:10px;border:2px solid '+(sel?'var(--ac)':'var(--bd)')+';background:'+(sel?'rgba(62,207,142,.1)':'transparent')+';cursor:pointer"><div style="font-size:12px;font-weight:700;color:'+(sel?'var(--ac)':'var(--td)')+'">'+t.l+'</div><div class="prog" style="margin-top:5px"><div class="prog-f" style="width:'+t.p+'%;background:'+(t.p>=100?'var(--ac)':'var(--info)')+'"></div></div><div style="font-size:10px;color:var(--td);margin-top:3px">'+t.p+'%</div></button>';
    });
    h+='</div>';
    
    // CIM TAB
    if(V.qTab==='cim'){
      if(filas.length>1){
        h+='<div style="display:flex;gap:6px;margin-bottom:8px">';
        filas.forEach(function(f){var s2=f===fila;
          h+='<button onclick="V.qFila=\''+f+'\';V.qPi=0;R()" class="btn" style="flex:1;padding:8px;font-size:12px;border:2px solid '+(s2?'var(--ac)':'var(--bd)')+';background:'+(s2?'rgba(62,207,142,.1)':'var(--sf)')+';color:'+(s2?'var(--ac)':'var(--td)')+'">Fila '+(f==='motor'?'Motor':'Conducida')+'</button>';
        });h+='</div>';
      }
      // Pillar buttons
      h+='<div style="display:flex;gap:4px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch">';
      pils.forEach(function(p,i){
        var fl2=0,tt2=0,bad2=false;
        MED.concat(COMP).forEach(function(f){if(f.isTramo&&i===mpI)return;tt2++;var v=qd[px+'_'+i+'_'+f.id];if(v!=null){fl2++;var ft=f.tol;if(f.isTramo){var tt3=getTramoTol(m.type,i);if(tt3)ft=[tt3.min,tt3.max]}if(ft&&typeof v==='number'&&(v<ft[0]||v>ft[1]))bad2=true;if(f.def!=null&&v!==f.def)bad2=true}});
        var bdC=fl2===0?'var(--bd)':bad2?'var(--no)':(fl2<tt2?'var(--warn)':'var(--ac)');
        var cls2=i===pi?'outline:2px solid var(--ac);outline-offset:2px;':'';
        h+='<button onclick="V.qPi='+i+';R()" style="flex-shrink:0;min-width:52px;padding:6px 8px;border-radius:8px;font-size:11px;font-weight:700;text-align:center;border:2px solid '+bdC+';background:transparent;color:var(--tx);cursor:pointer;'+cls2+'">'+p+'<div style="font-size:9px;opacity:.6;margin-top:2px">'+fl2+'/'+tt2+'</div></button>';
      });h+='</div>';
      
      // MED fields
      var isMPpilar=(pi===mpI);
      h+='<div class="stitle">Mediciones — '+pils[pi]+'</div>';
      MED.forEach(function(f){
        if(f.isTramo&&isMPpilar)return;
        var k=px+'_'+pi+'_'+f.id;var v=qd[k];
        if(f.type==='number'){
          // Dynamic tolerance: use getTramoTol for tramo, else f.tol
          var dynTol=null;var tolLabel='';
          if(f.isTramo){var tt=getTramoTol(m.type,pi);if(tt){dynTol=[tt.min,tt.max];tolLabel='Nominal: '+tt.nom+' mm (±'+TRAMO_TOL+')'}}
          else if(f.tol){dynTol=f.tol;tolLabel='Tolerancia: '+f.tol[0]+'° — '+f.tol[1]+'°'}
          var outTol=dynTol&&v!=null&&(v<dynTol[0]||v>dynTol[1]);
          h+='<div class="card" style="padding:12px;margin-bottom:6px'+(outTol?';border-color:var(--no)':'')+'">';
          h+='<div style="display:flex;justify-content:space-between;align-items:center"><div style="font-size:13px">'+f.label+' <span style="font-size:10px;color:var(--td)">('+f.unit+')</span></div>';
          if(outTol)h+='<span class="badge" style="background:rgba(239,68,68,.15);color:var(--no)">⚠️ Fuera tol.</span>';
          if(dynTol&&v!=null&&!outTol)h+='<span class="badge" style="background:rgba(34,197,94,.15);color:var(--ok)">✅ OK</span>';
          h+='</div>';
          if(viewOnly){
            h+='<div style="margin-top:6px;padding:10px;border-radius:8px;background:var(--bg);font-size:16px;font-weight:600;color:'+(outTol?'var(--no)':'var(--tx)')+'">'+(v!=null?v+' '+f.unit:'—')+'</div>';

function dlBlob(blob,name){
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);

  setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(a.href)},100);

// ── Helper: calculate accumulated distance N-S from tramo measurements ──
function calcAccumForExport(qd,px,piIdx,mpIdx,type){
  var isLargo=(type==='monofila_largo'||type==='bifila_largo');
  if(piIdx===mpIdx)return null;
  var accum=0;
  if(piIdx<mpIdx){
    for(var j=mpIdx-1;j>=piIdx;j--){
      var tv=qd[px+'_'+j+'_dist_ns_tramo'];
      if(tv!=null)accum+=parseFloat(tv);else return null;
    }
  }else{
    for(var j=mpIdx+1;j<=piIdx;j++){
      var tv=qd[px+'_'+j+'_dist_ns_tramo'];
      if(tv!=null)accum+=parseFloat(tv);else return null;
    }
  }
  return accum>0?accum:null;
}

            // Remove data rows >= 16
            var toRem=[];

            toRem.forEach(function(r){sheetData.removeChild(r)});
            console.log('exportAlturas: removed '+toRem.length+' rows, remaining='+sheetData.getElementsByTagNameNS(ns,'row').length);

            // Read shared strings (may not exist)

            return ssPromise.then(function(ssXml){
              var ssDoc=ssXml?parser.parseFromString(ssXml,'application/xml'):null;
              var ssCount=0;var ssMap={};
              if(ssDoc){
                var siEls=ssDoc.getElementsByTagNameNS(ns,'si');

                for(var si=0;si<siEls.length;si++){

              console.log('exportAlturas: shared strings='+ssCount);
              function addSS(str){
                if(ssMap[str]!=null)return ssMap[str];
                if(!ssDoc){ssDoc=parser.parseFromString('<sst xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" count="0" uniqueCount="0"/>','application/xml')}
                var si2=ssDoc.createElementNS(ns,'si');var t2=ssDoc.createElementNS(ns,'t');
                t2.textContent=str;si2.appendChild(t2);ssDoc.documentElement.appendChild(si2);
                var idx=ssCount;ssCount++;ssMap[str]=idx;return idx;
              }
              function mkCell(d2,addr,val,type){
                var c=d2.createElementNS(ns,'c');c.setAttribute('r',addr);
                if(type==='s'){c.setAttribute('t','s');var v=d2.createElementNS(ns,'v');v.textContent=String(addSS(String(val)));c.appendChild(v)}
                else if(type==='n'&&val!=null&&val!==''){var v2=d2.createElementNS(ns,'v');v2.textContent=String(val);c.appendChild(v2)}
                else if(type==='f'){var f=d2.createElementNS(ns,'f');f.textContent=val;c.appendChild(f)}
                return c;
              }

              var codes=Object.keys(MASTER_DATA).filter(function(code){var d=MASTER_DATA[code];return d.pv===pv&&(sub===0||d.sub===sub)}).sort();
              console.log('exportAlturas: trackers='+codes.length);
              var pvSub=pv+'/'+(sub||0);var rowNum=16;var filledCount=0;

              codes.forEach(function(code){
                var d=MASTER_DATA[code];var qd=qualAll[fbCode(code)]||qualAll[code]||{};
                var cfg=PCFG[d.type];if(!cfg)return;
                var isLargo=(d.type==='bifila_largo'||d.type==='monofila_largo');
                var pNamesM=isLargo?PILAR_NAMES_LARGO_M:PILAR_NAMES_CORTO_M;
                var pNamesC=isLargo?PILAR_NAMES_LARGO_C:PILAR_NAMES_CORTO_C;
                // MASTER_CON lookup
                var conArr=(typeof MASTER_CON!=='undefined'&&MASTER_CON[code])?MASTER_CON[code]:[];
                var _posMapM={'4n':'4NW','3n':'3NW','2n':'2NW','1n':'1NW','MP':'MOTORA-W','1s':'1SW','2s':'2SW','3s':'3SW','4s':'4SW'};
                var _posMapC={'4n':'4NE','3n':'3NE','2n':'2NE','1n':'1NE','MP-FC':'CARDAN-E','1s':'1SE','2s':'2SE','3s':'3SE','4s':'4SE'};
                function getSup(pName,isCond){
                  var key=isCond?(_posMapC[pName]||pName):(_posMapM[pName]||pName);
                  return conArr.find(function(s){return s.p===key})||null;
                }
                var qdKeys=Object.keys(qd).length;
                if(codes.indexOf(code)<3)console.log('  tracker '+code+': fbCode='+fbCode(code)+' qdKeys='+qdKeys+' conArr='+conArr.length+(qdKeys>0?' sample='+Object.keys(qd).slice(0,5).join(','):''));
                function addR(pName,fila,altKey,isCond){
                  var alt=qd[altKey];var R=String(rowNum);
                  var sup=getSup(pName,isCond);
                  var nomLen=sup?Math.round(sup.lh*1000):getNomLen(pName);
                  var profNom=sup?Math.round(sup.pm*1000):1800;
                  var rw=doc.createElementNS(ns,'row');rw.setAttribute('r',R);
                  rw.appendChild(mkCell(doc,'C'+R,pvSub,'s'));
                  rw.appendChild(mkCell(doc,'D'+R,d.num,'n'));
                  rw.appendChild(mkCell(doc,'E'+R,pName,'s'));
                  rw.appendChild(mkCell(doc,'F'+R,fila,'s'));
                  if(alt!=null){rw.appendChild(mkCell(doc,'G'+R,parseFloat(alt),'n'));filledCount++}
                  rw.appendChild(mkCell(doc,'J'+R,nomLen,'n'));
                  rw.appendChild(mkCell(doc,'K'+R,'+J'+R+'-G'+R,'f'));
                  rw.appendChild(mkCell(doc,'L'+R,profNom,'n'));
                  rw.appendChild(mkCell(doc,'M'+R,'+K'+R+'/L'+R,'f'));
                  sheetData.appendChild(rw);rowNum++;
                }
                cfg.motor.forEach(function(pL,i){addR(pNamesM[i],'Motora','fm_'+i+'_altura',false)});
                if(cfg.conducida){cfg.conducida.forEach(function(pL,i){addR(pNamesC[i],'Conducida','fc_'+i+'_altura',true)})}
              });

              console.log('exportAlturas: totalRows='+(rowNum-16)+' filledAlturas='+filledCount);

              // Update dimension
              var dims=doc.getElementsByTagNameNS(ns,'dimension');
              if(dims.length>0){dims[0].setAttribute('ref','A1:M'+rowNum)}

              if(ssDoc){
                ssDoc.documentElement.setAttribute('count',String(ssCount));
                ssDoc.documentElement.setAttribute('uniqueCount',String(ssCount));
                zip.file('xl/sharedStrings.xml',ser.serializeToString(ssDoc));
              }
              zip.file(sheetPath,ser.serializeToString(doc));
              return zip.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
            });
          });
        });
      });
    }).then(function(blob){
      if(!blob)return;
      dlBlob(blob,'XXX-PV_'+String(pv).padStart(2,'0')+'-'+(sub||'ALL')+'.xlsx');
      showToast('✅ Alturas exportadas','var(--ac)');
    });
  }).catch(function(err){showToast('❌ Error: '+err.message,'var(--no)');console.error('exportAlturas error:',err)});
}

// ============================================================
// EXPORT 2: CHECKLIST (ATALAYA_CHECKLIST_PV_nn_SUBCAMPO_x.xlsx)
// JSZip — one tab per tracker, copies template per sheet
// ============================================================
function exportChecklist(pv,sub){
  showToast('⏳ Generando checklist...','var(--info)');
  Promise.all([
    fetchTemplate(TPL_CHECKLIST),
    db.ref('quality').once('value')
  ]).then(function(results){
    var buf=results[0];var qualAll=results[1].val()||{};
    var codes=Object.keys(MASTER_DATA).filter(function(code){var d=MASTER_DATA[code];return d.pv===pv&&(sub===0||d.sub===sub)}).sort();
    if(codes.length===0){showToast('⚠️ No hay trackers','var(--warn)');return}

    return JSZip.loadAsync(buf).then(function(tplZip){
      return tplZip.file('xl/workbook.xml').async('string').then(function(wbXml){
        return tplZip.file('xl/_rels/workbook.xml.rels').async('string').then(function(relsXml){
          return tplZip.file('[Content_Types].xml').async('string').then(function(ctXml){
            var parser=new DOMParser();var ser=new XMLSerializer();
            var relNs='http://schemas.openxmlformats.org/package/2006/relationships';
            var ns='http://schemas.openxmlformats.org/spreadsheetml/2006/main';

            // Find first sheet file
            var relsDoc0=parser.parseFromString(relsXml,'application/xml');
            var allRels=relsDoc0.getElementsByTagNameNS(relNs,'Relationship');
            var sheetTargets=[];var nonSheetRelIds=[];
            for(var i=0;i<allRels.length;i++){
              if(allRels[i].getAttribute('Type').indexOf('worksheet')>=0)
                sheetTargets.push(allRels[i].getAttribute('Target'));
              else nonSheetRelIds.push(allRels[i].getAttribute('Id'));
            }
            sheetTargets.sort();
            var tplSheetPath='xl/'+sheetTargets[0];

            return tplZip.file(tplSheetPath).async('string').then(function(tplXml){
              // Read shared strings
              var hasSS=tplZip.file('xl/sharedStrings.xml');
              return (hasSS?hasSS.async('string'):Promise.resolve(null)).then(function(ssXml){
                var ssDoc=ssXml?parser.parseFromString(ssXml,'application/xml'):null;
                var ssCount=0;var ssMap={};
                if(ssDoc){
                  var siEls=ssDoc.getElementsByTagNameNS(ns,'si');
                  ssCount=siEls.length;
                  for(var si=0;si<siEls.length;si++){
                    var t=siEls[si].getElementsByTagNameNS(ns,'t')[0];
                    if(t)ssMap[t.textContent]=si;
                  }
                }
                function addSS(str){
                  if(ssMap[str]!=null)return ssMap[str];
                  if(!ssDoc){ssDoc=parser.parseFromString('<sst xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" count="0" uniqueCount="0"/>','application/xml')}
                  var si=ssDoc.createElementNS(ns,'si');var t=ssDoc.createElementNS(ns,'t');
                  t.textContent=str;si.appendChild(t);ssDoc.documentElement.appendChild(si);
                  var idx=ssCount;ssCount++;ssMap[str]=idx;return idx;
                }

                // Build new zip — copy all non-sheet files
                var outZip=new JSZip();var copyP=[];
                tplZip.forEach(function(path,entry){
                  if(path.match(/^xl\/worksheets\/sheet\d+\.xml$/))return;
                  if(path==='xl/workbook.xml'||path==='xl/_rels/workbook.xml.rels'||path==='[Content_Types].xml'||path==='xl/sharedStrings.xml')return;
                  copyP.push(entry.async('uint8array').then(function(data){outZip.file(path,data)}));
                });

                return Promise.all(copyP).then(function(){
                  var pvZona=pv+'/'+String(sub||0).padStart(2,'0')+'/';

                  function setCellDoc(doc2,rowNum,colNum,value,isNum){
                    var rows2=doc2.getElementsByTagNameNS(ns,'row');
                    var tRow=null;
                    for(var ri=0;ri<rows2.length;ri++){if(parseInt(rows2[ri].getAttribute('r'))===rowNum){tRow=rows2[ri];break}}
                    if(!tRow)return;
                    var cL=colNum<=26?String.fromCharCode(64+colNum):String.fromCharCode(64+Math.floor((colNum-1)/26))+String.fromCharCode(65+(colNum-1)%26);
                    var addr=cL+rowNum;
                    var cells=tRow.getElementsByTagNameNS(ns,'c');
                    var tc=null;
                    for(var ci=0;ci<cells.length;ci++){if(cells[ci].getAttribute('r')===addr){tc=cells[ci];break}}
                    if(!tc){tc=doc2.createElementNS(ns,'c');tc.setAttribute('r',addr);tRow.appendChild(tc)}
                    var ov=tc.getElementsByTagNameNS(ns,'v');while(ov.length>0)tc.removeChild(ov[0]);
                    var oi=tc.getElementsByTagNameNS(ns,'is');while(oi.length>0)tc.removeChild(oi[0]);
                    var of2=tc.getElementsByTagNameNS(ns,'f');while(of2.length>0)tc.removeChild(of2[0]);
                    if(value===''||value==null){tc.removeAttribute('t');return}
                    if(isNum){tc.removeAttribute('t');var v=doc2.createElementNS(ns,'v');v.textContent=String(value);tc.appendChild(v)}
                    else{tc.setAttribute('t','s');var v2=doc2.createElementNS(ns,'v');v2.textContent=String(addSS(String(value)));tc.appendChild(v2)}
                  }
                  // Clear cell value only — preserves style/formatting
                  function clearCellValue(doc2,rowNum,colNum){
                    var rows2=doc2.getElementsByTagNameNS(ns,'row');
                    var tRow=null;
                    for(var ri=0;ri<rows2.length;ri++){if(parseInt(rows2[ri].getAttribute('r'))===rowNum){tRow=rows2[ri];break}}
                    if(!tRow)return;
                    var cL=colNum<=26?String.fromCharCode(64+colNum):String.fromCharCode(64+Math.floor((colNum-1)/26))+String.fromCharCode(65+(colNum-1)%26);
                    var addr=cL+rowNum;
                    var cells=tRow.getElementsByTagNameNS(ns,'c');
                    for(var ci=0;ci<cells.length;ci++){
                      if(cells[ci].getAttribute('r')===addr){
                        var tc=cells[ci];
                        var ov=tc.getElementsByTagNameNS(ns,'v');while(ov.length>0)tc.removeChild(ov[0]);
                        var oi=tc.getElementsByTagNameNS(ns,'is');while(oi.length>0)tc.removeChild(oi[0]);
                        var of2=tc.getElementsByTagNameNS(ns,'f');while(of2.length>0)tc.removeChild(of2[0]);
                        tc.removeAttribute('t');
                        return;
                      }
                    }
                  }

                  var newSheets=[];
                  codes.forEach(function(code,idx){
                    var d=MASTER_DATA[code];var qd=qualAll[fbCode(code)]||qualAll[code]||{};
                    var cfg=PCFG[d.type];if(!cfg)return;
                    var isLargo=(d.type==='bifila_largo'||d.type==='monofila_largo');
                    var hasCond=(cfg.conducida!=null);var mpIdx=isLargo?4:2;

                    var doc=parser.parseFromString(tplXml,'application/xml');
                    setCellDoc(doc,4,3,pvZona,false);
                    setCellDoc(doc,5,3,d.num,true);
                    if(d.mx)setCellDoc(doc,6,4,d.mx,true);
                    if(d.my)setCellDoc(doc,6,8,d.my,true);

                    var faces=[{px:'fm',pils:cfg.motor,mR:31,cR:39,dR:37}];
                    if(hasCond)faces.push({px:'fc',pils:cfg.conducida,mR:57,cR:65,dR:63});

                    faces.forEach(function(face){
                      face.pils.forEach(function(pL,i){
                        var col=pilarCol(d.type,i);
                        var al=qd[face.px+'_'+i+'_altura'];
                        if(al!=null)setCellDoc(doc,face.mR,col,parseFloat(al),true);
                        var vns=qd[face.px+'_'+i+'_vert_ns'];
                        if(vns!=null)setCellDoc(doc,face.mR+1,col,parseFloat(vns),true);
                        var veo=qd[face.px+'_'+i+'_vert_eo'];
                        if(veo!=null)setCellDoc(doc,face.mR+2,col,parseFloat(veo),true);
                        var tor=qd[face.px+'_'+i+'_torsion'];
                        if(tor!=null)setCellDoc(doc,face.mR+3,col,tor,false);
                        var deo=qd[face.px+'_'+i+'_desv_eo'];
                        if(deo!=null)setCellDoc(doc,face.mR+4,col,deo,false);
                        var dal=qd[face.px+'_'+i+'_desv_altura'];
                        if(dal!=null)setCellDoc(doc,face.mR+5,col,dal,false);
                        if(i!==mpIdx){
                          var ac=calcAccumForExport(qd,face.px,i,mpIdx,d.type);
                          if(ac!=null)setCellDoc(doc,face.dR,col,ac,true);
                        }
                        COMP_IDS.forEach(function(cid,ci){
                          var cv=qd[face.px+'_'+i+'_'+cid];
                          if(cv!=null)setCellDoc(doc,face.cR+ci,col,cv,false);
                        });
                      });
                    });
                    // Clear template data from conducida section if monofila
                    if(!hasCond){for(var r=57;r<=80;r++)for(var cc=6;cc<=16;cc++)clearCellValue(doc,r,cc)}
                    // Clear template data from unused pilar columns if corto
                    if(!isLargo){[6,7,8,14,15,16].forEach(function(cc){for(var r=31;r<=54;r++)clearCellValue(doc,r,cc);for(var r2=57;r2<=80;r2++)clearCellValue(doc,r2,cc)})}

                    var sf='sheet'+(idx+1)+'.xml';
                    outZip.file('xl/worksheets/'+sf,ser.serializeToString(doc));
                    newSheets.push({name:String(d.num),file:'worksheets/'+sf,idx:idx+1});
                  });

                  // Workbook.xml
                  var wbDoc=parser.parseFromString(wbXml,'application/xml');
                  var wbNs2='http://schemas.openxmlformats.org/spreadsheetml/2006/main';
                  var sheetsEl=wbDoc.getElementsByTagNameNS(wbNs2,'sheets')[0];
                  var oldS=sheetsEl.getElementsByTagNameNS(wbNs2,'sheet');
                  while(oldS.length>0)sheetsEl.removeChild(oldS[0]);
                  newSheets.forEach(function(s){
                    var el=wbDoc.createElementNS(wbNs2,'sheet');
                    el.setAttribute('name',s.name);el.setAttribute('sheetId',String(s.idx));
                    el.setAttribute('r:id','rIdS'+s.idx);sheetsEl.appendChild(el);
                  });
                  outZip.file('xl/workbook.xml',ser.serializeToString(wbDoc));

                  // Rels
                  var newRD=parser.parseFromString(relsXml,'application/xml');
                  var relEls=newRD.getElementsByTagNameNS(relNs,'Relationship');
                  var rem=[];for(var ri=0;ri<relEls.length;ri++){if(relEls[ri].getAttribute('Type').indexOf('worksheet')>=0)rem.push(relEls[ri])}
                  rem.forEach(function(r){r.parentNode.removeChild(r)});
                  var rRoot=newRD.documentElement;
                  newSheets.forEach(function(s){
                    var rel=newRD.createElementNS(relNs,'Relationship');
                    rel.setAttribute('Id','rIdS'+s.idx);
                    rel.setAttribute('Type','http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet');
                    rel.setAttribute('Target',s.file);rRoot.appendChild(rel);
                  });
                  outZip.file('xl/_rels/workbook.xml.rels',ser.serializeToString(newRD));

                  // Content_Types
                  var ctDoc=parser.parseFromString(ctXml,'application/xml');
                  var ctNs='http://schemas.openxmlformats.org/package/2006/content-types';
                  var ovs=ctDoc.getElementsByTagNameNS(ctNs,'Override');
                  var remO=[];for(var oi=0;oi<ovs.length;oi++){if(ovs[oi].getAttribute('PartName').indexOf('/worksheets/')>=0)remO.push(ovs[oi])}
                  remO.forEach(function(o){o.parentNode.removeChild(o)});
                  newSheets.forEach(function(s){
                    var ov=ctDoc.createElementNS(ctNs,'Override');
                    ov.setAttribute('PartName','/xl/'+s.file);
                    ov.setAttribute('ContentType','application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml');
                    ctDoc.documentElement.appendChild(ov);
                  });
                  outZip.file('[Content_Types].xml',ser.serializeToString(ctDoc));

                  if(ssDoc){ssDoc.documentElement.setAttribute('count',String(ssCount));ssDoc.documentElement.setAttribute('uniqueCount',String(ssCount));outZip.file('xl/sharedStrings.xml',ser.serializeToString(ssDoc))}
                  return outZip.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
                });
              });
            });
          });
        });
      });
    }).then(function(blob){
      if(!blob)return;
      dlBlob(blob,'ATALAYA_CHECKLIST_PV_'+String(pv).padStart(2,'0')+'_SUBCAMPO_'+(sub||'ALL')+'.xlsx');
      showToast('✅ Checklist exportado','var(--ac)');
    });
  }).catch(function(err){showToast('❌ Error: '+err.message,'var(--no)');console.error(err)});
}

function loadDemoToFirebase(){
  showToast('Generando datos demo...','var(--info)');
  var techs=['Ante Budimir','Aimar Oroz','Kike Barja','Boyomo','Aitor Fern\u00e1ndez'];
  var conData={};var qualData={};var logData={};var wfData={};
  var codes=Object.keys(MASTER_DATA);
  var now=Date.now();var DAY=86400000;
  var projStart=new Date('2025-06-02').getTime();

  codes.forEach(function(code,ci){
    var md=MASTER_DATA[code];var cfg=PCFG[md.type];if(!cfg)return;
    var fc=fbCode(code);
    var pv=md.pv;var progress=Math.max(0.25,1.05-(pv/18));
    var rand=Math.random();
    var tech=techs[ci%5];
    var dayOffset=Math.floor(Math.random()*200);
    var ts=projStart+dayOffset*DAY+Math.floor(Math.random()*8*3600000);

    // Construction data
    var con={_lastBy:tech,_lastTS:ts};
    var totalP=0,hincP=0,rechP=0;
    for(var f=0;f<(cfg.conducida?2:1);f++){
      var px=f===0?'fm':'fc';var pils=f===0?cfg.motor:cfg.conducida;
      for(var i=0;i<pils.length;i++){
        totalP++;
        if(rand<progress*0.9){
          if(Math.random()<0.04){
            con[px+'_'+i+'_estado']='rechazo';rechP++;
            con[px+'_'+i+'_motivo']=['Roca a 1.2m','Terreno compacto','Desviaci\u00f3n XY','Cota insuficiente','Nivel fre\u00e1tico'][Math.floor(Math.random()*5)];
          }else{
            con[px+'_'+i+'_estado']='hincada';hincP++;
          }
          con[px+'_'+i+'_tipo']=['directa','directa','directa','predrill','zapata'][Math.floor(Math.random()*5)];
          con[px+'_'+i+'_equipo']='Equipo '+String(Math.floor(Math.random()*3)+1);
          con[px+'_'+i+'_estado_ts']=ts+i*120000;
          con[px+'_'+i+'_estado_by']=tech;
          // Add log entry
          logData[fc+'_'+px+'_'+i]={tracker:code,field:px+'_'+i+'_estado',value:con[px+'_'+i+'_estado'],by:tech,ts:ts+i*120000,uid:'demo'};
        }
      }
    }
    conData[fc]=con;

    // Quality data (only for trackers that are mostly hincados)
    if(hincP>totalP*0.7&&Math.random()<0.7){
      var qd={};
      for(var f2=0;f2<(cfg.conducida?2:1);f2++){
        var px2=f2===0?'fm':'fc';var pils2=f2===0?cfg.motor:cfg.conducida;
        var mpI2=getMPi(md.type);
        for(var i2=0;i2<pils2.length;i2++){
          // Altura
          qd[px2+'_'+i2+'_altura']=Math.floor(1200+Math.random()*120);
          // Verticalidad
          qd[px2+'_'+i2+'_vert_ns']=Math.round((88.5+Math.random()*3.5)*100)/100;
          qd[px2+'_'+i2+'_vert_eo']=Math.round((88.5+Math.random()*3)*100)/100;
          // SI/NO fields
          qd[px2+'_'+i2+'_torsion']=Math.random()<0.95?'NO':'SI';
          qd[px2+'_'+i2+'_desv_eo']=Math.random()<0.95?'NO':'SI';
          qd[px2+'_'+i2+'_desv_altura']=Math.random()<0.95?'NO':'SI';
          // Distancia N-S tramo (not for MP)
          if(i2!==mpI2){
            var isLargo2=(md.type==='monofila_largo'||md.type==='bifila_largo');
            var nomTramo=isLargo2?[6710,7010,7210,7610,0,7610,7200,7000,6710]:[6715,6710,0,6695,6705];
            if(nomTramo[i2])qd[px2+'_'+i2+'_dist_ns_tramo']=nomTramo[i2]+Math.floor(Math.random()*40-20);
          }
          // Comprobaciones
          qd[px2+'_'+i2+'_galvanizado']='SI';
          qd[px2+'_'+i2+'_golpes']=Math.random()<0.97?'NO':'SI';
          qd[px2+'_'+i2+'_entalladura']='NO';
          qd[px2+'_'+i2+'_pliegue']='NO';
          qd[px2+'_'+i2+'_cabezas']='NO';
          qd[px2+'_'+i2+'_corte']='NO';
          qd[px2+'_'+i2+'_mecanizados']='NO';
          qd[px2+'_'+i2+'_orientacion']='SI';
          qd[px2+'_'+i2+'_perfil']='SI';
          qd[px2+'_'+i2+'_relleno']='NO';
          qd[px2+'_'+i2+'_oxidacion']=Math.random()<0.97?'NO':'SI';
          qd[px2+'_'+i2+'_socavones']='NO';
          qd[px2+'_'+i2+'_cimentacion']='SI';
          qd[px2+'_'+i2+'_zanjas']='NO';
          qd[px2+'_'+i2+'_centrado']='NA';
          qd[px2+'_'+i2+'_diametro']='NA';
        }
      }
      qualData[fc]=qd;
    }

    // Workflow
    var allDone=hincP===totalP&&totalP>0;
    var sub=md.sub||0;
    var wfKey=pv+'_'+sub+'_hincado';
    if(!wfData[wfKey]){
      var wfSt=allDone?'OK':(hincP>0?'CON':'CON');
      wfData[wfKey]={state:wfSt,since:ts,by:tech,trigger:'demo'};
    }
  });

  // Write to Firebase in batches
  var updates={};
  Object.keys(conData).forEach(function(k){updates['construction/'+k]=conData[k]});
  Object.keys(qualData).forEach(function(k){updates['quality/'+k]=qualData[k]});
  Object.keys(wfData).forEach(function(k){updates['workflow/'+k]=wfData[k]});

  // Write planning (daily)
  var synPlan={};
  var hP=[75,125,175,225,275,300,300,300,275,250,225,200,150,100,50,25];
  var mP=[0,0,0,5,10,16,20,26,31,31,31,31,26,26,20,20,16,16,10,8,5,3];
  var dP=[0,0,0,0,0,0,0,10,15,20,26,31,36,36,36,36,31,31,26,26,20,16,10,8,5,3];
  var synStart=new Date(PLAN.startDate);var synD=new Date(synStart);var synWk=0;var synDow=0;
  while(synD<=new Date(PLAN.endDate)){
    var dow=synD.getDay();
    if(dow>=1&&dow<=5){
      var iso=synD.getFullYear()+'-'+String(synD.getMonth()+1).padStart(2,'0')+'-'+String(synD.getDate()).padStart(2,'0');
      synPlan[iso]={h:hP[synWk]||0,m:mP[synWk]||0,d:dP[synWk]||0};
      synDow++;
      if(synDow%5===0)synWk++;
    }
    synD.setDate(synD.getDate()+1);
  }
  updates['planning/days']=synPlan;
  // Remove old weekly data
  updates['planning/weeks']=null;

  DBG('Writing demo: '+Object.keys(conData).length+' con, '+Object.keys(qualData).length+' qual, '+Object.keys(logData).length+' logs');

  db.ref().update(updates).then(function(){
    // Write logs separately (push)
    var logRef=db.ref('con_log');
    var logKeys=Object.keys(logData);
    var batch=0;
    function writeBatch(){
      var chunk=logKeys.slice(batch,batch+50);
      if(chunk.length===0){
        showToast('\u2705 Demo cargada — '+Object.keys(conData).length+' trackers','var(--ac)');
        CACHE._dpPlanData=synPlan;
        CACHE._dpPlanLoading=false;
        return;
      }
      var logUpdates={};
      chunk.forEach(function(k){logUpdates[k]=logData[k]});
      logRef.update(logUpdates).then(function(){batch+=50;writeBatch()});
    }
    writeBatch();
  }).catch(function(err){
    showToast('\u274c Error: '+err.message,'var(--no)');
    DBG('Demo write error: '+err.message);
  });
}

// ============================================================
// MAP - LEAFLET
// ============================================================
// UTM Zone 30N to WGS84
function utmToLL(x,y){
  var k0=0.9996,a=6378137,e=0.00669438,e1sq=e/(1-e);
  var M0=y/k0;
  var mu=M0/(a*(1-e/4-3*e*e/64-5*e*e*e/256));
  var e1=(1-Math.sqrt(1-e))/(1+Math.sqrt(1-e));
  var J1=3*e1/2-27*Math.pow(e1,3)/32;
  var J2=21*e1*e1/16-55*Math.pow(e1,4)/32;
  var J3=151*Math.pow(e1,3)/96;
  var fp=mu+J1*Math.sin(2*mu)+J2*Math.sin(4*mu)+J3*Math.sin(6*mu);
  var C1=e1sq*Math.pow(Math.cos(fp),2);
  var T1=Math.pow(Math.tan(fp),2);
  var R1=a*(1-e)/Math.pow(1-e*Math.pow(Math.sin(fp),2),1.5);
  var N1=a/Math.sqrt(1-e*Math.pow(Math.sin(fp),2));
  var D=(x-500000)/(N1*k0);
  var lat=fp-N1*Math.tan(fp)/R1*(D*D/2-(5+3*T1+10*C1-4*C1*C1-9*e1sq)*Math.pow(D,4)/24);
  var lon=D*(1-(1+2*T1+C1)*D*D/6+(5-2*C1+28*T1-3*C1*C1+8*e1sq+24*T1*T1)*Math.pow(D,4)/120)/Math.cos(fp);
  return {lat:lat*180/Math.PI, lng:lon*180/Math.PI+(-3)}; // Zone 30 central meridian = -3
}

function initMap(){

    maxZoom:20,attribution:'Esri'

    maxZoom:20

function loadMap(){
  if(!MAP)return;
  MAP_MARKERS.forEach(function(m){MAP.removeLayer(m)});
  MAP_MARKERS=[];
  var pv=V.mapPv||0,sub=V.mapSub||0,bounds=[];

  db.ref('construction').once('value',function(snap){
    var conData=snap.val()||{};

    // LEVEL 1: No PV → show PV centers
    if(!pv){
      var pvs=[...new Set(Object.values(MASTER_DATA).map(function(d){return d.pv}))].sort(function(a,b){return a-b});
      pvs.forEach(function(p){
        var trs=Object.entries(MASTER_DATA).filter(function(e){return e[1].pv===p&&e[1].mx&&e[1].my});
        if(!trs.length)return;
        var ax=trs.reduce(function(a,e){return a+e[1].mx},0)/trs.length;
        var ay=trs.reduce(function(a,e){return a+e[1].my},0)/trs.length;
        var ll=utmToLL(ax,ay);bounds.push([ll.lat,ll.lng]);
        var tp2=0,hk2=0,rj2=0;
        trs.forEach(function(e){var cd=e[0],d=e[1],cn=conData[cd.replace(/\./g,'_')]||{},cfg=PCFG[d.type];if(!cfg)return;
          for(var f=0;f<(cfg.conducida?2:1);f++){var px=f===0?'fm':'fc';var pls=f===0?cfg.motor:cfg.conducida;
            for(var i=0;i<pls.length;i++){tp2++;var est=cn[px+'_'+i+'_estado']||'';if(est==='hincada')hk2++;else if(est==='rechazo')rj2++}}});
        var pc=tp2>0?Math.round(hk2/tp2*100):0;
        var co=hk2===0?'#555':rj2>0?'#ef4444':pc>=100?'#22c55e':'#3b82f6';
        var mk=L.circleMarker([ll.lat,ll.lng],{radius:20,fillColor:co,color:'#fff',weight:2,opacity:1,fillOpacity:0.85}).addTo(MAP);
        mk.bindTooltip('PV'+String(p).padStart(2,'0'),{permanent:true,direction:'center',className:'pv-label'});
        mk.bindPopup('<div style="font-family:sans-serif;font-size:12px"><b>PV'+String(p).padStart(2,'0')+'</b><br>'+trs.length+' trackers<br>Hincado: '+pc+'%<br><button onclick="V.mapPv='+p+';loadMap()" style="margin-top:6px;padding:6px 12px;border-radius:6px;background:#3ecf8e;color:#000;font-weight:700;font-size:11px;border:none;cursor:pointer;width:100%">Entrar</button></div>');
        MAP_MARKERS.push(mk);
      });
      if(bounds.length)MAP.fitBounds(bounds,{padding:[30,30]});
      return;
    }

    // LEVEL 2: PV selected, has subs → show subcampo centers
    var hasSubs=[...new Set(Object.values(MASTER_DATA).filter(function(d){return d.pv===pv&&d.sub>0}).map(function(d){return d.sub}))].sort(function(a,b){return a-b});
    if(hasSubs.length>0&&!sub){
      hasSubs.forEach(function(s){
        var trs=Object.entries(MASTER_DATA).filter(function(e){return e[1].pv===pv&&e[1].sub===s&&e[1].mx&&e[1].my});
        if(!trs.length)return;
        var ax=trs.reduce(function(a,e){return a+e[1].mx},0)/trs.length;
        var ay=trs.reduce(function(a,e){return a+e[1].my},0)/trs.length;
        var ll=utmToLL(ax,ay);bounds.push([ll.lat,ll.lng]);
        var tp2=0,hk2=0;
        trs.forEach(function(e){var cn=conData[e[0].replace(/\./g,'_')]||{},cfg=PCFG[e[1].type];if(!cfg)return;
          for(var f=0;f<(cfg.conducida?2:1);f++){var px=f===0?'fm':'fc';var pls=f===0?cfg.motor:cfg.conducida;
            for(var i=0;i<pls.length;i++){tp2++;if(cn[px+'_'+i+'_estado']==='hincada')hk2++}}});
        var pc=tp2>0?Math.round(hk2/tp2*100):0;
        var co=hk2===0?'#555':pc>=100?'#22c55e':'#3b82f6';
        var mk=L.circleMarker([ll.lat,ll.lng],{radius:15,fillColor:co,color:'#fff',weight:2,opacity:1,fillOpacity:0.85}).addTo(MAP);
        mk.bindTooltip('S'+s,{permanent:true,direction:'center',className:'pv-label'});
        mk.bindPopup('<div style="font-family:sans-serif;font-size:12px"><b>Sub '+s+'</b><br>'+trs.length+' trackers · '+pc+'%<br><button onclick="V.mapSub='+s+';loadMap()" style="margin-top:6px;padding:6px 12px;border-radius:6px;background:#3ecf8e;color:#000;font-weight:700;font-size:11px;border:none;cursor:pointer;width:100%">Ver trackers</button></div>');
        MAP_MARKERS.push(mk);
      });
      if(bounds.length)MAP.fitBounds(bounds,{padding:[30,30]});
      return;
    }

    // LEVEL 3: Individual trackers
    Object.entries(MASTER_DATA).forEach(function(e){
      var code=e[0],d=e[1];
      if(d.pv!==pv)return;if(sub&&d.sub!==sub)return;if(!d.mx||!d.my)return;
      var ll=utmToLL(d.mx,d.my);bounds.push([ll.lat,ll.lng]);
      var cn=conData[code.replace(/\./g,'_')]||{},cfg=PCFG[d.type];
      var tp2=cfg.motor.length+(cfg.conducida?cfg.conducida.length:0),hk2=0,rj2=0;
      for(var f=0;f<(cfg.conducida?2:1);f++){var px=f===0?'fm':'fc';var pls=f===0?cfg.motor:cfg.conducida;
        for(var i=0;i<pls.length;i++){var est=cn[px+'_'+i+'_estado']||'';if(est==='hincada')hk2++;else if(est==='rechazo')rj2++}}
      var co=hk2===0&&rj2===0?'#555':rj2>0?'#ef4444':hk2>=tp2?'#22c55e':'#3b82f6';
      var pc=tp2>0?Math.round(hk2/tp2*100):0;
      var mk=L.circleMarker([ll.lat,ll.lng],{radius:6,fillColor:co,color:co,weight:1,opacity:0.8,fillOpacity:0.7}).addTo(MAP);
      mk.bindPopup('<div style="font-family:sans-serif;font-size:12px"><b>'+code+'</b><br>'+d.type+'<br>'+(hk2>0||rj2>0?'Hincado: '+hk2+'/'+tp2+' ('+pc+'%)'+(rj2>0?' · '+rj2+' rechazos':''):'Sin datos')+'<br><button onclick="V.screen=\'contractor\';V.conTr=\''+code+'\';V.conPi=0;V.conFila=\'motor\';R()" style="margin-top:6px;padding:6px 12px;border-radius:6px;background:#3ecf8e;color:#000;font-weight:700;font-size:11px;border:none;cursor:pointer;width:100%">Abrir</button></div>');
      MAP_MARKERS.push(mk);
    });
    if(bounds.length)MAP.fitBounds(bounds,{padding:[20,20],maxZoom:17});
  },function(err){DBG('Map error: '+err.message)});
}

function createNewRevision(code,phase,result){
  db.ref('quality/'+code.replace(/\./g,'_')).once('value',function(s){
    var qualData=s.val()||{};
    db.ref('revisions/'+code.replace(/\./g,'_')+'/current').once('value',function(s2){
      var rev=s2.val()||1;
      db.ref('revisions/'+code.replace(/\./g,'_')+'/history/'+rev).set({
        data:qualData,phase:phase,result:result,
        by:U.name,uid:U.uid,ts:firebase.database.ServerValue.TIMESTAMP
      });
      db.ref('revisions/'+code.replace(/\./g,'_')+'/current').set(rev+1);
      showToast('Rev '+rev+' archivada, nueva rev '+(rev+1),'var(--info)');
    });
  });
}
