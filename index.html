<style>
:root{--bg:#0f1117;--sf:#1c1f2a;--sf2:#232636;--bd:#2a2d3a;--tx:#e8eaed;--td:#8b8fa3;--tx3:#565a6e;--ac:#3ecf8e;--ok:#22c55e;--no:#ef4444;--warn:#f59e0b;--info:#3b82f6;--purple:#a78bfa}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;overflow-x:hidden}
input,select,textarea,button{font-family:inherit;outline:none}
.hide{display:none!important}

/* Layout */
.hdr{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--bg);z-index:10}
.hdr h1{font-size:17px;letter-spacing:-.3px}
.hdr .sub{font-size:11px;color:var(--td)}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:6px}
.cnt{padding:0 16px 100px}
.btn-icon{width:38px;height:38px;border-radius:10px;border:1px solid var(--bd);background:var(--sf);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--td);font-size:16px}

/* Forms */
.inp{width:100%;height:46px;border-radius:10px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);padding:0 14px;font-size:14px}
.inp:focus{border-color:var(--ac)}
.sel{width:100%;height:46px;border-radius:10px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);padding:0 14px;font-size:14px;appearance:none}
.ta{width:100%;border-radius:10px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);padding:10px 14px;font-size:13px;resize:vertical}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:10px}
.stitle{font-size:11px;font-weight:700;color:var(--td);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 6px}

/* Progress */
.prog{width:100%;height:6px;border-radius:3px;background:var(--bd);overflow:hidden}
.prog-f{height:100%;border-radius:3px;transition:width .8s ease}
.done{background:var(--ok)!important}

/* Buttons */
.btn{width:100%;padding:14px;border-radius:12px;font-size:15px;font-weight:700;border:none;cursor:pointer;transition:all .2s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--ac);color:#000}
.btn-danger{background:var(--no);color:#fff}
.btn-info{background:var(--info);color:#fff}
.btn-warn{background:var(--warn);color:#000}
.btn-ghost{background:transparent;border:1px solid var(--bd);color:var(--td)}

/* Mode cards */
.mode-card{width:100%;max-width:340px;padding:28px 20px;border-radius:16px;color:#fff;font-size:18px;font-weight:700;cursor:pointer;text-align:left;border:2px solid;transition:transform .2s}
.mode-card:active{transform:scale(.97)}

/* Tracker list */
.tr-item{display:block;width:100%;text-align:left;padding:12px;border-radius:10px;background:var(--sf);border:1px solid var(--bd);margin-bottom:6px;cursor:pointer;transition:border-color .2s}
.tr-item:active{border-color:var(--ac)}

/* Status badges */
.badge{font-size:10px;padding:3px 8px;border-radius:10px;font-weight:600;display:inline-flex;align-items:center;gap:3px}

/* Punchlist */
.pl-item{padding:12px;border-radius:10px;background:var(--sf);border:1px solid var(--bd);margin-bottom:6px}

/* Online indicator */
.online-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}
.online-dot.on{background:var(--ok);animation:pulse 2s infinite}
.online-dot.off{background:var(--no)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* Login */
.login-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.login-card{width:100%;max-width:360px;padding:32px 24px;border-radius:20px;background:var(--sf);border:1px solid var(--bd)}
.login-logo{font-size:11px;letter-spacing:3px;color:var(--tx3);text-transform:uppercase;text-align:center;margin-bottom:8px}
.login-title{font-size:24px;font-weight:700;text-align:center;margin-bottom:4px}
.login-sub{font-size:12px;color:var(--td);text-align:center;margin-bottom:24px}
.login-err{font-size:12px;color:var(--no);text-align:center;margin-top:8px;min-height:18px}

/* Toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:999;transition:opacity .3s;pointer-events:none}
</style>

// ============================================================
// WORKFLOW
// ============================================================
var WF_STATES={
  CON:{l:'En construcción',c:'var(--info)',i:'🏗️',bg:'rgba(59,130,246,.15)'},
  REV:{l:'Pdte revisión',c:'var(--warn)',i:'📋',bg:'rgba(245,158,11,.15)'},
  CAL:{l:'En revisión',c:'var(--purple)',i:'🔍',bg:'rgba(167,139,250,.15)'},
  OK:{l:'Completado',c:'var(--ac)',i:'✅',bg:'rgba(34,197,94,.15)'},
  PUN:{l:'Punchlist',c:'var(--no)',i:'📝',bg:'rgba(239,68,68,.15)'},
  REP:{l:'En reparación',c:'var(--warn)',i:'🔧',bg:'rgba(245,158,11,.15)'},
  RREV:{l:'Pdte re-revisión',c:'var(--warn)',i:'📋',bg:'rgba(245,158,11,.15)'}
};
var WF_PHASES=['hincado','montaje','modulos'];
var WF_LABELS={hincado:'Hincado',montaje:'Montaje Estructura',modulos:'Montaje Módulos'};

function getWFState(pv,sub,phase){
  var wf=CACHE.workflow||{};
  var key=pv+'_'+sub+'_'+phase;
  return wf[key]||{state:'CON',since:0,by:'',trigger:'init'};
}

function setWFState(pv,sub,phase,state,trigger){
  var key=pv+'_'+sub+'_'+phase;
  var data={state:state,since:firebase.database.ServerValue.TIMESTAMP,by:U.name,trigger:trigger||'manual',uid:U.uid};
  db.ref('workflow/'+key).set(data);
  // Log
  db.ref('workflow_log').push({key:key,state:state,by:U.name,uid:U.uid,trigger:trigger,ts:firebase.database.ServerValue.TIMESTAMP});
  toast('Estado: '+WF_STATES[state].i+' '+WF_STATES[state].l,'var(--sf)');
}

function wfBadge(pv,sub,phase){
  var wf=getWFState(pv,sub,phase);
  var st=WF_STATES[wf.state]||WF_STATES.CON;
  return '<span class="badge" style="background:'+st.bg+';color:'+st.c+'">'+st.i+' '+st.l+'</span>';
}

// ============================================================
// PUNCHLIST
// ============================================================
function getPLItems(pv,sub,phase){
  var pl=CACHE.punchlist||{};
  var items=[];
  Object.keys(pl).forEach(function(id){
    var p=pl[id];
    if(String(p.pv)===String(pv)&&String(p.sub)===String(sub)&&p.phase===phase){
      items.push({id:id,d:p});
    }
  });
  return items;
}

function addPLItem(pv,sub,phase,tracker,pilar,campo,desc){
  db.ref('punchlist').push({
    pv:pv,sub:sub,phase:phase,tracker:tracker,pilar:pilar,campo:campo,desc:desc,
    estado:'pendiente',
    detectadoPor:U.name,uid:U.uid,fechaDeteccion:firebase.database.ServerValue.TIMESTAMP
  });
  toast('Añadido al punchlist','var(--no)');
}

function setPLEstado(id,estado){
  var updates={estado:estado};
  if(estado==='reparado'){updates.reparadoPor=U.name;updates.reparadoUid=U.uid;updates.fechaReparacion=firebase.database.ServerValue.TIMESTAMP}
  if(estado==='verificado'){updates.verificadoPor=U.name;updates.verificadoUid=U.uid;updates.fechaVerificacion=firebase.database.ServerValue.TIMESTAMP}
  db.ref('punchlist/'+id).update(updates);
  toast(estado==='reparado'?'Marcado como reparado':'Verificado','var(--ac)');
}

// ============================================================
// CONSTRUCTION DATA (Firebase)
// ============================================================
function setConField(code,key,val){
  if(V.viewOnly){showToast('Solo lectura','var(--warn)');return}
  var fc=code.replace(/\./g,'_');
  var updates={};
  updates['construction/'+fc+'/'+key]=val;
  updates['construction/'+fc+'/'+key+'_ts']=firebase.database.ServerValue.TIMESTAMP;
  updates['construction/'+fc+'/'+key+'_by']=U.name;
  // Update tracker-level metadata
  updates['construction/'+fc+'/_lastBy']=U.name;
  updates['construction/'+fc+'/_lastTS']=firebase.database.ServerValue.TIMESTAMP;

  var logEntry={tracker:code,field:key,value:String(val),by:U.name,uid:U.uid,ts:firebase.database.ServerValue.TIMESTAMP};

  // Capture GPS coordinates if available
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(function(pos){
      var lat=pos.coords.latitude;
      var lng=pos.coords.longitude;
      var acc=Math.round(pos.coords.accuracy);
      updates['construction/'+fc+'/'+key+'_lat']=lat;
      updates['construction/'+fc+'/'+key+'_lng']=lng;
      updates['construction/'+fc+'/'+key+'_gpsAcc']=acc;
      updates['construction/'+fc+'/_lastLat']=lat;
      updates['construction/'+fc+'/_lastLng']=lng;
      logEntry.lat=lat;logEntry.lng=lng;logEntry.gpsAcc=acc;
      db.ref().update(updates).then(function(){
        showToast('✅ Guardado + GPS','var(--ac)');updLastSave();
      }).catch(function(err){
        showToast('⚠️ Error: '+err.message,'var(--no)');
        setTimeout(function(){db.ref().update(updates)},3000);
      });
      db.ref('con_log').push(logEntry);
    },function(){
      // GPS failed — use cached if available
      if(_cachedGPS){
        updates['construction/'+fc+'/'+key+'_lat']=_cachedGPS.lat;
        updates['construction/'+fc+'/'+key+'_lng']=_cachedGPS.lng;
        updates['construction/'+fc+'/'+key+'_gpsAcc']=_cachedGPS.acc;
        logEntry.lat=_cachedGPS.lat;logEntry.lng=_cachedGPS.lng;logEntry.gpsAcc=_cachedGPS.acc;
      }
      db.ref().update(updates).then(function(){
        showToast('✅ Guardado'+(_cachedGPS?' + GPS':''),'var(--ac)');updLastSave();
      }).catch(function(err){
        showToast('⚠️ Error: '+err.message,'var(--no)');
        setTimeout(function(){db.ref().update(updates)},3000);
      });
      db.ref('con_log').push(logEntry);
    },{enableHighAccuracy:true,timeout:5000,maximumAge:30000});
  }else{
    // No geolocation API — use cached if available
    if(_cachedGPS){
      updates['construction/'+fc+'/'+key+'_lat']=_cachedGPS.lat;
      updates['construction/'+fc+'/'+key+'_lng']=_cachedGPS.lng;
      logEntry.lat=_cachedGPS.lat;logEntry.lng=_cachedGPS.lng;
    }
    db.ref().update(updates).then(function(){
      showToast('✅ Guardado','var(--ac)');updLastSave();
    }).catch(function(err){
      showToast('⚠️ Error: '+err.message,'var(--no)');
      setTimeout(function(){db.ref().update(updates)},3000);
    });
    db.ref('con_log').push(logEntry);
  }
}

// Distancia N-S acumulada nominal desde MP (±30mm tolerancia)
// Key = pilar index offset from MP (1=1N/1S, 2=2N/2S, etc.)
var DIST_NS_TOL=30;
var DIST_NS_NOM={
  largo:{1:7600,2:14800,3:21800,4:28500},
  corto:{1:6700,2:13400}
};

// Nominal inter-pilar distances (tramo) per position and type (from v1 checklist)
// Tolerance: ±30mm on each tramo
var TRAMO_NOM={
  largo:[6710,7010,7210,7610,0,7610,7200,7000,6710],
  corto:[6715,6710,0,6695,6705]
};
var TRAMO_TOL=30;

function getTramoTol(type,piIdx){
  var isLargo=(type==='monofila_largo'||type==='bifila_largo');
  var noms=isLargo?TRAMO_NOM.largo:TRAMO_NOM.corto;
  if(piIdx<0||piIdx>=noms.length||noms[piIdx]===0)return null;
  var nom=noms[piIdx];
  return{nom:nom,min:nom-TRAMO_TOL,max:nom+TRAMO_TOL};
}

// Calculate accumulated distance from MP to pilar pi, using recorded tramo measurements
function calcAccumDist(qd,px,pi,mpI,type){
  var isLargo=(type==='monofila_largo'||type==='bifila_largo');
  var noms=isLargo?DIST_NS_NOM.largo:DIST_NS_NOM.corto;
  if(pi===mpI)return null;
  var accum=0;var complete=true;
  if(pi<mpI){
    // North side: sum from pi toward MP (pi, pi+1, ..., mpI-1)
    for(var j=mpI-1;j>=pi;j--){
      var tv=qd[px+'_'+j+'_dist_ns_tramo'];
      if(tv!=null)accum+=tv;else complete=false;
    }
  }else{
    // South side: sum from mpI+1 to pi
    for(var j=mpI+1;j<=pi;j++){
      var tv=qd[px+'_'+j+'_dist_ns_tramo'];
      if(tv!=null)accum+=tv;else complete=false;
    }
  }
  var offset=Math.abs(pi-mpI);
  var nom=noms[offset]||null;
  if(!nom)return null;
  var outTol=(complete&&accum>0)?(accum<nom-DIST_NS_TOL||accum>nom+DIST_NS_TOL):false;
  return{accum:accum,nom:nom,offset:offset,complete:complete,outTol:outTol};
}

    h+='</div>';

// RESUMEN
function rResumen(a){
  var pvs=[...new Set(Object.values(MASTER_DATA).map(function(d){return d.pv}))].sort(function(a2,b){return a2-b});
  var h='<div class="hdr"><button class="btn-icon" onclick="V.screen=\'modesel\';R()">←</button><div><h1>📊 Resumen</h1><div class="sub">Construcción + Calidad</div></div></div>';
  h+='<div class="cnt" style="padding-top:14px">';
  h+='<select class="sel" id="resPv" onchange="V.resPv=parseInt(this.value);renderResumen()"><option value="">Selecciona PV</option>';
  pvs.forEach(function(p){h+='<option value="'+p+'"'+(V.resPv===p?' selected':'')+'>PV'+String(p).padStart(2,'0')+'</option>'});
  h+='</select>';

function renderResumen(){
  var pv=V.resPv;
  var el=document.getElementById('res-content');
  if(!pv){el.innerHTML='';return}
  
  el.innerHTML='<div style="text-align:center;padding:20px;color:var(--td)">Cargando datos...</div>';
  
  var subs=[...new Set(Object.values(MASTER_DATA).filter(function(d){return d.pv===pv&&d.sub>0}).map(function(d){return d.sub}))].sort(function(a,b){return a-b});
  if(subs.length===0)subs=[0];
  
  // Fetch construction + quality data
  Promise.all([
    db.ref('construction').once('value'),
    db.ref('quality').once('value')
  ]).then(function(results){
    var conAll=results[0].val()||{};
    var qualAll=results[1].val()||{};
    
    var h='';
    subs.forEach(function(sub){
      var codes=Object.keys(MASTER_DATA).filter(function(code){
        var d=MASTER_DATA[code];
        return d.pv===pv&&(sub===0||d.sub===sub);
      });
      
      // Construction stats
      var conTotal=0,conHinc=0,conRech=0;
      codes.forEach(function(code){
        var con=conAll[code.replace(/\./g,'_')]||conAll[code]||{};
        var cfg2=PCFG[MASTER_DATA[code].type];
        for(var f=0;f<(cfg2.conducida?2:1);f++){
          var px2=f===0?'fm':'fc';var pils2=f===0?cfg2.motor:cfg2.conducida;
          for(var i=0;i<pils2.length;i++){
            conTotal++;
            var est=con[px2+'_'+i+'_estado']||'';
            if(est==='hincada')conHinc++;
            else if(est==='rechazo')conRech++;
          }
        }
      });
      var conPct=conTotal>0?Math.round(conHinc/conTotal*100):0;
      
      // Quality stats
      var qualStarted=0,qualTotal=codes.length;
      codes.forEach(function(code){
        var qd=qualAll[code.replace(/\./g,'_')]||qualAll[code];
        if(qd&&Object.keys(qd).length>0)qualStarted++;
      });
      var qualPct=qualTotal>0?Math.round(qualStarted/qualTotal*100):0;
      
      h+='<div class="card">';
      h+='<div style="font-weight:700;font-size:16px;margin-bottom:10px">'+(sub?'Subcampo '+sub:'PV'+String(pv).padStart(2,'0'))+' <span style="font-size:12px;color:var(--td)">('+codes.length+' trackers)</span></div>';
      
      // Two-column stats
      h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">';
      
      var conColor=conPct>=100?'var(--ac)':conRech>0?'var(--no)':conHinc>0?'var(--info)':'var(--bd)';
      h+='<div style="padding:12px;border-radius:10px;background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.2)">';
      h+='<div style="font-size:11px;color:var(--info);font-weight:600">🏗️ CONSTRUCCIÓN</div>';
      h+='<div style="font-size:24px;font-weight:700;color:'+conColor+';margin:4px 0">'+conPct+'%</div>';
      h+='<div class="prog" style="height:5px"><div class="prog-f" style="width:'+conPct+'%;background:'+conColor+'"></div></div>';
      h+='<div style="font-size:10px;color:var(--td);margin-top:4px">'+conHinc+' hincados'+(conRech>0?' · '+conRech+' rechazos':'')+' / '+conTotal+'</div>';
      h+='</div>';
      
      var qualColor=qualPct>=100?'var(--ac)':qualStarted>0?'var(--info)':'var(--bd)';

// ============================================================
// UTM Zone 30N to WGS84
function utmToLL(x,y){
  var k0=0.9996,a=6378137,e=0.00669438,e1sq=e/(1-e);
  var M0=y/k0;
  var mu=M0/(a*(1-e/4-3*e*e/64-5*e*e*e/256));
  var e1=(1-Math.sqrt(1-e))/(1+Math.sqrt(1-e));
  var J1=3*e1/2-27*Math.pow(e1,3)/32;
  var J2=21*e1*e1/16-55*Math.pow(e1,4)/32;
  var J3=151*Math.pow(e1,3)/96;
  var fp=mu+J1*Math.sin(2*mu)+J2*Math.sin(4*mu)+J3*Math.sin(6*mu);
  var C1=e1sq*Math.pow(Math.cos(fp),2);
  var T1=Math.pow(Math.tan(fp),2);
  var R1=a*(1-e)/Math.pow(1-e*Math.pow(Math.sin(fp),2),1.5);
  var N1=a/Math.sqrt(1-e*Math.pow(Math.sin(fp),2));
  var D=(x-500000)/(N1*k0);
  var lat=fp-N1*Math.tan(fp)/R1*(D*D/2-(5+3*T1+10*C1-4*C1*C1-9*e1sq)*Math.pow(D,4)/24);
  var lon=D*(1-(1+2*T1+C1)*D*D/6+(5-2*C1+28*T1-3*C1*C1+8*e1sq+24*T1*T1)*Math.pow(D,4)/120)/Math.cos(fp);
  return {lat:lat*180/Math.PI, lng:lon*180/Math.PI+(-3)}; // Zone 30 central meridian = -3
}

function initMap(){
  if(MAP){MAP.remove();MAP=null}
  
  var mapEl=document.getElementById('mapEl');
  if(!mapEl)return;
  
  MAP=L.map('mapEl',{zoomControl:true,attributionControl:false});
  
  // Satellite tiles
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{
    maxZoom:20,attribution:'Esri'
  }).addTo(MAP);
  
  // Labels overlay
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{
    maxZoom:20
  }).addTo(MAP);
  
  loadMap();
}

function loadMap(){
  if(!MAP)return;
  MAP_MARKERS.forEach(function(m){MAP.removeLayer(m)});
  MAP_MARKERS=[];
  var pv=V.mapPv||0,sub=V.mapSub||0,bounds=[];

  db.ref('construction').once('value',function(snap){
    var conData=snap.val()||{};

    // LEVEL 1: No PV → show PV centers
    if(!pv){
      var pvs=[...new Set(Object.values(MASTER_DATA).map(function(d){return d.pv}))].sort(function(a,b){return a-b});
      pvs.forEach(function(p){
        var trs=Object.entries(MASTER_DATA).filter(function(e){return e[1].pv===p&&e[1].mx&&e[1].my});
        if(!trs.length)return;
        var ax=trs.reduce(function(a,e){return a+e[1].mx},0)/trs.length;
        var ay=trs.reduce(function(a,e){return a+e[1].my},0)/trs.length;
        var ll=utmToLL(ax,ay);bounds.push([ll.lat,ll.lng]);
        var tp2=0,hk2=0,rj2=0;
        trs.forEach(function(e){var cd=e[0],d=e[1],cn=conData[cd.replace(/\./g,'_')]||{},cfg=PCFG[d.type];if(!cfg)return;
          for(var f=0;f<(cfg.conducida?2:1);f++){var px=f===0?'fm':'fc';var pls=f===0?cfg.motor:cfg.conducida;
            for(var i=0;i<pls.length;i++){tp2++;var est=cn[px+'_'+i+'_estado']||'';if(est==='hincada')hk2++;else if(est==='rechazo')rj2++}}});
        var pc=tp2>0?Math.round(hk2/tp2*100):0;
        var co=hk2===0?'#555':rj2>0?'#ef4444':pc>=100?'#22c55e':'#3b82f6';
        var mk=L.circleMarker([ll.lat,ll.lng],{radius:20,fillColor:co,color:'#fff',weight:2,opacity:1,fillOpacity:0.85}).addTo(MAP);
        mk.bindTooltip('PV'+String(p).padStart(2,'0'),{permanent:true,direction:'center',className:'pv-label'});
        mk.bindPopup('<div style="font-family:sans-serif;font-size:12px"><b>PV'+String(p).padStart(2,'0')+'</b><br>'+trs.length+' trackers<br>Hincado: '+pc+'%<br><button onclick="V.mapPv='+p+';loadMap()" style="margin-top:6px;padding:6px 12px;border-radius:6px;background:#3ecf8e;color:#000;font-weight:700;font-size:11px;border:none;cursor:pointer;width:100%">Entrar</button></div>');
        MAP_MARKERS.push(mk);
      });
      if(bounds.length)MAP.fitBounds(bounds,{padding:[30,30]});
      return;
    }

    // LEVEL 2: PV selected, has subs → show subcampo centers
    var hasSubs=[...new Set(Object.values(MASTER_DATA).filter(function(d){return d.pv===pv&&d.sub>0}).map(function(d){return d.sub}))].sort(function(a,b){return a-b});
    if(hasSubs.length>0&&!sub){
      hasSubs.forEach(function(s){
        var trs=Object.entries(MASTER_DATA).filter(function(e){return e[1].pv===pv&&e[1].sub===s&&e[1].mx&&e[1].my});
        if(!trs.length)return;
        var ax=trs.reduce(function(a,e){return a+e[1].mx},0)/trs.length;
        var ay=trs.reduce(function(a,e){return a+e[1].my},0)/trs.length;
        var ll=utmToLL(ax,ay);bounds.push([ll.lat,ll.lng]);
        var tp2=0,hk2=0;
        trs.forEach(function(e){var cn=conData[e[0].replace(/\./g,'_')]||{},cfg=PCFG[e[1].type];if(!cfg)return;
          for(var f=0;f<(cfg.conducida?2:1);f++){var px=f===0?'fm':'fc';var pls=f===0?cfg.motor:cfg.conducida;
            for(var i=0;i<pls.length;i++){tp2++;if(cn[px+'_'+i+'_estado']==='hincada')hk2++}}});
        var pc=tp2>0?Math.round(hk2/tp2*100):0;
        var co=hk2===0?'#555':pc>=100?'#22c55e':'#3b82f6';
        var mk=L.circleMarker([ll.lat,ll.lng],{radius:15,fillColor:co,color:'#fff',weight:2,opacity:1,fillOpacity:0.85}).addTo(MAP);
        mk.bindTooltip('S'+s,{permanent:true,direction:'center',className:'pv-label'});
        mk.bindPopup('<div style="font-family:sans-serif;font-size:12px"><b>Sub '+s+'</b><br>'+trs.length+' trackers · '+pc+'%<br><button onclick="V.mapSub='+s+';loadMap()" style="margin-top:6px;padding:6px 12px;border-radius:6px;background:#3ecf8e;color:#000;font-weight:700;font-size:11px;border:none;cursor:pointer;width:100%">Ver trackers</button></div>');
        MAP_MARKERS.push(mk);
      });
      if(bounds.length)MAP.fitBounds(bounds,{padding:[30,30]});
      return;
    }

    // LEVEL 3: Individual trackers
    Object.entries(MASTER_DATA).forEach(function(e){
      var code=e[0],d=e[1];
      if(d.pv!==pv)return;if(sub&&d.sub!==sub)return;if(!d.mx||!d.my)return;
      var ll=utmToLL(d.mx,d.my);bounds.push([ll.lat,ll.lng]);
      var cn=conData[code.replace(/\./g,'_')]||{},cfg=PCFG[d.type];
      var tp2=cfg.motor.length+(cfg.conducida?cfg.conducida.length:0),hk2=0,rj2=0;
      for(var f=0;f<(cfg.conducida?2:1);f++){var px=f===0?'fm':'fc';var pls=f===0?cfg.motor:cfg.conducida;
        for(var i=0;i<pls.length;i++){var est=cn[px+'_'+i+'_estado']||'';if(est==='hincada')hk2++;else if(est==='rechazo')rj2++}}
      var co=hk2===0&&rj2===0?'#555':rj2>0?'#ef4444':hk2>=tp2?'#22c55e':'#3b82f6';
      var pc=tp2>0?Math.round(hk2/tp2*100):0;
      var mk=L.circleMarker([ll.lat,ll.lng],{radius:6,fillColor:co,color:co,weight:1,opacity:0.8,fillOpacity:0.7}).addTo(MAP);
      mk.bindPopup('<div style="font-family:sans-serif;font-size:12px"><b>'+code+'</b><br>'+d.type+'<br>'+(hk2>0||rj2>0?'Hincado: '+hk2+'/'+tp2+' ('+pc+'%)'+(rj2>0?' · '+rj2+' rechazos':''):'Sin datos')+'<br><button onclick="V.screen=\'contractor\';V.conTr=\''+code+'\';V.conPi=0;V.conFila=\'motor\';R()" style="margin-top:6px;padding:6px 12px;border-radius:6px;background:#3ecf8e;color:#000;font-weight:700;font-size:11px;border:none;cursor:pointer;width:100%">Abrir</button></div>');
      MAP_MARKERS.push(mk);
    });
    if(bounds.length)MAP.fitBounds(bounds,{padding:[20,20],maxZoom:17});
  },function(err){DBG('Map error: '+err.message)});
}


function exportPunchlistPDF(pv,sub,phase){
  var jsPDF=window.jspdf.jsPDF;
  var doc=new jsPDF();
  var items=getPLItems(pv,sub,phase);
  
  // Header
  doc.setFontSize(18);doc.setFont(undefined,'bold');
  doc.text('PUNCHLIST — ISFV ATALAYA',14,20);
  doc.setFontSize(11);doc.setFont(undefined,'normal');
  doc.text('PV'+String(pv).padStart(2,'0')+' / Subcampo '+sub+' / '+WF_LABELS[phase],14,28);
  doc.text('Generado: '+new Date().toLocaleString('es-ES'),14,34);
  doc.text('Generado por: '+(U?U.name:''),14,40);
  
  doc.setLineWidth(0.5);doc.line(14,44,196,44);
  
  // Table header
  var y=50;
  doc.setFontSize(9);doc.setFont(undefined,'bold');
  doc.text('Tracker',14,y);doc.text('Pilar',50,y);doc.text('Descripción',74,y);doc.text('Estado',156,y);doc.text('Detectado',176,y);
  y+=2;doc.line(14,y,196,y);y+=5;
  
  // Items
  doc.setFont(undefined,'normal');doc.setFontSize(8);
  items.forEach(function(item){
    var p=item.d;
    if(y>275){doc.addPage();y=20}
    doc.text(p.tracker||'-',14,y);
    doc.text(p.pilar||'-',50,y);
    var desc=p.desc||'';
    if(desc.length>50)desc=desc.substring(0,50)+'...';
    doc.text(desc,74,y);
    
    var stColor=p.estado==='pendiente'?[239,68,68]:p.estado==='reparado'?[245,158,11]:[34,197,94];
    doc.setTextColor(stColor[0],stColor[1],stColor[2]);
    doc.text(p.estado||'pendiente',156,y);
    doc.setTextColor(0,0,0);
    
    doc.text(p.detectadoPor||'-',176,y);
    y+=5;
  });
  
  // Summary
  y+=5;
  var pending=items.filter(function(i){return i.d.estado==='pendiente'}).length;
  var repaired=items.filter(function(i){return i.d.estado==='reparado'}).length;
  var verified=items.filter(function(i){return i.d.estado==='verificado'}).length;
  doc.setFontSize(10);doc.setFont(undefined,'bold');
  doc.text('Resumen: '+items.length+' items — '+pending+' pendientes, '+repaired+' reparados, '+verified+' verificados',14,y);
  
  // Signatures area
  y+=15;
  doc.setFont(undefined,'normal');doc.setFontSize(9);
  doc.text('Realizado por:',14,y);doc.text('Validado por:',80,y);doc.text('Aprobado por:',146,y);
  doc.line(14,y+15,70,y+15);doc.line(80,y+15,136,y+15);doc.line(146,y+15,196,y+15);
  doc.text('Nombre:',14,y+20);doc.text('Nombre:',80,y+20);doc.text('Nombre:',146,y+20);
  doc.text('Fecha:',14,y+28);doc.text('Fecha:',80,y+28);doc.text('Fecha:',146,y+28);
  
  doc.save('Punchlist_PV'+pv+'_Sub'+sub+'_'+phase+'.pdf');
  toast('PDF generado','var(--ac)');
}

  });

// ============================================================
// TIMER DE PRODUCTIVIDAD
// ============================================================
function startTimer(code,pilarKey){
  var timerRef='timers/'+code+'/'+pilarKey;
  db.ref(timerRef).set({
    start:firebase.database.ServerValue.TIMESTAMP,
    end:null,
    by:U.name,uid:U.uid,
    equipo:''
  });
  showToast('⏱️ Timer iniciado','var(--info)');
}

function stopTimer(code,pilarKey){
  var timerRef='timers/'+code+'/'+pilarKey;
  db.ref(timerRef+'/end').set(firebase.database.ServerValue.TIMESTAMP);
  showToast('⏱️ Timer parado','var(--ac)');
}

function getTimerHTML(code,pilarKey,timerData){
  if(!timerData||!timerData.start)return '<button onclick="startTimer(\''+code+'\',\''+pilarKey+'\')" style="padding:6px 12px;border-radius:8px;background:var(--sf);border:1px solid var(--bd);color:var(--info);font-size:11px;font-weight:600;cursor:pointer">⏱️ Iniciar timer</button>';
  
  if(timerData.end){
    var dur=Math.round((timerData.end-timerData.start)/1000);
    var min=Math.floor(dur/60);
    var sec=dur%60;
    return '<span style="font-size:11px;padding:4px 10px;border-radius:8px;background:rgba(62,207,142,.1);border:1px solid var(--ac);color:var(--ac);font-weight:600">⏱️ '+min+'m '+sec+'s</span>';
  }
  
  return '<button onclick="stopTimer(\''+code+'\',\''+pilarKey+'\')" style="padding:6px 12px;border-radius:8px;background:rgba(239,68,68,.15);border:1px solid var(--no);color:var(--no);font-size:11px;font-weight:600;cursor:pointer;animation:pulse 1s infinite">⏱️ En curso... Parar</button>';
}


// ============================================================
// COMPARATIVA TEÓRICO VS REAL
// ============================================================
function getCompHTML(supData,conData,pilarKey){
  if(!supData)return '';
  var realProf=conData[pilarKey+'_prof_real'];
  if(realProf==null)return '';
  
  var teo=supData.ph;
  var diff=realProf-teo;
  var pct=teo>0?Math.round(Math.abs(diff)/teo*100):0;
  var color=pct<=5?'var(--ac)':pct<=15?'var(--warn)':'var(--no)';
  var label=diff>0?'+'+diff.toFixed(3)+'m más profundo':diff<0?diff.toFixed(3)+'m menos profundo':'Exacto';
  
  return '<div style="padding:8px;border-radius:8px;background:var(--bg);margin-top:6px"><div style="display:flex;justify-content:space-between;font-size:11px;color:var(--td)"><span>Teórico: '+teo.toFixed(3)+'m</span><span>Real: '+realProf.toFixed(3)+'m</span></div><div style="font-size:12px;font-weight:600;color:'+color+';margin-top:4px">'+label+' ('+pct+'%)</div></div>';
}

function generateWeeklyReport(){
  showToast('Generando informe...','var(--info)');
  
  var now=new Date();
  var weekAgo=new Date(now.getTime()-7*24*60*60*1000);
  
  // Fetch all data
  Promise.all([
    db.ref('construction').once('value'),
    db.ref('con_log').orderByChild('ts').startAt(weekAgo.getTime()).once('value'),
    db.ref('punchlist').once('value'),
    db.ref('workflow').once('value'),
    db.ref('timers').once('value')
  ]).then(function(results){
    var conData=results[0].val()||{};
    var logData=results[1].val()||{};
    var plData=results[2].val()||{};
    var wfData=results[3].val()||{};
    var timerData=results[4].val()||{};
    
    var logs=Object.values(logData);
    var jsPDF=window.jspdf.jsPDF;
    var doc=new jsPDF();
    
    // Header
    doc.setFontSize(20);doc.setFont(undefined,'bold');
    doc.text('INFORME SEMANAL',14,20);
    doc.setFontSize(12);doc.setFont(undefined,'normal');
    doc.text('ISFV ATALAYA — XAMAI / X-ELIO',14,28);
    doc.text('Periodo: '+weekAgo.toLocaleDateString('es-ES')+' — '+now.toLocaleDateString('es-ES'),14,35);
    doc.text('Generado: '+now.toLocaleString('es-ES')+' por '+(U?U.name:''),14,42);
    doc.setLineWidth(0.5);doc.line(14,46,196,46);
    
    // KPIs
    var totalPilars=0,hincados=0,rechazos=0;
    Object.keys(conData).forEach(function(code){
      var tr=conData[code];
      Object.keys(tr).forEach(function(k){
        if(!k.match(/_estado$/))return;
        totalPilars++;
        if(tr[k]==='hincada')hincados++;
        else if(tr[k]==='rechazo')rechazos++;
      });
    });
    
    var weekHincados=logs.filter(function(l){return l.field&&l.field.indexOf('_estado')>=0&&l.value==='hincada'}).length;
    var weekRechazos=logs.filter(function(l){return l.field&&l.field.indexOf('_estado')>=0&&l.value==='rechazo'}).length;
    
    doc.setFontSize(14);doc.setFont(undefined,'bold');
    doc.text('1. RESUMEN GENERAL',14,56);
    doc.setFontSize(11);doc.setFont(undefined,'normal');
    var y=64;
    doc.text('Pilares registrados total: '+totalPilars,20,y);y+=7;
    doc.text('Pilares hincados total: '+hincados+' ('+Math.round(hincados/Math.max(totalPilars,1)*100)+'%)',20,y);y+=7;
    doc.text('Rechazos total: '+rechazos,20,y);y+=7;
    doc.text('Hincados esta semana: '+weekHincados,20,y);y+=7;
    doc.text('Rechazos esta semana: '+weekRechazos,20,y);y+=12;
    
    // By day this week
    doc.setFontSize(14);doc.setFont(undefined,'bold');
    doc.text('2. ACTIVIDAD POR DIA',14,y);y+=8;
    doc.setFontSize(10);doc.setFont(undefined,'normal');
    
    var byDay={};
    logs.forEach(function(l){
      if(!l.ts)return;
      var d=new Date(l.ts);
      var key=d.toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'});
      if(!byDay[key])byDay[key]={total:0,hincados:0,rechazos:0};
      byDay[key].total++;
      if(l.value==='hincada')byDay[key].hincados++;
      if(l.value==='rechazo')byDay[key].rechazos++;
    });
    
    Object.keys(byDay).forEach(function(day){
      var d=byDay[day];
      doc.text(day+': '+d.total+' registros, '+d.hincados+' hincados, '+d.rechazos+' rechazos',20,y);y+=6;
    });
    y+=6;
    
    // By operator
    doc.setFontSize(14);doc.setFont(undefined,'bold');
    doc.text('3. POR OPERADOR',14,y);y+=8;
    doc.setFontSize(10);doc.setFont(undefined,'normal');
    
    var byOp={};
    logs.forEach(function(l){
      if(!l.by)return;
      if(!byOp[l.by])byOp[l.by]={total:0,h:0,r:0};
      byOp[l.by].total++;
      if(l.value==='hincada')byOp[l.by].h++;
      if(l.value==='rechazo')byOp[l.by].r++;
    });
    
    Object.keys(byOp).sort(function(a,b){return byOp[b].h-byOp[a].h}).forEach(function(op){
      var o=byOp[op];
      doc.text(op+': '+o.h+' hincados, '+o.r+' rechazos ('+o.total+' registros)',20,y);y+=6;
      if(y>270){doc.addPage();y=20}
    });
    y+=6;
    
    // Timer stats
    var timerCount=0,totalDur=0;
    Object.keys(timerData).forEach(function(code){
      var t=timerData[code];
      Object.keys(t).forEach(function(k){
        if(t[k].start&&t[k].end){
          timerCount++;
          totalDur+=(t[k].end-t[k].start)/1000;
        }
      });
    });
    
    if(timerCount>0){
      if(y>250){doc.addPage();y=20}
      doc.setFontSize(14);doc.setFont(undefined,'bold');
      doc.text('4. PRODUCTIVIDAD',14,y);y+=8;
      doc.setFontSize(10);doc.setFont(undefined,'normal');
      var avgMin=Math.round(totalDur/timerCount/60);
      doc.text('Pilares con timer: '+timerCount,20,y);y+=6;
      doc.text('Tiempo medio por pilar: '+avgMin+' minutos',20,y);y+=6;
      doc.text('Tiempo total registrado: '+Math.round(totalDur/3600)+' horas',20,y);y+=12;
    }
    
    // Punchlist
    var plItems=Object.values(plData);
    var plPend=plItems.filter(function(p){return p.estado==='pendiente'}).length;
    var plRep=plItems.filter(function(p){return p.estado==='reparado'}).length;
    var plVer=plItems.filter(function(p){return p.estado==='verificado'}).length;
    
    if(plItems.length>0){
      if(y>250){doc.addPage();y=20}
      doc.setFontSize(14);doc.setFont(undefined,'bold');
      doc.text('5. PUNCHLIST',14,y);y+=8;
      doc.setFontSize(10);doc.setFont(undefined,'normal');
      doc.text('Pendientes: '+plPend+' | Reparados: '+plRep+' | Verificados: '+plVer,20,y);y+=12;
    }
    
    // Workflow states
    var wfKeys=Object.keys(wfData);
    if(wfKeys.length>0){
      if(y>240){doc.addPage();y=20}
      doc.setFontSize(14);doc.setFont(undefined,'bold');
      doc.text('6. WORKFLOW',14,y);y+=8;
      doc.setFontSize(9);doc.setFont(undefined,'normal');
      wfKeys.sort().forEach(function(k){
        var w=wfData[k];
        var st=w.state||'CON';
        doc.text(k+': '+st+(w.by?' ('+w.by+')':''),20,y);y+=5;
        if(y>275){doc.addPage();y=20}
      });
    }
    
    doc.save('Informe_Semanal_'+now.toISOString().substring(0,10)+'.pdf');
    showToast('PDF generado','var(--ac)');
  });
}

function dpLoadData(){

      pvCounts.forEach(function(cnt,pi){

        for(var t=0;t<useCount;t++){

          var rand=Math.random();
          var nPilars=cfg?(cfg.conducida?cfg.motor.length+cfg.conducida.length:cfg.motor.length):(rand<0.4?5:9);
          pilT+=nPilars;var pDone=0,pRech=0;

          var trkDone=rand<progress*0.85;
          var trkCurso=!trkDone&&rand<progress;
          var trkIssue=Math.random()<0.06;

          demoCon[fc]={};
          for(var p=0;p<nPilars;p++){
            if(trkDone||(trkCurso&&Math.random()<0.7)){
              if(trkIssue&&p===Math.floor(nPilars/2)){
                demoCon[fc]['fm_'+p+'_estado']='rechazo';pRech++;
              }else{
                demoCon[fc]['fm_'+p+'_estado']='hincada';pDone++;

          }

          if(pDone===nPilars)done++;
          else if(pDone>0)curso++;

        }

        totalDone+=done;totalCurso+=curso;totalInc+=issues;

          totalP++;
          var est=con[px+'_'+i+'_estado']||'';
          if(est==='hincada')hincP++;
          else if(est==='rechazo')rechP++;
        }
      }

      var allDone=totalP>0&&hincP===totalP;
      var hasIssue=rechP>0;
      var started=hincP>0||rechP>0;

      if(allDone)kpis.completed++;
      else if(started)kpis.inProgress++;
      else kpis.pending++;
      if(hasIssue)kpis.incidents++;

      // By PV
      if(!pvMap[pv])pvMap[pv]={pv:pv,total:0,done:0,issues:0,pilTotal:0,pilDone:0};
      pvMap[pv].total++;
      if(allDone)pvMap[pv].done++;
      if(hasIssue)pvMap[pv].issues++;
      pvMap[pv].pilTotal+=totalP;
      pvMap[pv].pilDone+=hincP;

      // Last modifier as tech
      var lastBy=con._lastBy||'';
      if(lastBy){
        if(!techMap[lastBy])techMap[lastBy]={name:lastBy,done:0,started:0,issues:0,pilars:0};
        techMap[lastBy].pilars+=hincP;
        if(allDone)techMap[lastBy].done++;
        if(started)techMap[lastBy].started++;
        if(hasIssue)techMap[lastBy].issues++;
      }

      // Incidents
      if(hasIssue){
        var fields=[];
        for(var f2=0;f2<(cfg.conducida?2:1);f2++){
          var px2=f2===0?'fm':'fc';
          var pils2=f2===0?cfg.motor:cfg.conducida;
          for(var i2=0;i2<pils2.length;i2++){
            if(con[px2+'_'+i2+'_estado']==='rechazo')fields.push((f2===0?'Motor':'Cond.')+' pilar '+(i2+1));
          }
        }
        incidents.push({tracker:code,pv:pv,field:fields.join(', ')||'Rechazo',tech:lastBy,date:con._lastTS?new Date(con._lastTS).toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit'}):''});
      }
    });

    kpis.pct=kpis.total>0?Math.round(kpis.completed/kpis.total*1000)/10:0;

    // Process logs for daily chart
    var logArr=[];
    Object.keys(logAll).forEach(function(k){var l=logAll[k];if(l&&l.ts)logArr.push(l)});
    logArr.sort(function(a2,b2){return (a2.ts||0)-(b2.ts||0)});
    logArr.forEach(function(l){
      if(!l.ts)return;
      var dk=new Date(l.ts).toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit'});
      dayMap[dk]=(dayMap[dk]||0)+1;
      // Also capture tech from logs
      if(l.by&&!techMap[l.by]){techMap[l.by]={name:l.by,done:0,started:0,issues:0,pilars:0}}
      if(l.by&&l.field&&l.field.indexOf('_estado')>=0&&l.value==='hincada'){
        if(techMap[l.by])techMap[l.by].pilars++;
      }
    });

    var daily=Object.keys(dayMap).slice(-30).map(function(d){return{date:d,count:dayMap[d]}});
    var byPv=Object.values(pvMap).sort(function(a2,b2){return a2.pv.localeCompare(b2.pv,undefined,{numeric:true})});
    var byTech=Object.values(techMap).sort(function(a2,b2){return (b2.pilars||b2.done)-(a2.pilars||a2.done)});

    // Calendar heatmap data (last 6 months by ISO date)
    var calMap={};
    logArr.forEach(function(l){
      if(!l.ts)return;
      var d=new Date(l.ts);
      var iso=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      calMap[iso]=(calMap[iso]||0)+1;
    });

    // Work stats
    var workDays=Object.keys(dayMap).length;
    var totalLogs=logArr.length;
    var dailyAvg=workDays>0?Math.round(totalLogs/workDays):0;

    // Recent logs (last 10)
    var recentLogs=logArr.slice(-10).reverse().map(function(l){
      return{tracker:l.tracker||'',field:l.field||'',value:l.value||'',by:l.by||'',ts:l.ts};
    });

    _dpData={kpis:kpis,byPv:byPv,byTech:byTech,daily:daily,incidents:incidents.slice(0,20),calMap:calMap,workDays:workDays,dailyAvg:dailyAvg,totalLogs:totalLogs,recentLogs:recentLogs};

    // If no real data, inject demo
    if(kpis.total===0){
      DBG('No data from Firebase — loading DEMO');
      _dpData=_dpDemoData();
      CACHE._dpCon=_dpData._demoCon||{};
      document.getElementById('dp-meta').innerHTML='<span style="background:rgba(255,255,255,.2);padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600">DEMO</span> '+new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
    }else{
      document.getElementById('dp-meta').innerHTML='Actualizado '+new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
    }
    document.getElementById('dp-footer').textContent='Checklist Solar v2.8 · ISFV ATALAYA · '+_dpData.kpis.total+' trackers · Xamai Global · '+new Date().toLocaleDateString('es-ES',{year:'numeric',month:'long',day:'numeric'});

    dpRenderKPIs();
    dpRender();
  }).catch(function(err){
    DBG('dpLoadData error: '+err.message+' — loading DEMO');
    _dpData=_dpDemoData();
    CACHE._dpCon=_dpData._demoCon||{};
    document.getElementById('dp-meta').innerHTML='<span style="background:rgba(255,255,255,.2);padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600">DEMO</span>';
    document.getElementById('dp-footer').textContent='Checklist Solar v2.8 · ISFV ATALAYA · DEMO · Xamai Global';
    dpRenderKPIs();
    dpRender();
  });
}

function dpRenderKPIs(){
  if(!_dpData)return;
  var k=_dpData.kpis;
  var CC={green:'#16A34A',greenS:'#DCFCE7',blue:'#3B82F6',blueS:'#DBEAFE',amber:'#F59E0B',amberS:'#FEF3C7',ts:'#64748B'};

  function kpiCard(icon,label,val,sub,color,bg){
    return '<div style="background:#fff;border-radius:14px;padding:18px 16px;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid #E2E8F0;display:flex;align-items:center;gap:14px">'
      +'<div style="width:44px;height:44px;border-radius:11px;background:'+bg+';display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">'+icon+'</div>'
      +'<div><div style="font-size:26px;font-weight:700;color:'+color+';line-height:1.1">'+val.toLocaleString('es-ES')+'</div>'
      +'<div style="font-size:11px;color:'+CC.ts+';font-weight:500;margin-top:2px">'+label+'</div>'
      +(sub?'<div style="font-size:10px;color:#94A3B8;margin-top:1px">'+sub+'</div>':'')
      +'</div></div>';
  }

  document.getElementById('dp-kpis').innerHTML=
    kpiCard('✅','Validados',k.completed,k.pct+'% del total',CC.green,CC.greenS)
    +kpiCard('🔄','En curso',k.inProgress,'de '+k.total+' trackers',CC.blue,CC.blueS)
    +kpiCard('⚠️','Incidencias',k.incidents,'',CC.amber,CC.amberS)
    +kpiCard('⏳','Pendientes',k.pending,'',CC.ts,'#F1F5F9');
}

function dpRender(){
  _dpDestroy();
  if(!_dpData)return;
  var el=document.getElementById('dp-content');
  var d=_dpData;

  if(_dpTab==='overview')dpOverview(el,d);
  else if(_dpTab==='pvs')dpPvs(el,d);
  else if(_dpTab==='team')dpTeam(el,d);
  else if(_dpTab==='incidents')dpIncidents(el,d);
}

function _dpCard(title,icon,content){
  return '<div style="background:#fff;border-radius:14px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid #E2E8F0;min-width:0;overflow:hidden">'
    +'<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid rgba(5,150,105,.13)">'
    +'<span style="font-size:16px">'+icon+'</span>'
    +'<span style="font-size:14px;font-weight:700;letter-spacing:-.01em">'+title+'</span></div>'
    +content+'</div>';
}

  calHTML+='</div>';

      var isoKey=cellDate.getFullYear()+'-'+String(cellDate.getMonth()+1).padStart(2,'0')+'-'+String(cellDate.getDate()).padStart(2,'0');
      var cnt=d.calMap[isoKey]||0;

  calHTML+='</div></div></div>';
  calHTML+='<div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px">';
  calHTML+='<span style="font-size:10px;color:#64748B;font-weight:500">'+calTotal.toLocaleString('es-ES')+' registros en '+d.workDays+' d\u00edas</span>';

      dotHTML+='<div title="'+code+' ('+hincP+'/'+totalP+')" style="width:10px;height:10px;border-radius:50%;background:'+dotC+';cursor:default"></div>';

  });
  dotHTML+='<div style="display:flex;gap:12px;margin-top:8px;padding-top:8px;border-top:1px solid #E2E8F0">';
  [{c:'#16A34A',l:'OK'},{c:'#F59E0B',l:'En curso'},{c:'#EF4444',l:'Rechazo'},{c:'#CBD5E1',l:'Pendiente'}].forEach(function(lg){
    dotHTML+='<div style="display:flex;align-items:center;gap:4px"><div style="width:8px;height:8px;border-radius:50%;background:'+lg.c+'"></div><span style="font-size:9px;color:#64748B">'+lg.l+'</span></div>';

  dotHTML+='</div></div>';
  h+='<div class="dp-full">'+_dpCard('Mapa del parque — Vista de trackers','\ud83d\uddfa\ufe0f',dotHTML)+'</div>';

  // --- TECHNICIANS ---

  var colors2=[{c:'#16A34A',bg:'#DCFCE7'},{c:'#3B82F6',bg:'#DBEAFE'},{c:'#8B5CF6',bg:'#EDE9FE'},{c:'#F59E0B',bg:'#FEF3C7'},{c:'#EF4444',bg:'#FEE2E2'}];
  d.byTech.slice(0,5).forEach(function(t,i){
    var ci=colors2[i%5];

      +'<div style="display:flex;align-items:center;gap:10px">'

      +'<div><div style="font-size:12px;font-weight:600">'+t.name+'</div>'
      +'<div style="font-size:10px;color:#94A3B8">'+t.pilars+' pilares \u00b7 '+t.issues+' incid.</div></div></div>'
      +'<span style="font-size:13px;font-weight:700;color:#059669">'+t.pilars+'</span></div>'
      +'<div style="width:100%;height:7px;border-radius:4px;background:#DCFCE7;overflow:hidden">'

      +'</div></div>';
  });
  h+=_dpCard('Rendimiento por t\u00e9cnico','\ud83d\udc77',techHTML2||'<div style="color:#94A3B8;font-size:12px;text-align:center;padding:20px">Sin datos</div>');

  // --- INCIDENTS ---
  var incHTML2='';
  d.incidents.slice(0,6).forEach(function(inc,i){
    incHTML2+='<div style="display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:8px;background:'+(i%2===0?'#FAFBFC':'transparent')+'">'
      +'<div style="width:5px;height:26px;border-radius:3px;background:#EF4444;flex-shrink:0"></div>'

      +' <span style="font-weight:400;color:#94A3B8;margin-left:4px;font-size:10px">'+inc.pv+'</span></div>'

      +'<div style="text-align:right;flex-shrink:0"><div style="font-size:10px;color:#94A3B8">'+inc.tech+'</div>'
      +'<div style="font-size:9px;color:#94A3B8">'+inc.date+'</div></div></div>';
  });
  if(!incHTML2)incHTML2='<div style="color:#94A3B8;font-size:12px;text-align:center;padding:20px">Sin incidencias</div>';
  h+=_dpCard('Incidencias recientes','\u26a0\ufe0f',incHTML2);

  h+='</div>';
  el.innerHTML=h;
  setTimeout(function(){
    if(typeof Chart==='undefined')return;
    try{
    var bCtx=document.getElementById('dp-daily');
    if(bCtx){
      var bc=new Chart(bCtx,{type:'bar',data:{
        labels:d.daily.map(function(x){return x.date}),
        datasets:[{data:d.daily.map(function(x){return x.count}),
          backgroundColor:d.daily.map(function(x){return x.count>25?'#16A34A':x.count>15?'#059669':x.count>0?'#94D3AC':'#E2E8F0'}),
          borderRadius:4,maxBarThickness:14}]
      },options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:function(ctx){return ctx.raw+' registros'}}}},
        scales:{x:{grid:{display:false},ticks:{font:{size:8},color:'#94A3B8',maxRotation:0,autoSkip:true,maxTicksLimit:8}},
          y:{grid:{color:'#F1F5F9'},ticks:{font:{size:9},color:'#94A3B8'}}}}});
      _dpCharts.push(bc);
    }
    }catch(chartErr){DBG('Chart render error: '+chartErr.message)}
  },50);
}

function _dpLegendItem(color,label,val){
  return '<div style="display:flex;align-items:center;gap:8px">'
    +'<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:'+color+'"></span>'
    +'<span style="font-size:11px;color:#64748B;width:72px">'+label+'</span>'
    +'<span style="font-size:13px;font-weight:700;color:#1E293B">'+val+'</span></div>';
}

function dpPvs(el,d){
  var h='';
  d.byPv.forEach(function(pv){
    var pct=pv.total>0?Math.round(pv.done/pv.total*100):0;
    var pilPct=pv.pilTotal>0?Math.round(pv.pilDone/pv.pilTotal*100):0;
    var barColor=pct>=80?'#16A34A':pct>=40?'#059669':'#94A3B8';
    var barBg=pct>=80?'#DCFCE7':pct>=40?'#D1FAE5':'#F1F5F9';

    h+='<div style="margin-bottom:16px">';
    h+='<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px">';
    h+='<div style="display:flex;align-items:center;gap:10px">';
    h+='<span style="font-size:14px;font-weight:700;color:'+barColor+';width:48px">'+pv.pv+'</span>';
    h+='<span style="font-size:11px;color:#94A3B8">'+pv.done+'/'+pv.total+' trackers · '+pv.pilDone+'/'+pv.pilTotal+' pilares</span></div>';
    h+='<div style="display:flex;align-items:center;gap:10px">';
    if(pv.issues>0)h+='<span style="font-size:10px;color:#EF4444;font-weight:600">'+pv.issues+' incid.</span>';
    h+='<span style="font-size:15px;font-weight:700;color:'+barColor+'">'+pilPct+'%</span></div></div>';
    // Bar
    h+='<div style="position:relative">';
    h+='<div style="width:100%;height:10px;border-radius:5px;background:'+barBg+';overflow:hidden">';
    h+='<div style="height:100%;border-radius:5px;background:linear-gradient(90deg,'+barColor+','+barColor+'dd);width:'+pilPct+'%;transition:width .8s"></div></div>';
    h+='</div></div>';
  });

  el.innerHTML=_dpCard('Avance por subcampo fotovoltaico','⚡',h);
}

function dpTeam(el,d){
  var colors=[{c:'#16A34A',g:'#059669'},{c:'#3B82F6',g:'#2563EB'},{c:'#8B5CF6',g:'#7C3AED'},{c:'#F59E0B',g:'#D97706'},{c:'#EC4899',g:'#DB2777'}];
  var h='<div class="dp-grid2">';

  d.byTech.forEach(function(t,i){
    var ci=colors[i%5];
    var effPct=t.started>0?Math.round(t.done/t.started*100):0;
    var effColor=effPct>=80?'#16A34A':effPct>=60?'#F59E0B':'#EF4444';
    var effBg=effPct>=80?'#DCFCE7':effPct>=60?'#FEF3C7':'#FEE2E2';

    h+='<div style="background:#fff;border-radius:14px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid #E2E8F0">';
    // Avatar + name
    h+='<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">';
    h+='<div style="width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,'+ci.c+','+ci.g+');display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#fff">'+t.name.charAt(0)+'</div>';
    h+='<div><div style="font-size:14px;font-weight:700">'+t.name+'</div>';
    h+='<div style="font-size:11px;color:#94A3B8">Técnico de campo</div></div></div>';
    // Stats
    h+='<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px">';
    h+='<div style="background:#DCFCE7;border-radius:8px;padding:8px;text-align:center"><div style="font-size:18px;font-weight:700;color:#16A34A">'+t.done+'</div><div style="font-size:9px;color:#94A3B8">Validados</div></div>';
    h+='<div style="background:#DBEAFE;border-radius:8px;padding:8px;text-align:center"><div style="font-size:18px;font-weight:700;color:#3B82F6">'+t.pilars+'</div><div style="font-size:9px;color:#94A3B8">Pilares</div></div>';
    h+='<div style="background:#FEE2E2;border-radius:8px;padding:8px;text-align:center"><div style="font-size:18px;font-weight:700;color:#EF4444">'+t.issues+'</div><div style="font-size:9px;color:#94A3B8">Incidencias</div></div>';
    h+='</div>';
    // Efficiency bar
    h+='<div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="font-size:10px;color:#94A3B8">Eficacia</span><span style="font-size:12px;font-weight:700;color:'+effColor+'">'+effPct+'%</span></div>';
    h+='<div style="width:100%;height:7px;border-radius:4px;background:'+effBg+';overflow:hidden"><div style="height:100%;border-radius:4px;background:'+effColor+';width:'+effPct+'%;transition:width .8s"></div></div>';
    h+='</div>';
  });

  if(d.byTech.length===0)h+='<div style="grid-column:1/-1;color:#94A3B8;text-align:center;padding:30px">Sin datos de técnicos</div>';
  h+='</div>';
  el.innerHTML=h;
}

function dpIncidents(el,d){
  var h='<div style="overflow-x:auto;-webkit-overflow-scrolling:touch"><table style="width:100%;border-collapse:separate;border-spacing:0 3px;font-size:12px;min-width:480px">';
  h+='<thead><tr>';
  ['Tracker','PV','Campo afectado','Técnico','Fecha'].forEach(function(hd){
    h+='<th style="text-align:left;padding:8px 10px;font-size:10px;font-weight:600;color:#94A3B8;text-transform:uppercase;letter-spacing:.05em;border-bottom:2px solid #E2E8F0">'+hd+'</th>';
  });
  h+='</tr></thead><tbody>';

  d.incidents.forEach(function(inc,i){
    var bg=i%2===0?'#FAFBFC':'transparent';
    h+='<tr>';
    h+='<td style="padding:9px 10px;font-weight:600;color:#EF4444;background:'+bg+';border-radius:'+(i%2===0?'8px 0 0 8px':'0')+'">'+inc.tracker+'</td>';
    h+='<td style="padding:9px 10px;background:'+bg+'"><span style="background:#DBEAFE;color:#3B82F6;padding:2px 7px;border-radius:5px;font-size:10px;font-weight:600">'+inc.pv+'</span></td>';
    h+='<td style="padding:9px 10px;color:#64748B;background:'+bg+'">'+inc.field+'</td>';
    h+='<td style="padding:9px 10px;background:'+bg+'">'+inc.tech+'</td>';
    h+='<td style="padding:9px 10px;color:#94A3B8;background:'+bg+';border-radius:'+(i%2===0?'0 8px 8px 0':'0')+'">'+inc.date+'</td>';
    h+='</tr>';
  });

  if(d.incidents.length===0)h+='<tr><td colspan="5" style="text-align:center;padding:30px;color:#94A3B8">Sin incidencias registradas</td></tr>';
  h+='</tbody></table></div>';

  el.innerHTML=_dpCard('Registro de incidencias','⚠️',h);
}


// ============================================================
// ROUTER
// ============================================================
function R(){
  DBG('R() screen='+V.screen);
  var a=document.getElementById('app');
  try{
  var routes={
    loading:rLoading,
    login:rLogin,
    register:rRegister,
    modesel:rModeSel,
    conselect:rConSelect,
    contractor:rConTracker,
    condetail:rConDetail,
    calselect:rCalSelect,
    qualtracker:rQualTracker,
    caldetail:rCalDetail,
    resumen:rResumen,map:rMap,dashpro:rDashPro,
    admin:rAdmin
  };
  var fn=routes[V.screen];
  if(fn)fn(a);
  else{V.screen='modesel';rModeSel(a)}
  }catch(rErr){a.innerHTML='<div style="padding:40px;color:#ef4444"><h2>Error</h2><p>'+rErr.message+'</p><pre style="font-size:10px;color:#8b8fa3;margin-top:8px;white-space:pre-wrap">'+rErr.stack+'</pre><button onclick="V.screen=\'modesel\';R()" style="margin-top:12px;padding:10px 20px;background:#3ecf8e;color:#000;border:none;border-radius:8px;font-weight:700;cursor:pointer">Reintentar</button></div>'}
}

// Prevent accidental back navigation
window.addEventListener('popstate',function(e){
  if(V.screen==='contractor'||V.screen==='qualtracker'){
    history.pushState(null,null);
  }
});
history.pushState(null,null);

// Unregister old service workers to force fresh load
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(function(regs){
    regs.forEach(function(r){r.unregister()});
  });
  setTimeout(function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  },2000);
}

// Start
DBG('Calling R() first time, screen='+V.screen);
R();
</script>
