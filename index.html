<!DOCTYPE html>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

<style>
:root{--bg:#0f1117;--sf:#1c1f2a;--sf2:#232636;--bd:#2a2d3a;--tx:#e8eaed;--td:#8b8fa3;--tx3:#565a6e;--ac:#3ecf8e;--ok:#22c55e;--no:#ef4444;--warn:#f59e0b;--info:#3b82f6;--purple:#a78bfa}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;overflow-x:hidden}
input,select,textarea,button{font-family:inherit;outline:none}
.hide{display:none!important}

/* Layout */
.hdr{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--bg);z-index:10}
.hdr h1{font-size:17px;letter-spacing:-.3px}
.hdr .sub{font-size:11px;color:var(--td)}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:6px}
.cnt{padding:0 16px 80px}
.btn-icon{width:38px;height:38px;border-radius:10px;border:1px solid var(--bd);background:var(--sf);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--td);font-size:16px}

/* Forms */
.inp{width:100%;height:46px;border-radius:10px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);padding:0 14px;font-size:14px}
.inp:focus{border-color:var(--ac)}
.sel{width:100%;height:46px;border-radius:10px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);padding:0 14px;font-size:14px;appearance:none}
.ta{width:100%;border-radius:10px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);padding:10px 14px;font-size:13px;resize:vertical}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:10px}
.stitle{font-size:11px;font-weight:700;color:var(--td);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 6px}

/* Progress */
.prog{width:100%;height:6px;border-radius:3px;background:var(--bd);overflow:hidden}
.prog-f{height:100%;border-radius:3px;transition:width .8s ease}
.done{background:var(--ok)!important}

/* Buttons */
.btn{width:100%;padding:14px;border-radius:12px;font-size:15px;font-weight:700;border:none;cursor:pointer;transition:all .2s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--ac);color:#000}
.btn-danger{background:var(--no);color:#fff}
.btn-info{background:var(--info);color:#fff}
.btn-warn{background:var(--warn);color:#000}
.btn-ghost{background:transparent;border:1px solid var(--bd);color:var(--td)}

/* Mode cards */
.mode-card{width:100%;max-width:340px;padding:28px 20px;border-radius:16px;color:#fff;font-size:18px;font-weight:700;cursor:pointer;text-align:left;border:2px solid;transition:transform .2s}
.mode-card:active{transform:scale(.97)}

/* Tracker list */
.tr-item{display:block;width:100%;text-align:left;padding:12px;border-radius:10px;background:var(--sf);border:1px solid var(--bd);margin-bottom:6px;cursor:pointer;transition:border-color .2s}
.tr-item:active{border-color:var(--ac)}

/* Status badges */
.badge{font-size:10px;padding:3px 8px;border-radius:10px;font-weight:600;display:inline-flex;align-items:center;gap:3px}

/* Punchlist */
.pl-item{padding:12px;border-radius:10px;background:var(--sf);border:1px solid var(--bd);margin-bottom:6px}

/* Online indicator */
.online-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}
.online-dot.on{background:var(--ok);animation:pulse 2s infinite}
.online-dot.off{background:var(--no)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* Login */
.login-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.login-card{width:100%;max-width:360px;padding:32px 24px;border-radius:20px;background:var(--sf);border:1px solid var(--bd)}
.login-logo{font-size:11px;letter-spacing:3px;color:var(--tx3);text-transform:uppercase;text-align:center;margin-bottom:8px}
.login-title{font-size:24px;font-weight:700;text-align:center;margin-bottom:4px}
.login-sub{font-size:12px;color:var(--td);text-align:center;margin-bottom:24px}
.login-err{font-size:12px;color:var(--no);text-align:center;margin-top:8px;min-height:18px}

/* Toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:999;transition:opacity .3s;pointer-events:none}
</style>
</head>

<div id="toast" class="toast" style="opacity:0"></div>

<script>

firebase.initializeApp({

// ============================================================
// HELPERS
// ============================================================
function toast(msg,color){
  var t=document.getElementById('toast');
  t.textContent=msg;t.style.background=color||'var(--sf)';t.style.color=color?'#fff':'var(--tx)';
  t.style.opacity=1;setTimeout(function(){t.style.opacity=0},3000);
}

function isAdmin(){return U&&(U.role==='admin'||ADMIN_EMAILS.indexOf(U.email)>=0)}
function isCon(){return U&&(U.role==='construccion'||isAdmin())}
function isCal(){return U&&(U.role==='calidad'||isAdmin())}

// Firebase write helper
function fbSet(path,val){return db.ref(path).set(val)}
function fbPush(path,val){return db.ref(path).push(val)}
function fbGet(path){return db.ref(path).once('value').then(function(s){return s.val()})}
function fbListen(path,cb){db.ref(path).on('value',function(s){cb(s.val())})}

// ============================================================
// AUTH
// ============================================================
function rLogin(a){
  var h='<div class="login-wrap">';
  h+='<div class="login-card">';
  h+='<div class="login-logo">XAMAI · X-ELIO</div>';
  h+='<div class="login-title">ISFV ATALAYA</div>';
  h+='<div class="login-sub">Checklist Solar v2</div>';
  h+='<input class="inp" id="l-email" type="email" placeholder="Email" style="margin-bottom:8px">';
  h+='<input class="inp" id="l-pass" type="password" placeholder="Contraseña" style="margin-bottom:14px">';
  h+='<button class="btn btn-primary" onclick="doLogin()">Entrar</button>';
  h+='<div class="login-err" id="l-err"></div>';
  h+='<div style="text-align:center;margin-top:16px">';
  h+='<button onclick="V.screen=\'register\';R()" style="background:none;border:none;color:var(--ac);font-size:12px;cursor:pointer">¿Primera vez? Crear cuenta</button>';
  h+='</div></div></div>';
  a.innerHTML=h;
}

function rRegister(a){
  var h='<div class="login-wrap">';
  h+='<div class="login-card">';
  h+='<div class="login-title" style="font-size:20px">Crear Cuenta</div>';
  h+='<div class="login-sub">Pide las credenciales a tu supervisor</div>';
  h+='<input class="inp" id="r-name" type="text" placeholder="Nombre completo" style="margin-bottom:8px">';
  h+='<input class="inp" id="r-email" type="email" placeholder="Email" style="margin-bottom:8px">';
  h+='<input class="inp" id="r-pass" type="password" placeholder="Contraseña (mín 6 caracteres)" style="margin-bottom:8px">';
  h+='<select class="sel" id="r-role" style="margin-bottom:14px">';
  h+='<option value="construccion">Construcción</option>';
  h+='<option value="calidad">Calidad</option>';
  h+='<option value="supervisor">Supervisor</option>';
  h+='</select>';
  h+='<button class="btn btn-primary" onclick="doRegister()">Crear cuenta</button>';
  h+='<div class="login-err" id="r-err"></div>';
  h+='<div style="text-align:center;margin-top:16px">';
  h+='<button onclick="V.screen=\'login\';R()" style="background:none;border:none;color:var(--td);font-size:12px;cursor:pointer">← Volver al login</button>';
  h+='</div></div></div>';
  a.innerHTML=h;
}

function doLogin(){
  var email=document.getElementById('l-email').value.trim();
  var pass=document.getElementById('l-pass').value;
  document.getElementById('l-err').textContent='Conectando...';
  auth.signInWithEmailAndPassword(email,pass).catch(function(e){
    var msg=e.code==='auth/user-not-found'?'Usuario no encontrado':e.code==='auth/wrong-password'?'Contraseña incorrecta':'Error: '+e.message;
    document.getElementById('l-err').textContent=msg;
  });
}

function doRegister(){
  var name=document.getElementById('r-name').value.trim();
  var email=document.getElementById('r-email').value.trim();
  var pass=document.getElementById('r-pass').value;
  var role=document.getElementById('r-role').value;
  if(!name||!email||!pass){document.getElementById('r-err').textContent='Rellena todos los campos';return}
  document.getElementById('r-err').textContent='Creando cuenta...';
  auth.createUserWithEmailAndPassword(email,pass).then(function(cred){
    return db.ref('users/'+cred.user.uid).set({name:name,email:email,role:role,created:Date.now()});
  }).catch(function(e){
    document.getElementById('r-err').textContent=e.message;
  });
}

// Auth state listener
auth.onAuthStateChanged(function(user){
  if(user){
    db.ref('users/'+user.uid).once('value').then(function(snap){
      var data=snap.val()||{};
      U={uid:user.uid,email:user.email,name:data.name||user.email,role:data.role||'calidad'};
      V.screen='modesel';
      R();
      toast('Bienvenido, '+U.name,'var(--ac)');
      initListeners();
    });
  }else{
    U=null;
    V.screen='login';
    R();
  }
});

// ============================================================
// REALTIME LISTENERS
// ============================================================
function initListeners(){
  // Listen to workflow changes
  db.ref('workflow').on('value',function(s){
    CACHE.workflow=s.val()||{};
    // Re-render if on a workflow-dependent screen
    if(V.screen==='resumen'||V.screen==='condetail'||V.screen==='caldetail')R();
  });
  
  // Listen to punchlist changes
  db.ref('punchlist').on('value',function(s){
    CACHE.punchlist=s.val()||{};
    if(V.screen==='condetail'||V.screen==='caldetail')R();
  });
}

// ============================================================
// WORKFLOW
// ============================================================
var WF_STATES={
  CON:{l:'En construcción',c:'var(--info)',i:'🏗️',bg:'rgba(59,130,246,.15)'},
  REV:{l:'Pdte revisión',c:'var(--warn)',i:'📋',bg:'rgba(245,158,11,.15)'},
  CAL:{l:'En revisión',c:'var(--purple)',i:'🔍',bg:'rgba(167,139,250,.15)'},
  OK:{l:'Completado',c:'var(--ac)',i:'✅',bg:'rgba(34,197,94,.15)'},
  PUN:{l:'Punchlist',c:'var(--no)',i:'📝',bg:'rgba(239,68,68,.15)'},
  REP:{l:'En reparación',c:'var(--warn)',i:'🔧',bg:'rgba(245,158,11,.15)'},
  RREV:{l:'Pdte re-revisión',c:'var(--warn)',i:'📋',bg:'rgba(245,158,11,.15)'}
};
var WF_PHASES=['hincado','montaje','modulos'];
var WF_LABELS={hincado:'Hincado',montaje:'Montaje Estructura',modulos:'Montaje Módulos'};

function getWFState(pv,sub,phase){
  var wf=CACHE.workflow||{};
  var key=pv+'_'+sub+'_'+phase;
  return wf[key]||{state:'CON',since:0,by:'',trigger:'init'};
}

function setWFState(pv,sub,phase,state,trigger){
  var key=pv+'_'+sub+'_'+phase;
  var data={state:state,since:firebase.database.ServerValue.TIMESTAMP,by:U.name,trigger:trigger||'manual',uid:U.uid};
  db.ref('workflow/'+key).set(data);
  // Log
  db.ref('workflow_log').push({key:key,state:state,by:U.name,uid:U.uid,trigger:trigger,ts:firebase.database.ServerValue.TIMESTAMP});
  toast('Estado: '+WF_STATES[state].i+' '+WF_STATES[state].l,'var(--sf)');
}

function wfBadge(pv,sub,phase){
  var wf=getWFState(pv,sub,phase);
  var st=WF_STATES[wf.state]||WF_STATES.CON;
  return '<span class="badge" style="background:'+st.bg+';color:'+st.c+'">'+st.i+' '+st.l+'</span>';
}

// ============================================================
// PUNCHLIST
// ============================================================
function getPLItems(pv,sub,phase){
  var pl=CACHE.punchlist||{};
  var items=[];
  Object.keys(pl).forEach(function(id){
    var p=pl[id];
    if(String(p.pv)===String(pv)&&String(p.sub)===String(sub)&&p.phase===phase){
      items.push({id:id,d:p});
    }
  });
  return items;
}

function addPLItem(pv,sub,phase,tracker,pilar,campo,desc){
  db.ref('punchlist').push({
    pv:pv,sub:sub,phase:phase,tracker:tracker,pilar:pilar,campo:campo,desc:desc,
    estado:'pendiente',
    detectadoPor:U.name,uid:U.uid,fechaDeteccion:firebase.database.ServerValue.TIMESTAMP
  });
  toast('Añadido al punchlist','var(--no)');
}

function setPLEstado(id,estado){
  var updates={estado:estado};
  if(estado==='reparado'){updates.reparadoPor=U.name;updates.reparadoUid=U.uid;updates.fechaReparacion=firebase.database.ServerValue.TIMESTAMP}
  if(estado==='verificado'){updates.verificadoPor=U.name;updates.verificadoUid=U.uid;updates.fechaVerificacion=firebase.database.ServerValue.TIMESTAMP}
  db.ref('punchlist/'+id).update(updates);
  toast(estado==='reparado'?'Marcado como reparado':'Verificado','var(--ac)');
}

// ============================================================
// CONSTRUCTION DATA (Firebase)
// ============================================================
function setConField(code,key,val){
  db.ref('construction/'+code+'/'+key).set(val);
  db.ref('construction/'+code+'/'+key+'_ts').set(firebase.database.ServerValue.TIMESTAMP);
  db.ref('construction/'+code+'/'+key+'_by').set(U.name);
  // Log
  db.ref('con_log').push({tracker:code,field:key,value:val,by:U.name,uid:U.uid,ts:firebase.database.ServerValue.TIMESTAMP});
}

function getConData(code,cb){
  db.ref('construction/'+code).once('value',function(s){cb(s.val()||{})});
}

// ============================================================
// QUALITY DATA (Firebase)
// ============================================================
function setQualField(code,key,val){
  db.ref('quality/'+code+'/'+key).set(val);
  db.ref('quality_log').push({tracker:code,field:key,value:String(val),by:U.name,uid:U.uid,ts:firebase.database.ServerValue.TIMESTAMP});
}

function getQualData(code,cb){
  db.ref('quality/'+code).once('value',function(s){cb(s.val()||{})});
}

// ============================================================
// SCREENS
// ============================================================

// MODE SELECT
function rModeSel(a){
  var h='<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;gap:12px">';
  h+='<div class="login-logo">XAMAI · X-ELIO</div>';
  h+='<div style="font-size:22px;font-weight:700;margin-bottom:4px">ISFV ATALAYA</div>';
  h+='<div style="font-size:12px;color:var(--td);margin-bottom:16px"><span class="online-dot on"></span>'+U.name+' · '+U.role+'</div>';
  
  if(isCon()){
    h+='<button class="mode-card" onclick="V.screen=\'conselect\';R()" style="background:linear-gradient(135deg,#1e3a5f,#2563eb);border-color:#3b82f6">';
    h+='<div style="font-size:28px;margin-bottom:8px">🏗️</div><div>Construcción</div>';
    h+='<div style="font-size:12px;font-weight:400;opacity:.7;margin-top:4px">Hincado de pilares</div></button>';
  }
  
  if(isCal()){
    h+='<button class="mode-card" onclick="V.screen=\'calselect\';R()" style="background:linear-gradient(135deg,#1a3f2e,#16a34a);border-color:#22c55e">';
    h+='<div style="font-size:28px;margin-bottom:8px">✅</div><div>Calidad</div>';
    h+='<div style="font-size:12px;font-weight:400;opacity:.7;margin-top:4px">Cimentaciones · Montaje · Módulos</div></button>';
  }
  
  if(isAdmin()||U.role==='supervisor'){
    h+='<button class="mode-card" onclick="V.screen=\'resumen\';R()" style="background:linear-gradient(135deg,#1a1f3a,#6366f1);border-color:#818cf8">';
    h+='<div style="font-size:28px;margin-bottom:8px">📊</div><div>Resumen</div>';
    h+='<div style="font-size:12px;font-weight:400;opacity:.7;margin-top:4px">Avance construcción + calidad</div></button>';
  }
  
  if(isAdmin()){
    h+='<button class="mode-card" onclick="window.open(\'dashboard.html\',\'_blank\')" style="background:var(--sf);border-color:var(--bd);color:var(--td);font-size:14px;padding:16px 20px">';
    h+='📈 Dashboard</button>';
    h+='<button class="mode-card" onclick="V.screen=\'admin\';R()" style="background:transparent;border-color:var(--bd);color:var(--tx3);font-size:12px;padding:12px 20px">';
    h+='⚙️ Admin</button>';
  }
  
  h+='<button onclick="auth.signOut()" style="background:none;border:none;color:var(--tx3);font-size:11px;cursor:pointer;margin-top:12px">Cerrar sesión</button>';
  h+='</div>';
  a.innerHTML=h;
}

// CONSTRUCTION SELECT (PV → Sub → Tracker)
function rConSelect(a){
  var pvs=[...new Set(Object.values(MASTER_DATA).map(function(d){return d.pv}))].sort(function(a2,b){return a2-b});
  var h='<div class="hdr"><button class="btn-icon" onclick="V.screen=\'modesel\';R()">←</button><div><h1>🏗️ Construcción</h1><div class="sub">Selecciona zona</div></div></div>';
  h+='<div class="cnt" style="padding-top:14px">';
  h+='<div class="stitle">PV</div><select class="sel" id="csp" onchange="V.conPv=parseInt(this.value);V.conSub=0;renderConSubs()"><option value="">Selecciona PV</option>';
  pvs.forEach(function(p){h+='<option value="'+p+'"'+(V.conPv===p?' selected':'')+'>PV'+String(p).padStart(2,'0')+'</option>'});
  h+='</select>';
  h+='<div id="con-subs" style="margin-top:12px"></div>';
  h+='<div id="con-list" style="margin-top:12px"></div>';
  h+='</div>';
  a.innerHTML=h;
  if(V.conPv)renderConSubs();
}

function renderConSubs(){
  var pv=V.conPv||0;
  var subsEl=document.getElementById('con-subs');
  var listEl=document.getElementById('con-list');
  if(!pv){subsEl.innerHTML='';listEl.innerHTML='';return}
  
  var subs=[...new Set(Object.values(MASTER_DATA).filter(function(d){return d.pv===pv&&d.sub>0}).map(function(d){return d.sub}))].sort(function(a,b){return a-b});
  
  if(subs.length>0&&!V.conSub){
    // Show subcampo cards
    var h='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px">';
    subs.forEach(function(s){
      h+='<button onclick="V.conSub='+s+';renderConList()" style="padding:12px;border-radius:10px;background:var(--sf);border:2px solid var(--bd);cursor:pointer;text-align:center">';
      h+='<div style="font-weight:700;font-size:14px;color:var(--tx)">Sub '+s+'</div>';
      h+='<div style="margin-top:4px">'+wfBadge(pv,s,'hincado')+'</div>';
      h+='</button>';
    });
    h+='</div>';
    subsEl.innerHTML=h;
    listEl.innerHTML='';
  }else{
    subsEl.innerHTML=subs.length>0?'<select class="sel" onchange="V.conSub=parseInt(this.value);renderConList()"><option value="">Subcampo</option>'+subs.map(function(s){return'<option value="'+s+'"'+(V.conSub===s?' selected':'')+'>Sub '+s+'</option>'}).join('')+'</select>':'';
    renderConList();
  }
}

function renderConList(){
  var pv=V.conPv,sub=V.conSub||0;
  var listEl=document.getElementById('con-list');
  if(!listEl||!pv)return;
  
  var codes=Object.keys(MASTER_DATA).filter(function(code){
    var d=MASTER_DATA[code];
    return d.pv===pv&&(!sub||d.sub===sub);
  }).sort();
  
  // Workflow button
  var h='';
  if(sub){
    h+='<button onclick="V.screen=\'condetail\';R()" class="btn btn-ghost" style="margin-bottom:10px;font-size:13px">📋 Workflow · '+wfBadge(pv,sub,'hincado')+'</button>';
  }
  
  codes.forEach(function(code){
    var d=MASTER_DATA[code];
    h+='<button class="tr-item" onclick="V.conTr=\''+code+'\';V.screen=\'contractor\';V.conPi=0;V.conFila=\'motor\';R()">';
    h+='<div style="display:flex;justify-content:space-between;align-items:center">';

// QUALITY SELECT
function rCalSelect(a){
  var pvs=[...new Set(Object.values(MASTER_DATA).map(function(d){return d.pv}))].sort(function(a2,b){return a2-b});
  var h='<div class="hdr"><button class="btn-icon" onclick="V.screen=\'modesel\';R()">←</button><div><h1>✅ Calidad</h1><div class="sub">Selecciona zona</div></div></div>';
  h+='<div class="cnt" style="padding-top:14px">';

  pvs.forEach(function(p){h+='<option value="'+p+'"'+(V.calPv===p?' selected':'')+'>PV'+String(p).padStart(2,'0')+'</option>'});
  h+='</select>';
  h+='<div id="cal-subs" style="margin-top:12px"></div>';

function renderCalSubs(){
  var pv=V.calPv||0;
  var subsEl=document.getElementById('cal-subs');
  var listEl=document.getElementById('cal-list');
  if(!pv){subsEl.innerHTML='';listEl.innerHTML='';return}
  
  var subs=[...new Set(Object.values(MASTER_DATA).filter(function(d){return d.pv===pv&&d.sub>0}).map(function(d){return d.sub}))].sort(function(a,b){return a-b});
  
  if(subs.length>0&&!V.calSub){
    var h='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px">';
    subs.forEach(function(s){
      h+='<button onclick="V.calSub='+s+';renderCalList()" style="padding:12px;border-radius:10px;background:var(--sf);border:2px solid var(--bd);cursor:pointer;text-align:center">';
      h+='<div style="font-weight:700;font-size:14px;color:var(--tx)">Sub '+s+'</div>';
      h+='<div style="margin-top:4px">'+wfBadge(pv,s,'hincado')+'</div>';
      h+='</button>';
    });
    h+='</div>';
    subsEl.innerHTML=h;
    listEl.innerHTML='';
  }else{
    subsEl.innerHTML=subs.length>0?'<select class="sel" onchange="V.calSub=parseInt(this.value);renderCalList()"><option value="">Subcampo</option>'+subs.map(function(s){return'<option value="'+s+'"'+(V.calSub===s?' selected':'')+'>Sub '+s+'</option>'}).join('')+'</select>':'';
    renderCalList();
  }
}

function renderCalList(){
  var pv=V.calPv,sub=V.calSub||0;
  var listEl=document.getElementById('cal-list');
  if(!listEl||!pv)return;
  
  var codes=Object.keys(MASTER_DATA).filter(function(code){
    var d=MASTER_DATA[code];
    return d.pv===pv&&(!sub||d.sub===sub);
  }).sort();
  
  var h='';
  if(sub){
    h+='<button onclick="V.screen=\'caldetail\';V.calPv='+pv+';V.calSub='+sub+';R()" class="btn btn-ghost" style="margin-bottom:10px;font-size:13px">📋 Workflow · '+wfBadge(pv,sub,'hincado')+'</button>';
  }
  
  codes.forEach(function(code){
    var d=MASTER_DATA[code];
    h+='<button class="tr-item" onclick="V.calTr=\''+code+'\';V.screen=\'qualtracker\';R()">';
    h+='<div style="display:flex;justify-content:space-between;align-items:center">';
    h+='<div><span style="font-weight:700;font-size:18px;margin-right:8px">'+d.num+'</span><span style="font-size:11px;color:var(--td)">'+d.type+'</span></div>';
    h+='</div></button>';
  });
  
  listEl.innerHTML=h;
}

// RESUMEN
function rResumen(a){
  var pvs=[...new Set(Object.values(MASTER_DATA).map(function(d){return d.pv}))].sort(function(a2,b){return a2-b});
  var h='<div class="hdr"><button class="btn-icon" onclick="V.screen=\'modesel\';R()">←</button><div><h1>📊 Resumen</h1><div class="sub">Construcción + Calidad</div></div></div>';
  h+='<div class="cnt" style="padding-top:14px">';
  h+='<select class="sel" id="resPv" onchange="V.resPv=parseInt(this.value);renderResumen()"><option value="">Selecciona PV</option>';
  pvs.forEach(function(p){h+='<option value="'+p+'"'+(V.resPv===p?' selected':'')+'>PV'+String(p).padStart(2,'0')+'</option>'});
  h+='</select>';
  h+='<div id="res-content" style="margin-top:12px"></div>';
  h+='</div>';
  a.innerHTML=h;
  if(V.resPv)renderResumen();
}

function renderResumen(){
  var pv=V.resPv;
  var el=document.getElementById('res-content');
  if(!pv){el.innerHTML='';return}
  
  var subs=[...new Set(Object.values(MASTER_DATA).filter(function(d){return d.pv===pv&&d.sub>0}).map(function(d){return d.sub}))].sort(function(a,b){return a-b});
  if(subs.length===0)subs=[0];
  
  var h='';
  subs.forEach(function(sub){
    h+='<div class="card">';
    h+='<div style="font-weight:700;font-size:16px;margin-bottom:8px">'+(sub?'Subcampo '+sub:'PV'+String(pv).padStart(2,'0'))+'</div>';
    
    WF_PHASES.forEach(function(phase){
      h+='<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd)">';
      h+='<div style="font-size:12px;flex:1">'+WF_LABELS[phase]+'</div>';
      h+=wfBadge(pv,sub,phase);
      h+='</div>';
    });
    h+='</div>';
  });
  el.innerHTML=h;
}

// ADMIN
function rAdmin(a){
  var h='<div class="hdr"><button class="btn-icon" onclick="V.screen=\'modesel\';R()">←</button><div><h1>⚙️ Admin</h1></div></div>';
  h+='<div class="cnt" style="padding-top:14px">';
  h+='<div class="card"><div style="font-weight:700;margin-bottom:8px">Usuario</div>';
  h+='<div style="font-size:13px">'+U.name+'</div>';
  h+='<div style="font-size:11px;color:var(--td)">'+U.email+' · '+U.role+'</div></div>';
  h+='<div class="card"><div style="font-weight:700;margin-bottom:8px">Firebase</div>';
  h+='<div style="font-size:11px;color:var(--td)">Proyecto: construccionxamai</div>';
  h+='<div style="font-size:11px;color:var(--td)">DB: europe-west1</div>';
  h+='<div style="font-size:11px;color:var(--ac);margin-top:4px"><span class="online-dot on"></span>Conectado en tiempo real</div></div>';
  h+='</div>';
  a.innerHTML=h;
}

// LOADING
function rLoading(a){
  a.innerHTML='<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;color:var(--td)"><div style="text-align:center"><div style="font-size:24px;margin-bottom:12px">⏳</div><div>Conectando...</div></div></div>';
}

// ============================================================
// ROUTER
// ============================================================
function R(){
  var a=document.getElementById('app');
  var routes={
    loading:rLoading,
    login:rLogin,
    register:rRegister,
    modesel:rModeSel,
    conselect:rConSelect,
    contractor:rConTracker,
    condetail:rConDetail,
    calselect:rCalSelect,
    qualtracker:rQualTracker,
    caldetail:rCalDetail,
    resumen:rResumen,
    admin:rAdmin
  };
  var fn=routes[V.screen];
  if(fn)fn(a);
  else{V.screen='modesel';rModeSel(a)}
}

// Start
R();
</script>
</body>
</html>
