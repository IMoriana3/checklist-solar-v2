<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard — ISFV ATALAYA</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="master.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:#0f1117;color:#e8eaed;min-height:100vh}
.top{display:flex;align-items:center;justify-content:space-between;padding:20px 28px;border-bottom:1px solid #2a2d3a}
.top h1{font-size:22px;font-weight:700}
.badge{font-size:11px;padding:4px 10px;border-radius:20px;font-weight:600}
.tabs{display:flex;padding:0 28px;border-bottom:1px solid #2a2d3a}
.tab{padding:12px 24px;font-size:14px;font-weight:600;border:none;cursor:pointer;border-bottom:2px solid transparent;color:#8b8fa3;background:transparent}
.tab.on{color:#3b82f6;border-bottom-color:#3b82f6}
.grid{display:grid;gap:16px;padding:20px 28px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}
@media(max-width:900px){.g4,.g3,.g2{grid-template-columns:1fr}}
.card{background:#1c1f2a;border:1px solid #2a2d3a;border-radius:14px;padding:20px}
.card-t{font-size:12px;font-weight:600;color:#8b8fa3;text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.pbar{height:6px;border-radius:3px;background:#0f1117;margin-top:12px;overflow:hidden}
.pbar-f{height:100%;border-radius:3px;transition:width 1s}
.sbar{display:flex;border-radius:8px;overflow:hidden;height:32px;margin-top:8px}
.sbar div{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
.trow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #2a2d3a}
.trow:last-child{border-bottom:none}
.inc{padding:10px 12px;border-radius:10px;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.15);margin-bottom:6px}
.pvr{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(42,45,58,.5)}
.pvr:last-child{border-bottom:none}
.login-box{max-width:320px;margin:80px auto;text-align:center;padding:24px}
.login-box input{width:100%;padding:10px;border-radius:8px;background:#1c1f2a;border:1px solid #2a2d3a;color:#e8eaed;margin-bottom:8px;font-family:inherit;font-size:14px}
.login-box button{padding:12px 24px;border-radius:8px;background:#3ecf8e;color:#000;font-weight:700;border:none;cursor:pointer;font-size:14px;font-family:inherit}
#err{color:#ef4444;font-size:12px;margin-top:8px}
</style>
</head>
<body>
<div class="top">
  <div><h1>Dashboard</h1><div style="font-size:12px;color:#8b8fa3;margin-top:2px">ISFV ATALAYA</div></div>
  <span class="badge" id="st" style="background:rgba(245,158,11,.15);color:#f5a623">Cargando...</span>
</div>
<div class="tabs">
  <button class="tab on" onclick="swTab('con',this)">🏗️ Construcción</button>
  <button class="tab" onclick="swTab('cal',this)">✅ Calidad</button>
</div>
<div id="pcon"></div>
<div id="debug" style="position:fixed;bottom:0;left:0;right:0;max-height:150px;overflow-y:auto;background:#000;color:#0f0;font-family:monospace;font-size:10px;padding:8px;z-index:9999;border-top:2px solid #333"></div>
<div id="pcal" style="display:none"></div>

<script>
function dbg(msg){var el=document.getElementById('debug');if(el)el.innerHTML+=new Date().toLocaleTimeString()+' '+msg+'<br>';console.log(msg)}
dbg('Script loaded');

var app=firebase.initializeApp({
  apiKey:"AIzaSyBHKN65MLHScTNN-L5HwfvWqafAkfsFiAU",
  authDomain:"construccionxamai.firebaseapp.com",
  databaseURL:"https://construccionxamai-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:"construccionxamai",
  storageBucket:"construccionxamai.firebasestorage.app",
  messagingSenderId:"71667188901",
  appId:"1:71667188901:web:663c605a1fbe53a3caf94c"
});
var db=firebase.database();
var auth=firebase.auth();
var D={con:null,wf:null,pl:null,qual:null};

function swTab(t,btn){
  document.getElementById('pcon').style.display=t==='con'?'block':'none';
  document.getElementById('pcal').style.display=t==='cal'?'block':'none';
  document.querySelectorAll('.tab').forEach(function(b){b.className='tab'});
  btn.className='tab on';
}

// AUTH
dbg('Waiting for auth...');
auth.onAuthStateChanged(function(user){
  dbg('Auth state: '+(user?'logged in as '+user.email:'NOT logged in'));
  if(user){
    setSt('Cargando datos...','#f5a623');
    dbg('Starting data load...');
    loadAll();
  }else{
    setSt('Login necesario','#ef4444');
    document.getElementById('pcon').innerHTML='<div class="login-box"><div style="font-size:32px;margin-bottom:12px">🔒</div><div style="font-size:16px;font-weight:700;margin-bottom:16px">Inicia sesión</div><input id="em" placeholder="Email"><input id="pw" type="password" placeholder="Contraseña"><button onclick="doLogin()">Entrar</button><div id="err"></div></div>';
  }
});

function doLogin(){
  var em=document.getElementById('em').value;
  var pw=document.getElementById('pw').value;
  document.getElementById('err').textContent='Conectando...';
  dbg('Login attempt: '+em);
  auth.signInWithEmailAndPassword(em,pw).then(function(){dbg('Login success')}).catch(function(e){dbg('Login error: '+e.message);
    document.getElementById('err').textContent=e.message;
  });
}

function setSt(txt,color){
  var el=document.getElementById('st');
  el.textContent=txt;
  el.style.background=color+'22';
  el.style.color=color;
}

// LOAD DATA
function loadAll(){
  var loaded=0;
  function check(){loaded++;if(loaded>=4){setSt('En vivo','#3ecf8e');render()}}
  
  dbg('Subscribing to construction...');
  db.ref('construction').on('value',function(s){dbg('construction: '+Object.keys(s.val()||{}).length+' trackers');D.con=s.val()||{};check();if(loaded>=4)render()},function(e){dbg('construction ERROR: '+e.message);setSt('Error: '+e.message,'#ef4444');check()});
  db.ref('workflow').on('value',function(s){dbg('workflow: OK');D.wf=s.val()||{};check();if(loaded>=4)render()},function(e){check()});
  db.ref('punchlist').on('value',function(s){dbg('punchlist: OK');D.pl=s.val()||{};check();if(loaded>=4)render()},function(e){check()});
  db.ref('quality').on('value',function(s){dbg('quality: '+Object.keys(s.val()||{}).length+' trackers');D.qual=s.val()||{};check();if(loaded>=4)render()},function(e){check()});
  
  // Timeout fallback
  setTimeout(function(){if(loaded<4){setSt('Parcial ('+loaded+'/4)','#f5a623');render()}},10000);
}

function render(){rCon();rCal()}

// HELPERS
function kp(t,v,sub2,pct,c){
  var h='<div class="card"><div class="card-t">'+t+'</div><div style="font-size:36px;font-weight:700;color:'+c+'">'+v+'</div>';
  if(sub2)h+='<div style="font-size:13px;color:#8b8fa3;margin-top:4px">/ '+sub2+'</div>';
  if(pct!==undefined)h+='<div style="position:absolute;top:18px;right:18px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;background:'+c+'22;color:'+c+'">'+pct+'%</div>';
  if(sub2)h+='<div class="pbar"><div class="pbar-f" style="width:'+(pct||0)+'%;background:'+c+'"></div></div>';
  return h+'</div>';
}

// CONSTRUCTION TAB
function rCon(){
  var el=document.getElementById('pcon');
  if(!D.con){el.innerHTML='<div style="padding:40px;text-align:center;color:#8b8fa3">Sin datos</div>';return}
  var tp=0,hk=0,rj=0,byEq={},byPv={},byUs={},rjL=[];
  
  Object.keys(D.con).forEach(function(code){
    var tr=D.con[code];
    var m=typeof MASTER_DATA!=='undefined'?MASTER_DATA[code]:null;
    var pk=m?'PV'+String(m.pv).padStart(2,'0'):'?';
    Object.keys(tr).forEach(function(k){
      var p=k.match(/^(fm|fc)_(\d+)_estado$/);if(!p)return;
      tp++;var e=tr[k],bk=p[1]+'_'+p[2];
      if(e==='hincada')hk++;
      else if(e==='rechazo'){rj++;rjL.push({t:code,p:bk,m:tr[bk+'_motivo']||'Sin motivo',b:tr[bk+'_by']||''})}
      var eq=tr[bk+'_equipo']||'Sin equipo',usr=tr[bk+'_by']||'?';
      if(e==='hincada'||e==='rechazo'){
        if(!byEq[eq])byEq[eq]={h:0,r:0};if(e==='hincada')byEq[eq].h++;else byEq[eq].r++;
        if(!byUs[usr])byUs[usr]={h:0,r:0};if(e==='hincada')byUs[usr].h++;else byUs[usr].r++;
      }
      if(!byPv[pk])byPv[pk]={t:0,h:0,r:0};byPv[pk].t++;if(e==='hincada')byPv[pk].h++;if(e==='rechazo')byPv[pk].r++;
    });
  });
  
  var pd=tp-hk-rj,pc=tp>0?Math.round(hk/tp*100):0;
  var h='<div class="grid g4">'+kp('Pilares',tp,'','','#8b8fa3')+kp('Hincados',hk,tp,pc,'#3ecf8e')+kp('Rechazos',rj,tp,tp>0?Math.round(rj/tp*100):0,'#ef4444')+kp('Pendientes',pd,tp,tp>0?Math.round(pd/tp*100):0,'#565a6e')+'</div>';
  
  // Status bar
  h+='<div class="grid g2"><div class="card"><div class="card-t">Estado</div>';
  h+='<div style="display:flex;justify-content:space-around;margin:16px 0">';
  h+='<div style="text-align:center"><div style="font-size:28px;font-weight:700;color:#3ecf8e">'+hk+'</div><div style="font-size:10px;color:#8b8fa3">Hincados</div></div>';
  h+='<div style="text-align:center"><div style="font-size:28px;font-weight:700;color:#ef4444">'+rj+'</div><div style="font-size:10px;color:#8b8fa3">Rechazos</div></div>';
  h+='<div style="text-align:center"><div style="font-size:28px;font-weight:700;color:#565a6e">'+pd+'</div><div style="font-size:10px;color:#8b8fa3">Pendientes</div></div>';
  h+='</div>';
  if(tp>0){h+='<div class="sbar"><div style="width:'+(hk/tp*100)+'%;background:#3ecf8e;color:#000">'+hk+'</div><div style="width:'+(rj/tp*100)+'%;background:#ef4444;color:#fff">'+rj+'</div><div style="width:'+Math.max(0,100-(hk+rj)/tp*100)+'%;background:#232636;color:#565a6e">'+pd+'</div></div>'}
  h+='</div>';
  
  // By PV
  h+='<div class="card"><div class="card-t">Por PV</div>';
  Object.keys(byPv).sort().forEach(function(pv){
    var p=byPv[pv],pp=p.t>0?Math.round(p.h/p.t*100):0;
    var bc=p.r>0?'#ef4444':pp>=100?'#3ecf8e':'#3b82f6';
    h+='<div class="pvr"><div style="font-weight:600;font-size:12px;min-width:70px">'+pv+'</div><div style="flex:1;height:8px;border-radius:4px;background:#0f1117;overflow:hidden"><div class="pbar-f" style="width:'+pp+'%;background:'+bc+'"></div></div><div style="font-size:12px;font-weight:600;min-width:44px;text-align:right;color:'+bc+'">'+pp+'%</div><div style="font-size:10px;color:#8b8fa3;min-width:50px;text-align:right">'+p.h+'/'+p.t+'</div></div>';
  });
  if(!Object.keys(byPv).length)h+='<div style="padding:16px;text-align:center;color:#565a6e;font-size:12px">Sin datos</div>';
  h+='</div></div>';
  
  // Equipos + Operadores
  h+='<div class="grid g2"><div class="card"><div class="card-t">Por Operador</div>';
  var uColors=['#3ecf8e','#3b82f6','#a78bfa','#f5a623','#ef4444'];
  Object.keys(byUs).sort(function(a,b){return(byUs[b].h+byUs[b].r)-(byUs[a].h+byUs[a].r)}).forEach(function(u,i){
    var v=byUs[u];
    h+='<div class="trow"><div style="width:32px;height:32px;border-radius:50%;background:'+uColors[i%uColors.length]+';display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff">'+u.substring(0,2).toUpperCase()+'</div><div style="flex:1"><div style="font-weight:600;font-size:13px">'+u+'</div><div style="font-size:11px;color:#8b8fa3">'+v.h+' ok'+(v.r>0?' · '+v.r+' rej':'')+'</div></div><div style="font-size:16px;font-weight:700;color:#3ecf8e">'+(v.h+v.r)+'</div></div>';
  });
  if(!Object.keys(byUs).length)h+='<div style="padding:16px;text-align:center;color:#565a6e;font-size:12px">Sin datos</div>';
  h+='</div>';
  
  // Rechazos
  h+='<div class="card"><div class="card-t" style="color:#ef4444">Rechazos ('+rjL.length+')</div>';
  if(!rjL.length)h+='<div style="padding:16px;text-align:center;color:#565a6e;font-size:12px">Sin rechazos</div>';
  else rjL.slice(0,15).forEach(function(r){h+='<div class="inc"><div style="font-weight:700;font-size:12px">'+r.t+' · '+r.p+'</div><div style="font-size:11px;color:#ef4444;margin-top:2px">'+r.m+'</div>'+(r.b?'<div style="font-size:10px;color:#565a6e;margin-top:2px">'+r.b+'</div>':'')+'</div>'});
  h+='</div></div>';
  
  el.innerHTML=h;
}

// QUALITY TAB
function rCal(){
  var el=document.getElementById('pcal');
  if(!D.qual&&!D.pl){el.innerHTML='<div style="padding:40px;text-align:center;color:#8b8fa3">Sin datos de calidad</div>';return}
  
  // Quality stats
  var qualTrackers=D.qual?Object.keys(D.qual).length:0;
  var totalTrackers=typeof MASTER_DATA!=='undefined'?Object.keys(MASTER_DATA).length:0;
  var qualPct=totalTrackers>0?Math.round(qualTrackers/totalTrackers*100):0;
  
  // Punchlist stats
  var pls=D.pl?Object.values(D.pl):[];
  var pe=pls.filter(function(p){return p.estado==='pendiente'}).length;
  var re=pls.filter(function(p){return p.estado==='reparado'}).length;
  var ve=pls.filter(function(p){return p.estado==='verificado'}).length;
  
  var h='<div class="grid g3">'+kp('Trackers con datos',qualTrackers,totalTrackers,qualPct,'#3ecf8e')+kp('Punchlist Pendientes',pe,'','','#ef4444')+kp('Punchlist Verificados',ve,'','','#3ecf8e')+'</div>';
  
  // Punchlist bar
  if(pe+re+ve>0){
    h+='<div class="grid" style="grid-template-columns:1fr"><div class="card"><div class="card-t">Punchlist</div>';
    h+='<div style="display:flex;justify-content:space-around;margin:16px 0">';
    h+='<div style="text-align:center"><div style="font-size:28px;font-weight:700;color:#ef4444">'+pe+'</div><div style="font-size:10px;color:#8b8fa3">Pendientes</div></div>';
    h+='<div style="text-align:center"><div style="font-size:28px;font-weight:700;color:#f5a623">'+re+'</div><div style="font-size:10px;color:#8b8fa3">Reparados</div></div>';
    h+='<div style="text-align:center"><div style="font-size:28px;font-weight:700;color:#3ecf8e">'+ve+'</div><div style="font-size:10px;color:#8b8fa3">Verificados</div></div>';
    h+='</div>';
    var plT=pe+re+ve;
    h+='<div class="sbar"><div style="width:'+(pe/plT*100)+'%;background:#ef4444;color:#fff">'+pe+'</div><div style="width:'+(re/plT*100)+'%;background:#f5a623;color:#000">'+re+'</div><div style="width:'+(ve/plT*100)+'%;background:#3ecf8e;color:#000">'+ve+'</div></div>';
    h+='</div></div>';
  }
  
  // Quality by PV
  if(D.qual&&typeof MASTER_DATA!=='undefined'){
    var byPv={};
    Object.keys(D.qual).forEach(function(code){
      var m=MASTER_DATA[code];if(!m)return;
      var pk='PV'+String(m.pv).padStart(2,'0');
      if(!byPv[pk])byPv[pk]={t:0,d:0};
      byPv[pk].d++;
    });
    Object.values(MASTER_DATA).forEach(function(m){
      var pk='PV'+String(m.pv).padStart(2,'0');
      if(!byPv[pk])byPv[pk]={t:0,d:0};
      byPv[pk].t++;
    });
    
    h+='<div class="grid" style="grid-template-columns:1fr"><div class="card"><div class="card-t">Calidad por PV</div>';
    Object.keys(byPv).sort().forEach(function(pv){
      var p=byPv[pv],pp=p.t>0?Math.round(p.d/p.t*100):0;
      var bc=pp>=100?'#3ecf8e':pp>0?'#3b82f6':'#2a2d3a';
      h+='<div class="pvr"><div style="font-weight:600;font-size:12px;min-width:70px">'+pv+'</div><div style="flex:1;height:8px;border-radius:4px;background:#0f1117;overflow:hidden"><div class="pbar-f" style="width:'+pp+'%;background:'+bc+'"></div></div><div style="font-size:12px;font-weight:600;min-width:44px;text-align:right;color:'+bc+'">'+pp+'%</div><div style="font-size:10px;color:#8b8fa3;min-width:50px;text-align:right">'+p.d+'/'+p.t+'</div></div>';
    });
    h+='</div></div>';
  }
  
  // Pending punchlist items
  var pend=pls.filter(function(p){return p.estado==='pendiente'});
  if(pend.length>0){
    h+='<div class="grid" style="grid-template-columns:1fr"><div class="card"><div class="card-t" style="color:#ef4444">Punchlist Pendientes ('+pend.length+')</div>';
    pend.slice(0,15).forEach(function(p){
      h+='<div class="inc"><div style="font-weight:700;font-size:12px">'+(p.tracker||'?')+' · '+(p.pilar||'?')+'</div><div style="font-size:11px;color:#ef4444;margin-top:2px">'+(p.desc||'')+'</div>'+(p.detectadoPor?'<div style="font-size:10px;color:#565a6e;margin-top:2px">'+p.detectadoPor+'</div>':'')+'</div>';
    });
    h+='</div></div>';
  }
  
  el.innerHTML=h;
}
</script>
</body>
</html>
