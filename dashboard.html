<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard — ISFV ATALAYA</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="master.js"></script>
<style>
:root{--bg:#0f1117;--card:#1c1f2a;--bd:#2a2d3a;--tx:#e8eaed;--tx2:#8b8fa3;--tx3:#565a6e;--ac:#3ecf8e;--warn:#f5a623;--err:#ef4444;--info:#3b82f6}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
.mono{font-family:'JetBrains Mono',monospace}
.top{display:flex;align-items:center;justify-content:space-between;padding:20px 28px;border-bottom:1px solid var(--bd)}
.top h1{font-size:22px;font-weight:700}
.top .sub{font-size:12px;color:var(--tx2);margin-top:2px}
.live{font-size:11px;padding:4px 10px;border-radius:20px;background:rgba(62,207,142,.15);color:var(--ac);font-weight:600}
.live::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ac);margin-right:6px;animation:pu 2s infinite}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.3}}
.tabs{display:flex;padding:0 28px;border-bottom:1px solid var(--bd)}
.tab{padding:12px 24px;font-size:14px;font-weight:600;border:none;cursor:pointer;border-bottom:2px solid transparent;color:var(--tx2);background:transparent}
.tab.on{border-bottom-color:var(--info);color:var(--info)}
.tab:nth-child(2).on{border-bottom-color:var(--ac);color:var(--ac)}
.grid{display:grid;gap:16px;padding:20px 28px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}.g1{grid-template-columns:1fr}
@media(max-width:900px){.g4,.g3,.g2{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px;position:relative}
.card-t{font-size:12px;font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.card-v{font-size:36px;font-weight:700;letter-spacing:-1px}
.card-s{font-size:13px;color:var(--tx2);margin-top:6px}
.card-pct{position:absolute;top:18px;right:18px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px}
.pbar{height:6px;border-radius:3px;background:var(--bg);margin-top:12px;overflow:hidden}
.pbar-f{height:100%;border-radius:3px;transition:width 1.5s}
.sbar{display:flex;border-radius:8px;overflow:hidden;height:32px;margin-top:8px}
.sbar div{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
.trow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--bd)}
.trow:last-child{border-bottom:none}
.tava{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;flex-shrink:0}
.pvr{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(42,45,58,.5)}
.pvr:last-child{border-bottom:none}
.inc{padding:10px 12px;border-radius:10px;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.15);margin-bottom:6px}
.wfb{font-size:9px;padding:2px 6px;border-radius:10px;font-weight:600}
</style>
</head>
<body>
<div class="top"><div><h1>Dashboard</h1><div class="sub">ISFV ATALAYA · XAMAI / X-ELIO</div></div><span class="live" id="st">Conectando...</span></div>
<div class="tabs"><button class="tab on" onclick="sw('con',this)">🏗️ Construcción</button><button class="tab" onclick="sw('cal',this)">✅ Calidad</button></div>
<div id="pcon"></div><div id="pcal" style="display:none"></div>
<script>
firebase.initializeApp({apiKey:"AIzaSyBHKN65MLHScTNN-L5HwfvWqafAkfsFiAU",authDomain:"construccionxamai.firebaseapp.com",databaseURL:"https://construccionxamai-default-rtdb.europe-west1.firebasedatabase.app",projectId:"construccionxamai",storageBucket:"construccionxamai.firebasestorage.app",messagingSenderId:"71667188901",appId:"1:71667188901:web:663c605a1fbe53a3caf94c"});
var db=firebase.database(),auth=firebase.auth(),D={con:{},wf:{},pl:{},log:[],qual:{},qlog:[]},ld=0;

// Try to start immediately, auth or not
document.getElementById('st').textContent='Conectando...';

// If auth available, wait briefly for it; otherwise start anyway
var authTimeout=setTimeout(function(){startListeners()},2000);
auth.onAuthStateChanged(function(user){
  clearTimeout(authTimeout);
  startListeners();
});

var listenersStarted=false;
function startListeners(){
  if(listenersStarted)return;
  listenersStarted=true;


function rdy(){ld++;if(ld>=3){document.getElementById('st').textContent='En vivo';document.getElementById('st').style.background='rgba(62,207,142,.15)';document.getElementById('st').style.color='#3ecf8e';renderAll()}}

  db.ref('construction').on('value',function(s){D.con=s.val()||{};rdy();if(ld>=3)renderAll()},function(e){console.error('construction error:',e);showErr('construction: '+e.message);rdy()});
  db.ref('workflow').on('value',function(s){D.wf=s.val()||{};rdy();if(ld>=3)renderAll()},function(e){console.error('workflow error:',e);showErr('workflow: '+e.message);rdy()});
  db.ref('punchlist').on('value',function(s){D.pl=s.val()||{};rdy();if(ld>=3)renderAll()},function(e){console.error('punchlist error:',e);showErr('punchlist: '+e.message);rdy()});
  db.ref('con_log').limitToLast(5000).on('value',function(s){D.log=Object.values(s.val()||{})},function(e){console.error('con_log error:',e)});
  db.ref('quality').on('value',function(s){D.qual=s.val()||{};if(ld>=3)renderAll()},function(e){console.error('quality error:',e)});
  db.ref('quality_log').limitToLast(5000).on('value',function(s){D.qlog=Object.values(s.val()||{});if(ld>=3)renderAll()},function(e){console.error('qlog error:',e)});
  
  // Timeout fallback — render whatever we have after 8 seconds
  setTimeout(function(){
    if(ld<3){
      document.getElementById('st').textContent='Parcial ('+ld+'/3)';
      renderAll();
    }
  },8000);
}

function showErr(msg){
  document.getElementById('st').textContent='Error';
  document.getElementById('st').style.background='rgba(239,68,68,.15)';
  document.getElementById('st').style.color='#ef4444';
  document.getElementById('pcon').innerHTML='<div style="padding:40px;text-align:center;color:#ef4444"><div style="font-size:28px;margin-bottom:12px">⚠️</div><div style="font-size:14px;font-weight:600;margin-bottom:8px">Error de permisos</div><div style="font-size:12px;color:#8b8fa3">'+msg+'</div><div style="font-size:12px;color:#8b8fa3;margin-top:12px">Ve a Firebase Console → Realtime Database → Reglas y pon:<br><code style="background:#1c1f2a;padding:4px 8px;border-radius:4px;margin-top:4px;display:inline-block">".read": "auth != null"</code></div></div>';
}
function renderAll(){rCon();rCal()}
function kp(t,v,tot,pct,c){var h='<div class="card"><div class="card-t">'+t+'</div><div class="card-v" style="color:'+c+'">'+v+'</div>';if(tot)h+='<div class="card-s">/ '+tot+'</div>';if(pct!==undefined)h+='<div class="card-pct" style="background:'+c+'22;color:'+c+'">'+pct+'%</div>';if(tot)h+='<div class="pbar"><div class="pbar-f" style="width:'+pct+'%;background:'+c+'"></div></div>';return h+'</div>'}
function sn(n,l,c){return'<div style="text-align:center"><div style="font-size:28px;font-weight:700;color:'+c+'">'+n+'</div><div style="font-size:10px;color:var(--tx2)">'+l+'</div></div>'}

function rCon(){
  var el=document.getElementById('pcon');
  var tp=0,hk=0,rj=0,byEq={},byTp={},byPv={},byUs={},rjL=[];
  Object.keys(D.con).forEach(function(code){var tr=D.con[code];var m=typeof MASTER_DATA!=='undefined'?MASTER_DATA[code]:null;var pk=m?'PV'+String(m.pv).padStart(2,'0'):'?';
    Object.keys(tr).forEach(function(k){var p=k.match(/^(fm|fc)_(\d+)_estado$/);if(!p)return;tp++;var e=tr[k],bk=p[1]+'_'+p[2];
      if(e==='hincada')hk++;else if(e==='rechazo'){rj++;rjL.push({t:code,p:bk,m:tr[bk+'_motivo']||'Sin motivo',b:tr[bk+'_by']||''})}
      var eq=tr[bk+'_equipo']||'Sin equipo',tipo=tr[bk+'_tipo']||'Sin tipo',usr=tr[bk+'_by']||'?';
      if(e==='hincada'||e==='rechazo'){if(!byEq[eq])byEq[eq]={h:0,r:0};if(e==='hincada')byEq[eq].h++;else byEq[eq].r++;if(!byTp[tipo])byTp[tipo]=0;byTp[tipo]++;if(!byUs[usr])byUs[usr]={h:0,r:0};if(e==='hincada')byUs[usr].h++;else byUs[usr].r++}
      if(!byPv[pk])byPv[pk]={t:0,h:0,r:0};byPv[pk].t++;if(e==='hincada')byPv[pk].h++;if(e==='rechazo')byPv[pk].r++
    })});
  var pd=tp-hk-rj,pc=tp>0?Math.round(hk/tp*100):0;
  var byDay={};D.log.forEach(function(e){if(!e.ts)return;var d=new Date(e.ts),k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');if(!byDay[k])byDay[k]=0;byDay[k]++});
  var h='<div class="grid g4">'+kp('Pilares',tp,'','','var(--tx2)')+kp('Hincados',hk,tp,pc,'var(--ac)')+kp('Rechazos',rj,tp,tp>0?Math.round(rj/tp*100):0,'var(--err)')+kp('Pendientes',pd,tp,tp>0?Math.round(pd/tp*100):0,'var(--tx3)')+'</div>';
  h+='<div class="grid g2"><div class="card"><div class="card-t">Estado</div><div style="display:flex;justify-content:space-around;margin:16px 0 8px">'+sn(hk,'Hincados','var(--ac)')+sn(rj,'Rechazos','var(--err)')+sn(pd,'Pendientes','var(--tx3)')+'</div>';
  if(tp>0){h+='<div class="sbar"><div style="width:'+(hk/tp*100)+'%;background:var(--ac);color:#000">'+hk+'</div><div style="width:'+(rj/tp*100)+'%;background:var(--err);color:#fff">'+rj+'</div><div style="width:'+Math.max(0,100-(hk+rj)/tp*100)+'%;background:#232636;color:var(--tx3)">'+pd+'</div></div>'}
  h+='</div><div class="card"><div class="card-t">Actividad Diaria</div><div style="height:180px"><canvas id="cc"></canvas></div></div></div>';
  // Users + Equipos + Tipos
  var uc=['#3ecf8e','#3b82f6','#a78bfa','#f5a623','#ef4444','#ec4899'];
  h+='<div class="grid g3"><div class="card"><div class="card-t">Por Operador</div>';
  Object.keys(byUs).sort(function(a,b){return(byUs[b].h+byUs[b].r)-(byUs[a].h+byUs[a].r)}).forEach(function(u,i){var v=byUs[u];h+='<div class="trow"><div class="tava" style="background:'+uc[i%uc.length]+'">'+u.substring(0,2).toUpperCase()+'</div><div style="flex:1"><div style="font-weight:600;font-size:13px">'+u+'</div><div style="font-size:11px;color:var(--tx2)">'+v.h+' hincados'+(v.r>0?' · '+v.r+' rechazos':'')+'</div></div><div style="font-size:16px;font-weight:700;color:var(--ac)">'+(v.h+v.r)+'</div></div>'});
  h+='</div><div class="card"><div class="card-t">Por Equipo</div>';
  Object.keys(byEq).sort().forEach(function(eq){var v=byEq[eq];h+='<div class="trow"><div class="tava" style="background:var(--info)">🔨</div><div style="flex:1"><div style="font-weight:600;font-size:13px">'+eq+'</div><div style="font-size:11px;color:var(--tx2)">'+v.h+' ok'+(v.r>0?' · '+v.r+' rej':'')+'</div></div><div style="font-size:16px;font-weight:700">'+(v.h+v.r)+'</div></div>'});
  h+='</div><div class="card"><div class="card-t">Por Tipo</div>';
  var ti={directa:'🔨',zapata:'🧱',predrill:'🕳️'},tt=Object.values(byTp).reduce(function(a,b){return a+b},0)||1;
  Object.keys(byTp).sort().forEach(function(t){var n=byTp[t],p=Math.round(n/tt*100);h+='<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)"><span style="font-size:20px">'+(ti[t]||'📌')+'</span><div style="flex:1"><div style="font-weight:600;font-size:13px">'+t+'</div><div class="pbar" style="height:4px;margin-top:4px"><div class="pbar-f" style="width:'+p+'%;background:var(--info)"></div></div></div><div style="font-size:14px;font-weight:700">'+n+' <span style="font-size:10px;color:var(--tx2)">('+p+'%)</span></div></div>'});
  h+='</div></div>';
  // PV + Rechazos
  h+='<div class="grid g2"><div class="card"><div class="card-t">Por PV</div>';
  Object.keys(byPv).sort().forEach(function(pv){var p=byPv[pv],pp=p.t>0?Math.round(p.h/p.t*100):0,bc=p.r>0?'var(--err)':pp>=100?'var(--ac)':'var(--info)';h+='<div class="pvr"><div style="font-weight:600;font-size:12px;min-width:70px">'+pv+'</div><div style="flex:1;height:8px;border-radius:4px;background:var(--bg);overflow:hidden"><div class="pbar-f" style="width:'+pp+'%;background:'+bc+'"></div></div><div style="font-size:12px;font-weight:600;min-width:44px;text-align:right;color:'+bc+'">'+pp+'%</div><div style="font-size:10px;color:var(--tx2);min-width:50px;text-align:right">'+p.h+'/'+p.t+'</div></div>'});
  h+='</div><div class="card"><div class="card-t" style="color:var(--err)">Rechazos ('+rjL.length+')</div>';
  if(!rjL.length)h+='<div style="padding:16px;text-align:center;color:var(--tx3)">Sin rechazos</div>';
  else rjL.slice(0,20).forEach(function(r){h+='<div class="inc"><div style="font-weight:700;font-size:12px">'+r.t+' · '+r.p+'</div><div style="font-size:11px;color:var(--err);margin-top:2px">'+r.m+'</div>'+(r.b?'<div style="font-size:10px;color:var(--tx3);margin-top:2px">👤 '+r.b+'</div>':'')+'</div>'});
  h+='</div></div>';
  // Workflow
  var wk=Object.keys(D.wf).sort();
  if(wk.length>0){h+='<div class="grid g1"><div class="card"><div class="card-t">Workflow</div><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px">';
    wk.forEach(function(k){var w=D.wf[k],s=WF[w.state]||WF.CON,pts=k.split('_');h+='<div style="padding:10px;border-radius:8px;background:var(--bg);border:1px solid var(--bd)"><div style="font-weight:600;font-size:12px">PV'+pts[0]+'/S'+pts[1]+' · '+pts[2]+'</div><div style="margin-top:4px"><span class="wfb" style="background:'+s.c+'22;color:'+s.c+'">'+s.i+' '+s.l+'</span></div>'+(w.by?'<div style="font-size:9px;color:var(--tx3);margin-top:4px">'+w.by+'</div>':'')+'</div>'});
    h+='</div></div></div>'}
  el.innerHTML=h;
  setTimeout(function(){drw('cc',byDay,'59,130,246')},50);
}

function rCal(){
  var el=document.getElementById('pcal');
  
  // Count quality stats from Firebase data
  var totalTr=0,doneTr=0,wipTr=0,badTr=0;
  var byTec={},byPv={};
  var incidents=[];
  
  // MED/COMP field definitions for tolerance checks
  var tolFields={vert_ns:[88,92],vert_eo:[88,92]};
  var compDefs={galvanizado:'SI',golpes:'NO',entalladura:'NO',pliegue:'NO',cabezas:'NO',corte:'NO',mecanizados:'NO',orientacion:'SI',perfil:'SI',oxidacion:'NO',socavones:'NO',cimentacion:'SI',zanjas:'NO'};
  
  Object.keys(D.qual).forEach(function(code){
    var qd=D.qual[code];
    var m=typeof MASTER_DATA!=='undefined'?MASTER_DATA[code]:null;
    if(!m)return;
    totalTr++;
    
    var pvKey='PV'+String(m.pv).padStart(2,'0');
    if(!byPv[pvKey])byPv[pvKey]={t:0,d:0,b:0};
    byPv[pvKey].t++;
    
    // Check fields
    var filled=0,total=0,hasBad=false;
    Object.keys(qd).forEach(function(k){
      // Count MED fields
      var medMatch=k.match(/^(fm|fc)_\d+_(altura|dist_ns_tramo|vert_ns|vert_eo)$/);
      if(medMatch){
        total++;filled++;
        var v=qd[k];
        if(tolFields[medMatch[2]]&&typeof v==='number'){
          if(v<tolFields[medMatch[2]][0]||v>tolFields[medMatch[2]][1]){
            hasBad=true;
            incidents.push({t:code,pv:pvKey,f:k,v:v});
          }
        }
      }
      // Count COMP fields
      var compMatch=k.match(/^(fm|fc)_\d+_(galvanizado|golpes|entalladura|pliegue|cabezas|corte|mecanizados|orientacion|perfil|oxidacion|socavones|cimentacion|zanjas)$/);
      if(compMatch){
        total++;filled++;
        var v2=qd[k];
        if(compDefs[compMatch[2]]&&v2!==compDefs[compMatch[2]]){
          hasBad=true;
        }
      }
      // Mont/Mod
      if(k.indexOf('mont_')===0||k.indexOf('mod_')===0){total++;filled++}
    });
    
    if(filled>0&&!hasBad)doneTr++;
    if(filled>0&&hasBad){badTr++;byPv[pvKey].b++}
    if(filled>0){wipTr++;byPv[pvKey].d++}
  });
  
  // Quality log stats
  var qByDay={},qByTec={};
  D.qlog.forEach(function(l){
    if(!l.ts)return;
    var d=new Date(l.ts);
    var dk=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if(!qByDay[dk])qByDay[dk]=0;
    qByDay[dk]++;
    if(l.by){if(!qByTec[l.by])qByTec[l.by]=0;qByTec[l.by]++}
  });
  
  var totalChanges=D.qlog.length;
  var workDays=Object.keys(qByDay).length;
  var dailyAvg=workDays>0?Math.round(totalChanges/workDays):0;
  
  // Punchlist
  var pls=Object.values(D.pl);
  var pe=pls.filter(function(p){return p.estado==='pendiente'}).length;
  var re=pls.filter(function(p){return p.estado==='reparado'}).length;
  var ve=pls.filter(function(p){return p.estado==='verificado'}).length;
  
  var h='';
  
  // KPIs
  h+='<div class="grid g4">';
  h+=kp('Trackers Inspeccionados',wipTr,totalTr,totalTr>0?Math.round(wipTr/totalTr*100):0,'var(--ac)');
  h+=kp('Registros Campo',totalChanges,'','','var(--info)');
  h+=kp('Con Incidencias',badTr,totalTr,totalTr>0?Math.round(badTr/totalTr*100):0,'var(--err)');
  h+=kp('Media Diaria',dailyAvg,'','','var(--tx2)');
  h+='</div>';
  
  // Daily chart + Punchlist KPIs
  h+='<div class="grid g2">';
  h+='<div class="card"><div class="card-t">Actividad Diaria Calidad</div><div style="height:180px"><canvas id="qchart"></canvas></div></div>';
  h+='<div class="card"><div class="card-t">Punchlist</div>';
  h+='<div style="display:flex;justify-content:space-around;margin:16px 0">';
  h+=sn(pe,'Pendientes','var(--err)');
  h+=sn(re,'Reparados','var(--warn)');
  h+=sn(ve,'Verificados','var(--ac)');
  h+='</div>';
  if(pe+re+ve>0){
    var plT=pe+re+ve;
    h+='<div class="sbar">';
    h+='<div style="width:'+(pe/plT*100)+'%;background:var(--err);color:#fff">'+pe+'</div>';
    h+='<div style="width:'+(re/plT*100)+'%;background:var(--warn);color:#000">'+re+'</div>';
    h+='<div style="width:'+(ve/plT*100)+'%;background:var(--ac);color:#000">'+ve+'</div>';
    h+='</div>';
  }
  h+='</div></div>';
  
  // By technician + By PV
  h+='<div class="grid g2">';
  
  h+='<div class="card"><div class="card-t">Por Técnico</div>';
  var tecs=Object.keys(qByTec).sort(function(a,b){return qByTec[b]-qByTec[a]});
  var tc2=['#3ecf8e','#3b82f6','#a78bfa','#f5a623','#ef4444','#ec4899'];
  tecs.forEach(function(t,i){
    h+='<div class="trow"><div class="tava" style="background:'+tc2[i%tc2.length]+'">'+t.substring(0,2).toUpperCase()+'</div>';
    h+='<div style="flex:1"><div style="font-weight:600;font-size:13px">'+t+'</div>';
    h+='<div style="font-size:11px;color:var(--tx2)">'+qByTec[t]+' registros</div></div>';
    h+='<div style="font-size:16px;font-weight:700;color:var(--ac)">'+qByTec[t]+'</div></div>';
  });
  if(!tecs.length)h+='<div style="padding:16px;text-align:center;color:var(--tx3);font-size:12px">Sin datos</div>';
  h+='</div>';
  
  h+='<div class="card"><div class="card-t">Calidad por PV</div>';
  Object.keys(byPv).sort().forEach(function(pv){
    var p=byPv[pv];var pp=p.t>0?Math.round(p.d/p.t*100):0;
    var bc=p.b>0?'var(--err)':pp>=100?'var(--ac)':'var(--info)';
    h+='<div class="pvr"><div style="font-weight:600;font-size:12px;min-width:70px">'+pv+'</div>';
    h+='<div style="flex:1;height:8px;border-radius:4px;background:var(--bg);overflow:hidden"><div class="pbar-f" style="width:'+pp+'%;background:'+bc+'"></div></div>';
    h+='<div style="font-size:12px;font-weight:600;min-width:44px;text-align:right;color:'+bc+'">'+pp+'%</div>';
    h+='<div style="font-size:10px;color:var(--tx2);min-width:50px;text-align:right">'+p.d+'/'+p.t+'</div></div>';
  });
  if(!Object.keys(byPv).length)h+='<div style="padding:16px;text-align:center;color:var(--tx3);font-size:12px">Sin datos</div>';
  h+='</div>';
  
  h+='</div>';
  
  // Incidents
  if(incidents.length>0){
    h+='<div class="grid g1"><div class="card"><div class="card-t" style="color:var(--err)">Incidencias de Tolerancia ('+incidents.length+')</div>';
    incidents.slice(0,20).forEach(function(inc){
      h+='<div class="inc"><div style="font-weight:700;font-size:12px">'+inc.t+' <span style="font-size:10px;color:var(--tx3)">'+inc.pv+'</span></div>';
      h+='<div style="font-size:11px;color:var(--err);margin-top:2px">'+inc.f+': '+inc.v+'°</div></div>';
    });
    h+='</div></div>';
  }
  
  // Pending punchlist
  var pend=pls.filter(function(p){return p.estado==='pendiente'});
  if(pend.length>0){
    h+='<div class="grid g1"><div class="card"><div class="card-t" style="color:var(--err)">Punchlist Pendientes ('+pend.length+')</div>';
    pend.slice(0,20).forEach(function(p){
      h+='<div class="inc"><div style="font-weight:700;font-size:12px">'+(p.tracker||'?')+' · '+(p.pilar||'?')+'</div>';
      h+='<div style="font-size:11px;color:var(--err);margin-top:2px">'+p.desc+'</div>';
      if(p.detectadoPor)h+='<div style="font-size:10px;color:var(--tx3);margin-top:2px">'+p.detectadoPor+'</div>';
      h+='</div>';
    });
    h+='</div></div>';
  }
  
  el.innerHTML=h;
  setTimeout(function(){drw('qchart',qByDay,'34,197,94')},50);
}

function drw(id,bd,rgb){
  var cv=document.getElementById(id);if(!cv)return;cv.width=cv.offsetWidth*2;cv.height=cv.offsetHeight*2;var ctx=cv.getContext('2d');ctx.scale(2,2);
  var W=cv.offsetWidth,H=cv.offsetHeight,p={l:40,r:10,t:10,b:28},cW=W-p.l-p.r,cH=H-p.t-p.b;
  var ds=Object.keys(bd).sort().slice(-30);if(!ds.length){ctx.fillStyle='#565a6e';ctx.font='12px DM Sans';ctx.textAlign='center';ctx.fillText('Sin datos',W/2,H/2);return}
  var vs=ds.map(function(d){return bd[d]}),mx=Math.max.apply(null,vs)||1,bw=Math.max((cW/ds.length)-3,4);
  ctx.strokeStyle='rgba(255,255,255,0.05)';ctx.lineWidth=1;
  for(var i=0;i<=4;i++){var y=p.t+cH-cH*(i/4);ctx.beginPath();ctx.moveTo(p.l,y);ctx.lineTo(W-p.r,y);ctx.stroke();ctx.fillStyle='#565a6e';ctx.font='500 9px JetBrains Mono';ctx.textAlign='right';ctx.fillText(Math.round(mx*i/4),p.l-6,y+3)}
  ds.forEach(function(d,i){var v=vs[i],bH=cH*(v/mx),x=p.l+i*(cW/ds.length)+(cW/ds.length-bw)/2,y=p.t+cH-bH;
    var g=ctx.createLinearGradient(x,y,x,p.t+cH);g.addColorStop(0,'rgba('+rgb+',0.9)');g.addColorStop(1,'rgba('+rgb+',0.2)');ctx.fillStyle=g;
    var r=Math.min(bw/2,3);ctx.beginPath();ctx.moveTo(x,p.t+cH);ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.arcTo(x+bw,y,x+bw,y+r,r);ctx.lineTo(x+bw,p.t+cH);ctx.fill();
    if(ds.length<=15||i%Math.ceil(ds.length/10)===0){ctx.fillStyle='#565a6e';ctx.font='500 8px JetBrains Mono';ctx.textAlign='center';ctx.fillText(d.substring(5),x+bw/2,H-6)}})
}
</script>
