name: bancos
# Bancos de la app: perfiles de planta, guard de textos fijos, arranque en navegador (B2.1) y lo no
# registrado en pantalla y en los Excel exportados (B3). Firebase falso: sin red ni datos reales.
# Ejecutores de GitHub; el repo es público.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  bancos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Playwright, Chromium y JSZip (el mismo 3.10.1 que carga la app, para leer los Excel exportados)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0 jszip@3.10.1
          npx playwright install --with-deps chromium
      - name: Bancos
        run: bash tests/correr.sh
